let scanDone = [];

/* ----- key admin (2026-10-13) -----
   Menu → Key admin: a search box and every bundle. Tap one, change what is wrong, Save. One page
   per bundle holds everything: the apartment it belongs to, a comment, the keys on it, and where
   it is now. Save sends only what changed. The server checks the admin login on every call
   (functions/api/keys-admin.js); `admOn` is only a hint on this phone for showing Edit on the
   bundle sheet. A status correction is a new event marked as corrected - nothing earlier is
   rewritten. Needs the network: an admin change is never queued. */
let admOn = (()=>{ try{ return localStorage.getItem('beaps-admin') === '1' }catch(e){ return false } })();
const setAdm = v => { admOn = !!v; try{ v ? localStorage.setItem('beaps-admin','1') : localStorage.removeItem('beaps-admin') }catch(e){} };
async function admCall(body){
  try{
    const r = await withTimeout(fetch('/api/keys-admin', {method:'POST', headers:{...AUTH, 'Content-Type':'application/json'}, body: JSON.stringify(body)}), 20000);
    let j = {}; try{ j = await r.json() }catch(e){}
    return { status: r.status, j };
  }catch(e){ return { status: 0, j: {} } }
}
let admQ = '', admF = 'all';
function admSheet(id, html){
  let el = document.getElementById(id);
  if(!el){ el = document.createElement('div'); el.className = 'sheet hasbar ksheet'; el.id = id; document.body.appendChild(el) }
  el.innerHTML = html;
  return el;
}
const closeAdmin = () => { const el = document.getElementById('admin'); if(el) el.remove() };
async function openAdmin(){
  await keyBoot();
  admSheet('admin', topbar(T('Key admin'), '', null, 'closeAdmin()') + `<div class="wrap"><div class="hint">${T('Updating…')}</div></div>`);
  window.scrollTo(0,0);
  const r = await admCall({op:'check'});
  if(!document.getElementById('admin')) return;
  if(r.status === 200 && r.j.admin){ setAdm(true); paintAdmin(); keySync(true).then(()=>{ if(document.getElementById('admin') && !document.getElementById('aedit')) paintAdminList() }); return }
  setAdm(false);
  const msg = r.status === 0 ? T('No contact with the server')
    : r.status === 404 ? T('Not available on this address')
    : (r.status === 200 && !r.j.configured) ? T('Admin is not set up on the server (ADMIN_PASSWORD).')
    : '';
  admSheet('admin', topbar(T('Key admin'), '', null, 'closeAdmin()') + `<div class="wrap"><div class="card">
      ${msg ? `<div class="hint" style="margin:0">${msg}</div>` : `
      <form onsubmit="return admLogin(event)"><div class="field"><label class="eyebrow">${T('Admin password')}</label>
        <input id="admpw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div></form>
      <div class="hint" id="admerr" style="color:var(--rec);display:none"></div>`}
    </div></div>
    <div class="sheetbar"><button class="btn ghost" onclick="closeAdmin()">${T('Close')}</button>
      ${msg ? '' : `<button class="btn" id="admbtn" onclick="admLogin()">${T('Log in')}</button>`}</div>`);
}
async function admLogin(ev){
  if(ev) ev.preventDefault();
  const pw = document.getElementById('admpw'), err = document.getElementById('admerr'), btn = document.getElementById('admbtn');
  if(!pw || !pw.value) return false;
  if(btn) btn.disabled = true;
  const r = await admCall({op:'login', password: pw.value});
  if(r.status === 200 && r.j.ok){
    setAdm(true);
    const back = admAfter, open = document.getElementById('aedit'), tags = document.getElementById('atags'); admAfter = null;
    if((open && ae) || (tags && tg)){ paintAdmin(); if(open && ae) document.body.appendChild(open); if(tags && tg) document.body.appendChild(tags); return false }
    paintAdmin(); keySync(true).then(paintAdminList);
    if(back) openAdmEdit(back);
    return false;
  }
  if(btn) btn.disabled = false;
  err.textContent = r.status === 401 ? T('Wrong password.') : r.status === 429 ? T('Too many attempts. Wait fifteen minutes and try again.')
    : r.status === 0 ? T('No contact with the server') : T('Could not log in') + ' (' + r.status + ')';
  err.style.display = 'block'; pw.value = '';
  return false;
}
// Empties the key log for a fresh start: every bundle shows in the cabinet, the log starts over.
// Nothing is deleted on the server, so it can be taken back (admUnreset). Asks first: this is the
// one admin step that makes a whole screen of information disappear.
async function admReset(){
  if(!confirm(T('Empty the key log? Every bundle shows as in the cabinet and the log starts over. It can be undone here.'))) return;
  const r = await admCall({op:'reset', confirm:'TOM'});
  if(!admOk(r)) return;
  if(!r.j.ok) return toast(T('Could not save') + ' (' + r.status + ')');
  await keyEpochSet(r.j.epoch); applyEvents(); await keyRemember();
  if(keySyncP) await keySyncP;    // one already on its way read the log as it was
  await keySync(true);
  toast(T('Key log emptied')); paintAdmin();
}
async function admUnreset(){
  const r = await admCall({op:'unreset'});
  if(!admOk(r)) return;
  if(!r.j.ok) return toast(T('Could not save') + ' (' + r.status + ')');
  await keyEpochSet(0);
  if(keySyncP) await keySyncP;
  await keySync(true); applyEvents();
  toast(T('Key log restored')); paintAdmin();
}
async function admLogout(){ await admCall({op:'logout'}); setAdm(false); closeAdmin(); toast(T('Logged out')) }
function paintAdmin(){

// The admin list as a table, like the key log (Erik, 2026-10-14): search box, quick filters,
// click a heading to sort (again to turn it round), tap a row to edit. Every word searched for has
// to match somewhere in the row.
const ADM_COLS = [['id','Bundle'], ['apt','Apartment'], ['status','Status'], ['where','Where'], ['keys','Keys'], ['c','Comment'], ['ts','Since']];
let admSort = ['id', 1];
function admSortBy(col){ admSort = admSort[0] === col ? [col, -admSort[1]] : [col, col === 'ts' ? -1 : 1]; paintAdminList() }
function paintAdminList(){
  const box = document.getElementById('admlist'); if(!box) return;
  const ws = qWords(admQ);
  const kOk = k => admF === 'all' || (admF === 'apt' ? IN_APT.includes(k) : k === admF);
  const all = regAll().map(b => { const s = bstate(b.id), k = stKind(s);
    return { id: b.id, b, s, k, status: k, apt: 'lgh ' + b.l + (b.n ? ' ' + b.n : ''), addr: b.a || '', where: stWhere(s),
             keys: keyCount(b.k), koff: keyOffCount(b.k), c: b.c || '', ts: k === 'in' ? 0 : (s.since || 0) } });
  const [col, dir] = admSort;
  const cmp = col === 'keys' ? (x, y) => x.keys - y.keys : cmpBy(col);
  const rows = all.filter(r => kOk(r.k) && (!ws.length || rowHits([r.id, r.apt, r.addr, r.where, r.c, stText(r.s), r.b.off ? T('Archived') : ''].join(' '), ws)))
    .sort((x, y) => dir * cmp(x, y));
  const LIMIT = 400, list = rows.slice(0, LIMIT);
  const cnt = f => all.filter(r => f === 'apt' ? IN_APT.includes(r.k) : r.k === f).length;
  const cell = (r, c) => {
    if(c === 'id') return `<b>${esc(r.id)}</b>`;
    if(c === 'apt') return esc(r.apt) + (r.addr ? `<div class="kladdr">${esc(r.addr)}</div>` : '');
    if(c === 'status') return r.b.conf && r.b.conf.length ? `<span class="kstat out">${T('Conflict')}</span>`
      : r.b.off ? `<span class="kstat unk">${T('Archived')}</span>` : `<span class="kstat ${stClass(r.k)}">${stText(r.s)}</span>`;
    if(c === 'ts'){ if(!r.ts) return ''; const t = stamp(new Date(r.ts)); return '<span class="klyr">' + esc(t.slice(0,5)) + '</span>' + esc(t.slice(5)) }
    if(c === 'c') return cmtCell(r.id, r.c);
    if(c === 'keys') return r.koff ? `${r.keys} <span class="kladdr">+${r.koff} ${T('inactive')}</span>` : String(r.keys);
    return esc(String(r[c] || ''));
  };
  box.innerHTML = `<div class="chips" style="margin:0 0 10px">${[['all','All'],['apt','In the apartment'],['lost','Lost']].map(([f, l]) =>
      `<button class="chip${admF===f?' on':''}" onclick="admF='${f}';paintAdminList()">${T(l)}${f !== 'all' ? ' · ' + cnt(f) : ''}</button>`).join('')}</div>
    <div class="klcount">${rows.length === all.length ? all.length + ' ' + T('bundles') : rows.length + ' ' + T('of') + ' ' + all.length + ' ' + T('bundles')}</div>
    <div class="kltable-wrap"><table class="kltable">
      <thead><tr>${ADM_COLS.map(([c, label]) => `<th onclick="admSortBy('${c}')" class="${c===col?'on':''}">${T(label)}<span class="klarrow">${c===col ? (dir>0?'▲':'▼') : ''}</span></th>`).join('')}</tr></thead>
      <tbody>${list.map(r => `<tr onclick="openAdmEdit('${r.id}')">${ADM_COLS.map(([c]) => `<td class="kl-${c}">${cell(r, c)}</td>`).join('')}</tr>`).join('')
        || `<tr><td colspan="${ADM_COLS.length}" class="klnone">${T('No matches')}</td></tr>`}</tbody>
    </table></div>
    ${rows.length > LIMIT ? `<div class="klcount" style="margin-top:8px">${T('Showing the first')} ${LIMIT}. ${T('Search to narrow it down.')}</div>` : ''}`;
}

// The comment, editable where it is shown (2026-10-14): a box of its own in the admin table. It
// says when it has not been saved, while it is being saved, when it is, and when it could not be.
// Saving changes the register entry's comment and nothing else - not where the bundle is, not
// any move in its history (a "register changed: kommentar" line is added). Saved on leaving the
// box, or on Enter.
const admCmt = {};   // id -> { val, st: 'dirty'|'saving'|'saved'|'error', msg }
function cmtCell(id, cur){
  const c = admCmt[id], val = c ? c.val : cur;
  const st = c ? c.st : '';
  const label = st === 'dirty' ? T('Not saved') : st === 'saving' ? T('Saving…') : st === 'saved' ? T('Saved') + ' ✓' : st === 'error' ? (c.msg || T('Could not save - try again')) : '';
  return `<div class="cmtbox" onclick="event.stopPropagation()">
    <textarea class="cmtin${st ? ' ' + st : ''}" rows="2" data-id="${esc(id)}" placeholder="${T('Comment')}"
      oninput="cmtInput('${id}', this)" onblur="cmtSave('${id}', this)"
      onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); this.blur() }">${esc(val)}</textarea>
    <span class="cmtst ${st}" id="cmtst_${esc(id).replace(/:/g,'_')}">${esc(label)}</span></div>`;
}
function cmtPaintState(id){
  const el = document.getElementById('cmtst_' + id.replace(/:/g, '_')); if(!el) return;
  const c = admCmt[id] || {};
  el.className = 'cmtst ' + (c.st || '');
  el.textContent = c.st === 'dirty' ? T('Not saved') : c.st === 'saving' ? T('Saving…') : c.st === 'saved' ? T('Saved') + ' ✓' : c.st === 'error' ? (c.msg || T('Could not save - try again')) : '';
  const box = el.previousElementSibling; if(box) box.className = 'cmtin' + (c.st ? ' ' + c.st : '');
}
function cmtInput(id, el){
  const b = bundleOf(id); if(!b) return;
  const same = el.value.trim() === (b.c || '');
  admCmt[id] = same ? { val: el.value, st: '' } : { val: el.value, st: 'dirty' };
  cmtPaintState(id);
}
async function cmtSave(id, el){
  const c = admCmt[id], b = bundleOf(id);
  if(!c || !b || (c.st !== 'dirty' && c.st !== 'error')) return;
  const val = (el ? el.value : c.val).trim();
  if(val === (b.c || '')){ admCmt[id] = { val, st: '' }; return cmtPaintState(id) }
  admCmt[id] = { val, st: 'saving' }; cmtPaintState(id);
  const send = (rec, base) => admCall({ op:'reg', op_id: uid() + uid(), rec: { id, ...recOf(rec), c: val, src: fpOf(staticOf(id)) }, base, who: keyMe || '', note: 'kommentar' });
  let r = await send(b, (keyReg.recs[id] && keyReg.recs[id].rev) || 0);
  // Someone saved this bundle meanwhile: take their version and change only the comment on it.
  if(r.status === 409 && r.j.rec) r = await send(r.j.rec, r.j.rec.rev || 0);
  if(r.status === 403){ admCmt[id] = { val, st: 'error', msg: T('Log in as admin again') }; cmtPaintState(id); setAdm(false); return }
  if(!r.j || !r.j.ok){ admCmt[id] = { val, st: 'error', msg: r.status === 0 ? T('No contact - nothing saved') : T('Could not save - try again') }; return cmtPaintState(id) }
  keyReg.recs[id] = r.j.rec; regCache = null; await store.set(KEYREG, keyReg);
  if(r.j.event) histCache[id] = [r.j.event].concat((histCache[id]||[]).filter(e => e.id !== r.j.event.id));
  admCmt[id] = { val, st: 'saved' }; cmtPaintState(id);
  setTimeout(() => { if(admCmt[id] && admCmt[id].st === 'saved'){ delete admCmt[id]; cmtPaintState(id) } }, 2500);
}

// The bundle being edited: the register entry, and where it is, each with the copy it started
// from so Save can tell what changed.
let ae = null, admAfter = null;
// other: anyone who is neither staff nor guest - a property owner, a contractor - typed as you like.
// Written as a check-out to that person, marked reason 'Annan' so the form knows it again.
const OTHER = 'Annan';
const ST_LABEL = { cab:'Cabinet', staff:'Staff', apt:'In the apartment', guest:'Guest', other:'Other', box:'Service box', tube:'Key tube', lost:'Lost' };
function stForm(id){
  const s = bstate(id), k = stKind(s);
  if(k === 'out') return { dest: s.reason === OTHER ? 'other' : 'staff', name:s.holder||'', phone:s.phone||'', email:s.email||'', unit:'', place:'', note:'' };
  if(k === 'guest') return { dest:'guest', name:s.guest||'', phone:s.phone||'', email:s.email||'', unit:'', place:'', note:'' };
  if(k === 'apt') return { dest:'apt', name:'', phone:'', unit:'', place:'', note:'', email:'' };
  // An older 'left' line: no choice lit, and a note that it may have been either. Picking
  // In the apartment or Guest then records what is actually known.
  if(k === 'old') return { dest:'old', name:'', phone:'', unit:'', place:'', note:'', email:'' };
  if(k === 'lost') return { dest:'lost', name:'', phone:'', unit:'', place:'', note:'', email:'' };
  if(k === 'box' || k === 'tube') return { dest:k, name:'', phone:'', unit:s.unit||'', place:s.place||'', note:'' };
  return { dest:'cab', name:'', phone:'', unit:'', place:'', note:'', email:'' };
}
const recOf = b => ({ a:b.a||'', l:b.l||'', n:b.n||'', c:b.c||'', k:(b.k||[]).map(r=>[r[0]||'', r[1]||'', r[2]||1, r[3]||''].concat(r[4] ? [1] : [])), off: !!b.off });
const aeStSig = f => JSON.stringify([f.dest, f.name.trim(), f.phone.trim(), (f.email||'').trim(), f.unit.trim(), f.place.trim()]);
// The nycklar.js line a bundle had when an admin last saved it, as a short fingerprint. When the
// file later changes that line, the admin's version still wins - so the edit page says so and
// offers the file's version instead of either side being hidden or brought back unseen.
const staticOf = id => (window.NYCKLAR || []).find(b => b.id === id) || null;
function fpOf(b){
  if(!b) return '';
  const s = JSON.stringify([b.a||'', b.l||'', b.n||'', (b.k||[]).map(r=>[r[0]||'', r[1]||'', r[2]||1, r[3]||''])]);
  let h = 5381; for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36) + '.' + s.length;
}
const staticMoved = id => { const o = keyReg.recs[id], s = staticOf(id); return !!(o && s && o.src !== fpOf(s)) };
async function openAdmEdit(id){
  if(!admOn){ admAfter = id; return openAdmin() }
  await keyBoot();
  const b = id ? bundleOf(id) : null;
  if(id && !b) return toast(`${id} — ${T('not in the register')}`);
  const rec = b ? recOf(b) : { a:'', l:'', n:'', c:'', k:[['Lägenhetsnyckel','',1,'']], off:false };
  ae = { id: id || '', isNew: !id, rec, orig: JSON.stringify(rec), base: (keyReg.recs[id] && keyReg.recs[id].rev) || 0,
         st: id ? stForm(id) : stForm(''), stOrig: '', op: uid() + uid() };
  ae.stOrig = aeStSig(ae.st); ae.baseEv = (bstate(id).ev && bstate(id).ev.id) || ''; ae.conf = [];
  paintAdmEdit();
  window.scrollTo(0,0);
  if(id) histLoad(id).then(()=>{ if(ae && ae.id === id) paintAdmHist() });
  // The entry straight from its saved versions (the phones' copy may be a minute behind), and any
  // saved at the same moment by someone else. Taken into the form only while nothing is typed.
  if(id) admCall({op:'get', bundle:id}).then(r => {
    if(!ae || ae.id !== id || r.status !== 200 || !r.j.ok) return;
    ae.conf = r.j.conf || [];
    if(r.j.rec && r.j.rec.rev !== ae.base && JSON.stringify(ae.rec) === ae.orig){
      ae.rec = recOf(r.j.rec); ae.orig = JSON.stringify(ae.rec);
    }
    if(JSON.stringify(ae.rec) === ae.orig) ae.base = r.j.rev || 0;
    paintAdmEdit();
  });
}
// A version saved alongside the current one: shown on the edit page, one tap takes it into the form.
function aeUseConf(i){ const c = ae && ae.conf[i]; if(!c) return; const off = ae.rec.off; ae.rec = recOf(c); ae.rec.off = !!c.off || off; paintAdmEdit() }
const aeDirty = () => !!ae && (JSON.stringify(ae.rec) !== ae.orig || aeStSig(ae.st) !== ae.stOrig || (ae.isNew && !!String(ae.id).trim()));
// Closing throws away what was typed, so that one case asks first (principle 8: a dialog only
// where something is lost).
function closeAdmEdit(force){
  if(!force && aeDirty() && !confirm(T('Close without saving?'))) return;
  const el = document.getElementById('aedit'); if(el) el.remove(); ae = null;
  if(document.getElementById('admin')) paintAdminList();
}
function aeSet(path, v){
  const p = path.split('.');
  if(p[0] === 'st') ae.st[p[1]] = v;
  else if(p[0] === 'k') ae.rec.k[+p[1]][+p[2]] = p[2] === '2' ? Math.max(1, Math.min(99, Math.round(Number(v)) || 1)) : v;
  else if(p[0] === 'id') ae.id = v;
  else ae.rec[p[0]] = v;
}
function aeKeyAdd(){ ae.rec.k.push(['','',1,'']); paintAdmEdit(); const r = document.querySelectorAll('.admkey'); const last = r[r.length-1]; if(last){ const i = last.querySelector('input'); if(i) try{ i.focus() }catch(e){} } }

function aeUseStatic(){ const s = staticOf(ae.id); if(!s) return; const off = ae.rec.off; ae.rec = recOf(s); ae.rec.off = off; paintAdmEdit() }

        </div>`).join('')}
      <button class="btn ghost small" onclick="aeKeyAdd()">+ ${T('Add key')}</button>

      <div class="card">

          <div class="field" style="flex:1"><label class="eyebrow">${T('Apartment name')}</label>${inp('n', r.n, 'TÄRNA')}</div></div>

      ${ae.isNew ? '' : `<div class="csec">${T('History')}</div><div class="card" id="aehist">${admHistHtml()}</div>
        <div style="display:flex;flex-wrap:wrap;gap:16px;margin:14px 3px">
          <button class="addc" onclick="aeQueue()">${T('Add to the tag sheet')}</button>

// Archive or take back: one tap, saved at once with anything else changed on the page.
async function aeArchive(){
  if(!ae) return;
  const was = !!ae.rec.off; ae.rec.off = !was;
  if(!await admSave() && ae){ ae.rec.off = was; paintAdmEdit() }
}
// What changed in the entry, in a few words for the history.
function aeNote(){
  const o = JSON.parse(ae.orig), r = ae.rec, out = [];
  if(!!o.off !== !!r.off) out.push(r.off ? 'arkiverad' : 'i bruk igen');
  if(o.a !== r.a || o.l !== r.l || o.n !== r.n) out.push('lägenhet');
  if(o.c !== r.c) out.push('kommentar');
  const offs = k => k.filter(x => x[4]).length;
  if(offs(o.k) !== offs(r.k)) out.push(offs(r.k) > offs(o.k) ? 'nyckel inaktiverad' : 'nyckel aktiv igen');
  if(JSON.stringify(o.k.map(x => x.slice(0, 4))) !== JSON.stringify(r.k.map(x => x.slice(0, 4)))){
    const n = k => k.reduce((s, x) => s + (Number(x[2]) || 1), 0);
    out.push(n(o.k) !== n(r.k) ? `nycklar ${n(o.k)} → ${n(r.k)}` : 'nycklar');
  }
  return ae.isNew ? 'ny knippa' : out.join(', ');
}
function aeEvent(){
  const f = ae.st, b = bundleOf(ae.id) || { l: ae.rec.l, n: ae.rec.n };
  const t = { name:f.name.trim(), phone:f.phone.trim(), unit:f.unit.trim(), place:f.place.trim() };
  if(f.dest === 'cab') return { kind:'in' };
  if(f.dest === 'staff') return { kind:'out', holder:t.name, phone:t.phone, email:(f.email||'').trim() };
  if(f.dest === 'other') return { kind:'out', holder:t.name, phone:t.phone, email:(f.email||'').trim(), reason:OTHER };
  if(f.dest === 'lost') return { kind:'place', loc:'lost', apt:objOf(ae.id), place:'' };
  if(f.dest === 'apt') return { kind:'place', loc:'apt', apt:objOf(ae.id), place:bundleApt(b) };
  if(f.dest === 'guest') return { kind:'place', loc:'guest', apt:objOf(ae.id), place:bundleApt(b), guest:t.name, phone:t.phone, email:(f.email||'').trim() };
  return { kind:'place', apt:objOf(ae.id), loc:f.dest, unit:t.unit, place:t.place };
}
let aeBusy = false;
async function admSave(){
  if(!ae || aeBusy) return false;
  if(ae.isNew){
    ae.id = String(ae.id||'').trim().toUpperCase().replace(/\s+/g,'');
    if(!okBundle(ae.id)) return toast(T('Write a bundle number, e.g. 112:4'));
    if(bundleOf(ae.id)) return toast(`${ae.id} — ${T('already in the register')}`);
  }
  // Saving with a conflict shown settles it, even with nothing else changed.
  const regChanged = ae.isNew || JSON.stringify(ae.rec) !== ae.orig || !!(ae.conf && ae.conf.length);
  const stChanged = aeStSig(ae.st) !== ae.stOrig;
  if(!regChanged && !stChanged) return toast(T('No changes'));
  if(stChanged && (ae.st.dest === 'staff' || ae.st.dest === 'other') && !ae.st.name.trim()) return toast(T('Write the name'));
  if(stChanged && !okEmail(ae.st.email)){ aeEmailCheck(); return toast(T(EMAIL_BAD)) }
  aeBusy = true;
  const btn = document.getElementById('aesave'); if(btn) btn.disabled = true;
  let queued = false;
  try{
    const who = keyMe || '';
    const wasNew = ae.isNew;
    if(regChanged){
      // op_id: the same save sent twice (a lost answer, a second tap) is done once.
      const r = await admCall({op:'reg', op_id: ae.op, rec:{id:ae.id, ...ae.rec, src: fpOf(staticOf(ae.id))}, base:ae.base, seen:(ae.conf||[]).map(c => c.rev), who, note:aeNote() || 'samtidig ändring avgjord'});
      if(!admOk(r)) return;
      if(r.status === 409){
        if(r.j.rec){ keyReg.recs[r.j.rec.id] = r.j.rec; await store.set(KEYREG, keyReg); regCache = null }
        toast(T('Changed by someone else just now - shown again, make your change once more'));
        return openAdmEdit(ae.id);
      }
      if(!r.j.ok) return toast(T('Could not save') + ' (' + r.status + ')');
      // Kept beside the register, not by raising its rev: the next sync must still fetch whatever
      // other admins saved meanwhile (keyRegSet keeps this entry until the server has it).
      keyReg.recs[r.j.rec.id] = r.j.rec; regCache = null;
      await store.set(KEYREG, keyReg);
      if(r.j.event) histCache[ae.id] = [r.j.event].concat((histCache[ae.id]||[]).filter(e => e.id !== r.j.event.id));
      ae.isNew = false; ae.base = r.j.rec.rev; ae.orig = JSON.stringify(ae.rec); ae.op = uid() + uid(); ae.conf = [];
      // A new bundle needs a tag: it goes on the tag sheet by itself, to be printed with the rest.
      if(wasNew) queued = !!await tqAdd([{ id: ae.id, tpl: tagTplPref() }], true);
    }
    if(stChanged){
      const r = await admCall({op:'state', op_id: ae.op + 's', bundle:ae.id, event:aeEvent(), base_ev: ae.baseEv || '', who, note:ae.st.note.trim()});
      if(!admOk(r)) return;
      if(r.status === 409){
        // Moved by someone else since this page opened: show where it is now, keep the rest.
        toast(T('Moved by someone else just now - shown again'));
        await keySync(true);
        if(ae){ ae.st = stForm(ae.id); ae.stOrig = aeStSig(ae.st); ae.baseEv = (bstate(ae.id).ev && bstate(ae.id).ev.id) || (r.j.event && r.j.event.id) || ''; paintAdmEdit() }
        return;
      }
      if(!r.j.ok) return toast(T('Could not save') + ' (' + r.status + ')');
      if(!keyEvents.some(e => e.id === r.j.event.id)) keyEvents.unshift(r.j.event);
      applyEvents(); await keyRemember();
      histCache[ae.id] = [r.j.event].concat((histCache[ae.id]||[]).filter(e => e.id !== r.j.event.id));
      ae.stOrig = aeStSig(ae.st);
    }
    toast(queued ? T('Saved') + ' · ' + T('added to the tag sheet') : T('Saved'));
    closeAdmEdit(true);
    tagBtnPaint();
    return true;
  }finally{ aeBusy = false; const b2 = document.getElementById('aesave'); if(b2) b2.disabled = false }
}
// False, and says why, when the call never reached the admin part: no network, or no admin login.
function admOk(r){
  if(r.status === 0){ toast(T('No contact - nothing saved')); return false }
  // The edit stays open underneath with everything typed; after the login it comes back on top.
  // The admin list is taken away first, so the login comes up on top of the edit, not under it.
  if(r.status === 403){ setAdm(false); toast(T('Log in as admin again')); const a = document.getElementById('admin'); if(a) a.remove(); openAdmin(); return false }
  return true;
}

/* ----- key tags (2026-10-21) -----
   Key admin → Tags. Tags are made first and the bundle is filled in afterwards, and they are
   printed in bulk (Erik): the page is a sheet - the tags waiting to be printed, kept on this
   device and nowhere else (tqLoad). The paper is
   shown as it will print, beside the number field: write numbers and they appear on it, dashed,
   until Add to the sheet. Click a tag on the paper to give it another design or take it off.
   A number the register has not got is added to it when it goes on the sheet, with the address
   and apartment if written (now or later, on the bundle). A bundle made with New bundle goes on
   the sheet by itself, and any bundle's page has Add to the sheet. Print the sheet when it suits:
   whatever is typed goes on first, so what is on the paper is what prints. The tags come off it
   only when someone says they came out - a jammed printer loses nothing. The QR code is the bare
   number, made here and read back with the app's own reader before it is shown (tags.js). A4, 18
   to a page, printed at 100 %, like the sheets made before. */
const loadTags = () => loadScript('tags.js', ()=>!!window.BEAPS_TAGS);
const TAG_MAX = 90;
// A design: one of the three printed ones, or one drawn on this device (tagpaint.js, 'c' + an id).
const tplOk = k => /^(green|darkpeach|lightpeach|c[a-z0-9]{6,20})$/.test(String(k || ''));
// { tpl, q, objs: {object: {a, l, n, typed}}, tplFor: {id: design}, ops: {id: op_id}, busy, t, sel, printed: {items, ts} }
let tg = null;
const tagLine = b => [b.a, [b.l ? 'lgh ' + b.l : '', b.n].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
const tagTplPref = () => { try{ const v = localStorage.getItem('beaps-tagtpl'); return tplOk(v) ? v : 'green' }catch(e){ return 'green' } };

// The sheet is kept on this device only, in the app's own storage beside the saved inspections
// (Erik: not in the database): [{id, tpl, at, rev}] in the order put on. rev counts changes to a
// tag, so clearing after a print leaves one given a new design since.
const TAGQ = 'bp:tagsheet';
let tq = null;
const onSheet = id => !!(tq && tq.some(x => x.id === id));
async function tqLoad(){
  if(!tq){
    const v = await store.get(TAGQ);
    if(!tq) tq = Array.isArray(v) ? v.filter(it => it && okBundle(it.id) && tplOk(it.tpl)) : [];
  }
  await tqFromServer();
  return true;
}
// For a day (2026-10-21) the sheet lived on the server. What was put on it there comes to the
// first device that opens it, once: saved here first, only then deleted there, so a failed save
// loses nothing. Nothing writes the sheet to the server any more.
let tqMoving = null;
function tqFromServer(){
  try{ if(localStorage.getItem('beaps-tagq-moved')) return Promise.resolve() }catch(e){ return Promise.resolve() }
  return tqMoving || (tqMoving = (async () => {
    const r = await admCall({op:'queue'});
    if(!(r.status === 200 && r.j.ok)) return;           // tried again next time
    const items = (r.j.items || []).filter(it => it && okBundle(it.id));
    if(items.length){
      const next = tq.concat(items.filter(it => !onSheet(it.id)).map(it => ({ id: it.id, tpl: tplOk(it.tpl) ? it.tpl : 'green', at: Number(it.at) || Date.now(), rev: 1 })))
        .sort((a, b) => a.at - b.at);
      if(!await store.set(TAGQ, next)) return;
      tq = next;
      const d = await admCall({op:'qdel', items: items.map(it => ({ id: it.id, rev: it.rev }))});
      if(!(d.status === 200 && d.j.ok)) return;
    }
    try{ localStorage.setItem('beaps-tagq-moved', '1') }catch(e){}
  })().finally(() => { tqMoving = null }));
}
// [{id, tpl}] onto the sheet; one already on it keeps its place and takes the design. quiet: says
// nothing itself (New bundle reports it in its own words).
async function tqAdd(items, quiet){
  await tqLoad();
  const now = Date.now(), next = tq.map(t => ({ ...t }));
  items.forEach((x, i) => {
    const cur = next.find(t => t.id === x.id);
    if(cur){ if(cur.tpl !== x.tpl){ cur.tpl = x.tpl; cur.rev = (cur.rev || 0) + 1 } }
    else next.push({ id: x.id, tpl: tplOk(x.tpl) ? x.tpl : 'green', at: now + i, rev: 1 });
  });
  if(!await store.set(TAGQ, next)){ if(!quiet) toast(T('Could not save on this device')); return null }
  tq = next;
  return items;
}
// Each one only as it was: [{id, rev}].
async function tqRemove(items){
  await tqLoad();
  const next = tq.filter(t => !items.some(it => it.id === t.id && (t.rev || 0) <= (it.rev || 0)));
  if(!await store.set(TAGQ, next)){ toast(T('Could not save on this device')); return false }
  tq = next;
  return true;
}
const tagBtnLabel = () => T('Tags') + (tq && tq.length ? ' · ' + tq.length : '');
function tagBtnPaint(){ const b = document.getElementById('admtags'); if(b) b.textContent = tagBtnLabel() }

// Designs drawn here (tagpaint.js), kept on this device like the sheet: [{id, name, front, back
// (PNG data URLs), num, bg: {front, back}, created, updated}]. Handed to tags.js as blob URLs, so
// the paper - painted again on every key - does not carry the pictures as text each time.
const TAGTPLS = 'bp:tagtpls';
let tagTpls = null;
const tagTplUrls = {};
const loadPaint = () => loadScript('tagpaint.js', () => typeof window.paintOpen === 'function');
function pngUrl(d){
  const bin = atob(String(d).split(',')[1] || ''), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([u], { type: 'image/png' }));
}
const okPng = d => /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(String(d || ''));
function tagTplRegister(t){
  const B = window.BEAPS_TAGS; if(!B) return;
  const had = tagTplUrls[t.id];
  if(had && had.u === t.updated && B.TEMPLATES[t.id]) return;
  if(had){ URL.revokeObjectURL(had.f); URL.revokeObjectURL(had.b) }
  const f = pngUrl(t.front), b = pngUrl(t.back);
  tagTplUrls[t.id] = { f, b, u: t.updated };
  B.setCustom(t.id, { name: t.name, front: f, back: b, num: t.num, bg: (t.bg && t.bg.back) || '#FFFFFF', fbg: (t.bg && t.bg.front) || '#FFFFFF' });
}
async function tagTplsLoad(){
  if(!tagTpls){
    const v = await store.get(TAGTPLS);
    if(!tagTpls) tagTpls = Array.isArray(v) ? v.filter(t => t && /^c[a-z0-9]{6,20}$/.test(t.id) && okPng(t.front) && okPng(t.back)) : [];
  }
  tagTpls.forEach(tagTplRegister);
}
async function tagTplPut(rec){
  await tagTplsLoad();
  const list = tagTpls.filter(t => t.id !== rec.id).concat([rec]);
  if(!await store.set(TAGTPLS, list)) return false;
  tagTpls = list;
  tagTplRegister(rec);
  return true;
}
// Tags on the sheet in a deleted design go back to green; so does a choice made with it.
async function tagTplDel(id){
  await tagTplsLoad();
  const list = tagTpls.filter(t => t.id !== id);
  if(!await store.set(TAGTPLS, list)) return false;
  tagTpls = list;
  const B = window.BEAPS_TAGS; if(B) B.dropCustom(id);
  const had = tagTplUrls[id]; if(had){ URL.revokeObjectURL(had.f); URL.revokeObjectURL(had.b); delete tagTplUrls[id] }
  await tqLoad();
  const on = tq.filter(x => x.tpl === id);
  if(on.length) await tqAdd(on.map(x => ({ id: x.id, tpl: 'green' })), true);
  try{ if(localStorage.getItem('beaps-tagtpl') === id) localStorage.setItem('beaps-tagtpl', 'green') }catch(e){}
  if(tg){ if(tg.tpl === id) tg.tpl = 'green'; for(const k of Object.keys(tg.tplFor)) if(tg.tplFor[k] === id) delete tg.tplFor[k]; paintTags(false) }
  return true;
}
async function openTplEditor(id){
  closeTagMenu();
  if(!await loadPaint()) return toast(T('Could not load the tags. Check the connection and try again.'));
  window.paintOpen(id || '');

// The numbers as written: "404:1-3, 404:EXTRA 405:2". A range runs within one object (404:1-3,
// or 404:1-404:3). The same number twice is one tag. What cannot go on a tag is listed, not dropped.
function tagParse(q){
  const B = window.BEAPS_TAGS, ids = [], bad = [], seen = new Set();
  let over = false;
  const one = id => {
    if(seen.has(id)) return;
    const p = okBundle(id) && /[A-Z0-9]/.test(id) ? B.problem(id) : 'bad';
    if(p){ bad.push({ text:id, why: p === 'long' ? 'too long for a tag (at most 14 characters)' : p === 'code' ? 'the code could not be made' : 'not a bundle number' }); return }
    if(ids.length >= TAG_MAX){ over = true; return }
    seen.add(id); ids.push(id);
  };
  const s = String(q || '').toUpperCase().replace(/[–—]/g, '-').replace(/(\d)\s*-\s*(?=\d|[A-Z0-9_]+:)/g, '$1-');
  for(const tok of s.split(/[\s,;]+/)){
    if(!tok || /[-:]$/.test(tok)) continue;        // still being written
    const m = /^([A-Z0-9_]+):(\d+)-(?:\1:)?(\d+)$/.exec(tok);
    if(!m){ one(tok); continue }
    const lo = +m[2], hi = +m[3], w = m[2].startsWith('0') ? m[2].length : 0;
    if(hi < lo || hi - lo >= TAG_MAX){ bad.push({ text:tok, why:'not a range from low to high' }); continue }
    for(let i = lo; i <= hi; i++) one(m[1] + ':' + String(i).padStart(w, '0'));
  }
  return { ids, bad, over };
}
// The object number (404 in 404:3) is the apartment, so new bundles get one address and
// apartment per object. An object the register already has fills them in from there, until
// something is typed in them.
function tagApt(obj){
  const o = tg.objs[obj] || (tg.objs[obj] = { a:'', l:'', n:'', typed:false });
  if(!o.typed){
    const b = regAll().find(x => objOf(x.id) === obj && (x.a || x.l));
    Object.assign(o, b ? { a: b.a || '', l: b.l || '', n: b.n || '' } : { a:'', l:'', n:'' });
  }
  return o;
}

// Onto the sheet: what is typed and not on it yet, each in its design. A number the register has
// not got is added to the register first. True when everything typed is on the sheet.
async function tagAdd(){
  if(!tg || tg.busy) return false;
  clearTimeout(tg.t);
  const P = tagParse(tg.q);
  if(P.bad.length || P.over){ paintTags(true); toast(T('Check the numbers marked in red')); return false }
  if(!P.ids.length){ toast(T('Write the bundle numbers, e.g. 404:1-3')); return false }
  tg.busy = true;
  const btns = [$('#tgadd'), $('#tgbtn')]; btns.forEach(b => { if(b) b.disabled = true });
  try{
    await tqLoad();
    const ids = P.ids.filter(id => !onSheet(id));
    for(const id of ids.filter(id => !bundleOf(id))){
      // op_id: a second tap, or a retry after a lost answer, adds the bundle once.
      const op = tg.ops[id] || (tg.ops[id] = uid() + uid());
      const o = tagApt(objOf(id));
      const r = await admCall({op:'reg', op_id: op, rec:{ id, a: o.a.trim(), l: o.l.trim(), n: o.n.trim(), c:'', k:[], off:false, src:'' }, base:0, who: keyMe || '', note:'ny knippa'});
      if(!admOk(r)) return false;
      // 409: someone added the same number a moment ago. Theirs stands, and the tag is for it.
      const rec = r.j && (r.j.ok || r.status === 409) ? r.j.rec : null;
      if(!rec){ toast(id + ': ' + T('Could not save') + ' (' + r.status + ')'); return false }
      keyReg.recs[rec.id] = rec; regCache = null;
      await store.set(KEYREG, keyReg);
      if(r.j.event) histCache[rec.id] = [r.j.event].concat((histCache[rec.id]||[]).filter(e => e.id !== r.j.event.id));
    }
    if(ids.length && !await tqAdd(ids.map(id => ({ id, tpl: (tg && tg.tplFor[id]) || (tg && tg.tpl) || 'green' })))) return false;
    if(!tg) return false;
    toast(ids.length ? ids.length + ' ' + T('on the sheet') + ' · ' + tq.length + ' ' + T('in all') : T('Already on the sheet'));
    tg.q = ''; tg.objs = {}; tg.tplFor = {};
    const inp = $('#tg_q'); if(inp) inp.value = '';
    paintTags(true);
    return true;
  }finally{ if(tg) tg.busy = false; [$('#tgadd'), $('#tgbtn')].forEach(b => { if(b) b.disabled = false }) }
}

// The three coloured proposals that used to live here are gone: the key screens are white
// like the rest of the app. The stored choice is dropped so no phone keeps a dark one.

/* ----- the properties behind the two fields on the Property step -----
   Addresses and apartments out of fastigheter.js, offered as you type. Nothing is forced:
   both fields take whatever is written, and a property the register has not got is typed in
   exactly as before - the suggestions only save the typing. Getting the address written the
   same way every time is also what lets the key card further in find the apartment in the
   key register, so it is worth a little help here. */
const loadFastigheter = () => loadScript('fastigheter.js', ()=>Array.isArray(window.FASTIGHETER));
// Matching is word by word: every word typed has to turn up somewhere in the address, in any
// order, so "eriksg 53b" finds "Sankt Eriksgatan 53B" and "91b uppl" finds Upplandsgatan 91B.
// "S:t" and "St" are folded to "Sankt" because the key list and the property list spell it
// differently, and a comparison with the spaces taken out decides whether a field already
// names one property exactly.
const fold = s => String(s==null?'':s).toLowerCase()
  .replace(/\bs:t\b/g,'sankt').replace(/[.,:;\-]/g,' ').replace(/\bst\b/g,'sankt')
  .replace(/\s+/g,' ').trim();
const tight = s => fold(s).replace(/\s/g,'');
const words = q => fold(q).split(' ').filter(Boolean);
const hitsAll = (text, ws) => { const t = fold(text); return ws.every(w => t.includes(w)) };
const propOf = a => (window.FASTIGHETER||[]).find(f => tight(f.a) === tight(a));
const SUG_MAX = 8;
// Fetch the register when the Property step opens, then paint - never before, so a phone that
// only ever opens the start screen pays nothing for it.
function propPrime(){ loadFastigheter().then(()=>{ if(view==='object') paintPropSug() }) }
// The name the register has for the apartment on the inspection, kept in S.aptName. Looked
// up on every change of address or number, and once for an inspection made before the name
// was kept. Writes '' when the register has nothing for it, so the lookup is not repeated;
// leaves the field alone when the register has not loaded, so it is tried again.
function syncAptName(){
  if(!S) return false;
  // A finished or signed report is a record: its title stays as it was when it was closed.
  // Editing it unlocks it first (unlockIfLocked), and the name follows from then on.
  if(S.signedAt || S.closedAt) return false;
  // Without the register a name cannot be checked against the number it now sits beside, so
  // it is dropped rather than kept on a number it may not belong to; the next opening looks
  // it up again (openInsp backfills when it is unset).
  if(!Array.isArray(window.FASTIGHETER)){
    if(S.aptName !== undefined){ S.aptName = undefined; return true }
    return false;
  }
  const hit = propOf(S.address), q = tight(S.apt);
  const row = (hit && q) ? hit.l.find(l => tight(l[0]) === q) : null;
  const name = (row && realName(row[1])) ? row[1] : '';
  const changed = (S.aptName||'') !== name;
  S.aptName = name;
  return changed;
}
// Under the number on the Property step: the name it resolves to, so the pick is visible.
function paintAptName(){
  const el = document.getElementById('aptname'); if(!el) return;
  const n = (S && realName(S.aptName)) ? 'C/O ' + niceName(S.aptName) : '';
  el.textContent = n; el.style.display = n ? '' : 'none';
}
function paintPropSug(){
  const reg = window.FASTIGHETER || [];
  const aEl = document.getElementById('f_address'), pEl = document.getElementById('f_apt');
  const aBox = document.getElementById('sugaddr'), pBox = document.getElementById('sugapt');
  if(!aBox || !pBox) return;
  const aVal = aEl ? aEl.value : '', pVal = pEl ? pEl.value : '';
  const hit = propOf(aVal);
  // This runs from the fields' own oninput, ahead of the listener that copies them into S:
  // read them here, so the name under the number never lags a keystroke behind.
  if(S && aEl) S.address = aVal;
  if(S && pEl) S.apt = pVal;
  syncAptName(); paintAptName();

  // Addresses: only once something is typed, and not when it already names one exactly.
  let rows = [];
  if(reg.length && tight(aVal) && !hit){
    const ws = words(aVal);
    const m = reg.filter(f => hitsAll(f.a, ws));
    rows = m.slice(0, SUG_MAX).map(f =>
      `<button class="sugrow" onclick="pickAddr('${esc(f.a).replace(/'/g,"\\'")}')"><b>${esc(f.a)}</b>${f.l.length? `<span>${f.l.length} ${T(f.l.length===1?'apartment':'apartments')}</span>`:''}</button>`);
    if(m.length > rows.length) rows.push(`<span class="sugmore">+${m.length - rows.length} ${T('more')}</span>`);
  }
  aBox.innerHTML = rows.join('');

  // Apartments: the ones at the address, as soon as it is known. Few enough to just show.
  let arows = [];
  if(hit && hit.l.length){
    const q = tight(pVal), ws = words(pVal);
    const m = q ? hit.l.filter(l => hitsAll(l[0] + ' ' + (l[1]||''), ws)) : hit.l;
    const exact = hit.l.some(l => tight(l[0]) === q);
    if(!(exact && m.length === 1)){
      arows = m.slice(0, 12).map(l =>
        `<button class="sugrow${tight(l[0])===q?' on':''}" onclick="pickApt('${esc(l[0]).replace(/'/g,"\\'")}')"><b>${esc(l[0])}</b>${realName(l[1])? `<span>${esc(niceName(l[1]))}</span>`:''}</button>`);
      if(m.length > arows.length) arows.push(`<span class="sugmore">+${m.length - arows.length} ${T('more')}</span>`);
    }
  }
  pBox.innerHTML = arows.join('');
}

/* ---------- PDF ---------- */
function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(true);
  return new Promise(res=>{
    let done = false;
    const finish = ok => { if(!done){ done = true; res(ok) } };
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ()=>finish(!!window.jspdf); s.onerror = ()=>finish(false);
    setTimeout(()=>finish(false), 15000);   // a hanging CDN on a bad network must not lock the PDF flow for minutes
    document.head.appendChild(s);
  });
}
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src }) }
async function shrinkForPdf(data, budget){
  try{
    if(bytesOf(data) <= budget){ const im = await loadImg(data); return {data, w:im.naturalWidth, h:im.naturalHeight} }
    const im = await loadImg(data);
    let maxDim = 1100, q = 0.78, out = draw(im, im.naturalWidth, im.naturalHeight, maxDim, q), n = 0;
    while(bytesOf(out) > budget && n < 8){
      n++;
      if(q > 0.66) q = Math.round((q-0.06)*100)/100;
      else if(maxDim > 560) maxDim = Math.max(560, Math.round(maxDim*0.85));
      else break;
      out = draw(im, im.naturalWidth, im.naturalHeight, maxDim, q);
    }
    const om = await loadImg(out);
    return {data: out, w: om.naturalWidth, h: om.naturalHeight};
  }catch(e){ return null }
}
const sizeCache = {};
function imgSize(data){
  if(sizeCache[data]) return Promise.resolve(sizeCache[data]);
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ sizeCache[data] = {w:im.naturalWidth, h:im.naturalHeight}; res(sizeCache[data]) };
    im.onerror = ()=>res({w:4,h:3});
    im.src = data;
  });
}
function fileName(){
  return (ref(true)||'Inspection').replace(/[\/\\:*?"<>|]/g,' ').replace(/\s+/g,' ').trim() + '.pdf';
}
// What the Signatures block says for one party. Shared by the PDF and the print fallback, so
// the two cannot disagree. There is no empty line anywhere: nobody draws on a PDF, so an empty
// line only ever meant a signature that was not given, and the name, the role and a plain word
// say that better than a blank.
//   image     drawn and approved on the pad: the image, with the line it sits on
//   remote    signed through the signing link; the image is on the signature page, not here
//   link      built for the signing link: this party signs on the signature page that will
//             accompany this very report
//   awaiting  a signing link is out for this party and has not been signed
//   expired   the signing link ran out unsigned
//   none      no signature
// A link's real state. The server says 'expired' only when it is asked, and a phone that
// could not ask - or asked after the record was gone - would otherwise keep 'pending' for
// ever; the date on the record settles it either way.
const linkExpired = q => !!(q && (q.status==='expired' || (q.status==='pending' && q.expires && Date.now() > q.expires)));
const linkPending = q => !!(q && q.status==='pending' && !linkExpired(q));
function sigPlan(who, forSigning){
  const sg = S.sig && S.sig[who];
  if(sg && sg.data) return {kind:'image', sg};
  if(sg && sg.remote) return {kind:'remote', sg};
  const q = S.signReq;
  if(who==='counter'){
    if(forSigning) return {kind:'link', sg:null};
    if(linkPending(q)) return {kind:'awaiting', sg:null};
    if(linkExpired(q)) return {kind:'expired', sg:null};
  }
  return {kind:'none', sg:null};
}
const SIG_TEXT = {
  remote:   ['Signed digitally via signing link.', 'The signature page is in the report that was sent.'],
  link:     ['Signs digitally via the signing link.', 'The signature page accompanies this report.'],
  awaiting: ['Awaiting signature via the signing link.'],
  expired:  ['The signing link expired unsigned.'],
  none:     ['No signature']
};
// The note under the Signatures heading when the report was finished without any signing.
function sigNote(forSigning){
  if(forSigning || !S.closedAt || S.signedAt) return '';
  const q = S.signReq;
  if(linkPending(q) || linkExpired(q)) return '';   // the counterparty's own text says it
  if(q && q.status==='cancelled') return 'The signing link was revoked, not signed';
  return 'Finished without signature ' + stamp(new Date(S.closedAt));
}
// opts.forSigning: the copy that goes behind a signing link.
async function buildPdf(opts){
  const forSigning = !!(opts && opts.forSigning);
  if(!await loadJsPDF()){ toast('Could not load the PDF engine, using print'); return null }
  const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4', compress:true});
  // jsPDF's default font only draws Latin-1. Sanitise all text in one sweep so the user's
  // emoji/arrows don't become gibberish in the report (wa() leaves aao untouched).
  const _text = doc.text.bind(doc), _split = doc.splitTextToSize.bind(doc);
  doc.text = (t, ...a) => _text(Array.isArray(t)? t.map(wa) : wa(t), ...a);
  doc.splitTextToSize = (t, ...a) => _split(wa(t), ...a);
  const allPhotos = isCheck()
    ? visibleChecks().reduce((a,c)=>a+((c.photos&&c.photos.length)||0), 0)

  const photoBudget = Math.max(80*1024, Math.min(720*1024, Math.floor(3.3*1048576 / Math.max(1, allPhotos))));
  let packed = 0;
  const packNote = ()=>{ packed++; if(allPhotos>8 && packed%5===0) toast(`Packing photos ${packed} of ${allPhotos}`) };
  const M = 34, W = 595, H = 842, CW = W - M*2;
  let y = M;
  const need = h => { if(y + h > H - 46){ doc.addPage(); y = M } };
  const line = (txt, size, style, gap) => {
    doc.setFont('helvetica', style||'normal'); doc.setFontSize(size||10);
    const rows = doc.splitTextToSize(txt, CW);
    need(rows.length*(size||10)*1.25);
    doc.text(rows, M, y + (size||10));
    y += rows.length*(size||10)*1.25 + (gap||0);
  };

  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text(isCheck()? 'SHORTSTAY UPPLÅSNING' : isNewProp()? 'NYTT OBJEKT' : 'INSPECTION REPORT', M, y+8);
  doc.setFontSize(8);

                    : [TYPE_LABEL[S.type]||S.type, stamp(new Date(S.created)), 'ID '+S.id],
           W-M, y+8, {align:'right'});
  y += 22;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);

  const vidUte = !!(S.video && S.video.dbx === 'failed' && S.gallery && S.gallery.url);

    try{ while(ls > 6 && doc.getTextWidth(lank) > CW - 24){ ls -= 0.5; doc.setFontSize(ls) } }catch(e){}
    try{ doc.textWithLink(lank, M + 12, by, {url: lank}) }

  if(keys) line(`Keys: ${keys.comment||'-'}, ${keys.photos.length} photos`, 10);
  if(S.video) line(`Video recorded ${stamp(new Date(S.video.ts))}`, 10);
  y += 8;

  /* A receipt for the keys, not a question about them. It appears only when a bundle was
     actually handed over during this inspection, and then it lists every physical key on the

  if((S.keysOut||[]).length){

      // Type and marking only. The register's fourth field is an internal note - several

      const head = k.act === 'apt' ? 'KEYS LEFT IN THE APARTMENT' : k.act === 'guest' ? 'KEYS HANDED TO THE GUEST'

      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(0);
      doc.text(`${k.bundle}${k.name? '  ' + k.name : ''}`, M + 12, by); by += 13;
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90);
      for(const l of lines){ doc.text(l, M + 12, by); by += 12 }
      doc.text(`Registered by ${k.who || '-'}  ·  ${stamp(new Date(k.ts))}`, M + 12, by); by += 14;

      doc.setFontSize(9); doc.setTextColor(0);
      for(const [nr, typ, mark] of rader){
        doc.setTextColor(140); doc.text(String(nr), M + 14, by);
        doc.setTextColor(0);   doc.text(typ, M + 30, by);
        doc.setTextColor(90);  doc.text(mark, M + 170, by);
        by += 12;
      }
      doc.setTextColor(0);
      y += boxH + 12;
    }
  }

  if(isCheck()){
    // summary first, so the recipient sees the deviations without scrolling
    const lista = visibleChecks();
    const avvik = lista.filter(c=>c.val && c.val===badAnswer(c));
    const obes = lista.filter(c=>!c.val).length;
    const ejt = lista.filter(c=>c.val==='na').length;

    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('Summary', M, y+10); y += 20;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(`${avvik.length} deviations · ${obes} unanswered · ${ejt} not applicable · ${lista.length} items in total`, M, y+9);
    y += 18;

    if(avvik.length){
      for(const c of avvik){
        doc.setFont('helvetica','normal'); doc.setFontSize(10);

  }

    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Signatures', M, y+10); y += 18;
    if(note){

    }
    y += 10;
    plans.forEach((p,i)=>{
      const x = M + i*(half+20), sg = p.sg;
      if(p.kind==='image'){
        try{ doc.addImage(sg.data, 'PNG', x, y, Math.min(half,180), 54) }catch(e){}
        doc.setDrawColor(60); doc.setLineWidth(.8); doc.line(x, y+58, x+half, y+58);
        doc.setFont('helvetica','normal'); doc.setFontSize(9);
        doc.text(p.rows.concat([stamp(new Date(sg.ts))]), x, y+70);
        return;
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      if(p.rows.length) doc.text(p.rows, x, y+10);
      doc.setFont('helvetica','italic'); doc.setTextColor(120);
      doc.text(p.lines, x, y+10 + 11*p.rows.length);
      doc.setTextColor(0); doc.setFont('helvetica','normal');
    });
    y += tall + 10;
  }

  const logRows = isCheck()
    ? [{ts:S.created, txt:'Inspection created'}].concat(S.closedAt? [{ts:S.closedAt, txt:'Upplåsning finished'}] : [])
    : S.log;
  need(40);
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Activity log', M, y+10); y += 20;
  doc.setFont('courier','normal'); doc.setFontSize(9);
  logRows.forEach(l=>{ need(14); doc.text(`${stamp(new Date(l.ts))}   ${l.txt}`, M, y+9); y += 14 });

  const pages = doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(`${ref()}  ·  page ${i} of ${pages}`, W/2, H-24, {align:'center'});
  }

  return {blob: doc.output('blob'), name: fileName()};
}
async function sharePdf(blob, name){
  const file = new File([blob], name, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name,
      text: isCheck()? `Upplåsning ${ref()}` : isNewProp()? ref() : `Inspection ${ref()}` }); return }
    catch(e){ if(e && e.name === 'AbortError') return }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
async function doExport(){
  commitPendingPads();
  await ensureGalleryUploaded();
  toast(T('Building PDF'));
  const out = await buildPdf();
  if(!out) return legacyPrint();
  await sharePdf(out.blob, out.name);
}
const mailTarget = () => isCheck()? 'guestservice@beaps.se' : isNewProp()? 'michal@beaps.se' : 'longstay@beaps.se';
// Up to this size the PDF rides base64-encoded inside the request, as it always has. Above it
// the report is parked in the gallery's storage first (report-put) and the mail carries a link
// the mail service fetches itself, so the server never holds the bytes as text. That is what
// lets a move-out with two hundred photos go out by mail like any other instead of stopping at
// the share sheet.
const MAIL_INLINE_MAX = 4*1048576;
// beaps.se is Microsoft 365, which takes a message of about 25 MB once the attachment is base64-encoded.
const MAIL_MAX = 16*1048576;
// The signing link takes the same size; MAX_PDF on the server is the twin of this.
const SIGN_MAX = 16*1048576;
// The report's fingerprint, printed on the signature page so the two files that come out of a
// signing can be told to belong together. Computed here because a worker on the free plan cannot
// spare the CPU to hash a 16 MB file. Null when the browser won't do it - it must never block.
async function sha256Hex(blob){
  try{
    const buf = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null }
}
// Sends the report for a signing link up as raw bytes. Returns {ok,id}, or {legacy:true} when
// the host has no such endpoint - an older Netlify deploy answers 404 and Cloudflare answers
// the app's own HTML with 200 on an unknown /api path, so neither counts as an upload.
async function uploadSignPdf(blob, say){
  let shown = -1, sist = 'ingen kontakt';
  for(let attempt=0; attempt<2; attempt++){
    if(attempt) await new Promise(r=>setTimeout(r, 1500));
    try{
      const r = await putWithProgress('/api/sign-upload', blob, 'application/pdf', 120000,
        pct => { if(pct !== shown){ shown = pct; say(`${T('Uploading the report')} ${pct} %`) } });
      if(r.status===404 || r.status===405) return {ok:false, legacy:true};
      if(r.status===401) return {ok:false, reason: r.login? 'login' : 'ladda om'};
      if(r.status===413) return {ok:false, reason:'size'};
      let j = null; try{ j = JSON.parse(r.text) }catch(e){}
      if(r.status>=200 && r.status<300) return (j && j.ok && j.id)? {ok:true, id:j.id} : {ok:false, legacy:true};
      sist = 'server ' + r.status;
    }catch(e){ sist = String(e && e.message || e) }
  }
  return {ok:false, reason:sist};
}
// PUT with a progress figure, which fetch cannot give. Resolves with the status and body text.
function putWithProgress(url, blob, type, ms, onPct){
  return new Promise((res, rej)=>{
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Type', type);
    Object.keys(AUTH).forEach(k=>x.setRequestHeader(k, AUTH[k]));
    x.timeout = ms;
    x.upload.onprogress = e => { if(e.lengthComputable && onPct) onPct(Math.round(e.loaded*100/e.total)) };
    x.onload = ()=>{
      // XHR does not pass through the fetch wrapper, so the login wall is noticed here.
      const login = x.status===401 && typeof x.getResponseHeader==='function' && !!x.getResponseHeader('X-Beaps-Login');
      if(login) needLogin();
      res({status:x.status, text:x.responseText||'', login});
    };
    x.onerror = ()=>rej(new Error('ingen kontakt'));
    x.ontimeout = ()=>rej(new Error('timeout'));
    x.onabort = ()=>rej(new Error('abort'));
    x.send(blob);
  });
}
// Uploads the report to the gallery's storage. One retry, as with the photos: mobile networks
// drop a request after idle now and then. The toast follows the upload so a long one is not
// mistaken for a hang.
async function parkReport(blob, token){
  let shown = -1, sist = 'ingen kontakt';
  for(let attempt=0; attempt<2; attempt++){
    if(attempt) await new Promise(r=>setTimeout(r, 1500));
    try{
      const r = await putWithProgress('/api/report-put?t='+token, blob, 'application/pdf', 120000,
        pct => { if(pct !== shown){ shown = pct; toast(`${T('Uploading the report')} ${pct} %`) } });
      if(r.status===401) return {ok:false, reason: r.login? 'login' : 'ladda om'};
      if(r.status===413) return {ok:false, reason:'size'};
      let j = null; try{ j = JSON.parse(r.text) }catch(e){}
      // The id is random per upload, so the report cannot be guessed at from the gallery link.
      if(r.status>=200 && r.status<300 && j && j.ok && j.id) return {ok:true, id:j.id};
      sist = 'server ' + r.status;
    }catch(e){ sist = String(e && e.message || e) }
  }
  return {ok:false, reason:sist};
}
async function mailPdf(blob, name){
  if(blob.size > MAIL_MAX) return {ok:false, reason:'size'};
  const body = {
    filename: name,
    kind: isCheck()? 'upplasning' : isNewProp()? 'nyttobjekt' : 'besiktning',
    subject: (isCheck()? 'UpplåsningPDF ' : 'BesiktningPDF ') + ref(),
    // lets the server file the report next to its own photos in Dropbox, and is where a big
    // report is parked
    gallery: (S.gallery && S.gallery.token) || null
  };
  if(blob.size <= MAIL_INLINE_MAX){
    body.pdf = await new Promise(res=>{ const fr = new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob) });
  } else {
    // no gallery means nowhere to park it, so this one goes by the share sheet
    if(!body.gallery) return {ok:false, reason:'size'};
    const up = await parkReport(blob, body.gallery);
    if(!up.ok) return up;
    body.hosted = up.id;
    toast(T('Sending'));
  }
  const ac = new AbortController();
  try{
    // A hosted report gets longer: inside this one call the server copies it to Dropbox and
    // Resend fetches it, and a timeout here after the mail has gone would only produce a
    // "did not go through" and a second copy by the share sheet.
    const r = await withTimeout(fetch('/api/send-pdf', {
      method:'POST', headers:{'Content-Type':'application/json', ...AUTH}, signal: ac.signal,
      body: JSON.stringify(body)
    }), body.hosted ? 60000 : 25000);
    if(r.status===429) return {ok:false, reason:'quota'};
    if(r.status===401) return {ok:false, reason: loginNeeded(r)? 'login' : 'ladda om'};
    if(!r.ok) return {ok:false, reason:'server '+r.status};
    // Cloudflare responds 200 with the app's HTML on an unknown /api path. Require a real JSON ok
    // so we never claim "Emailed" when the function never ran.
    let j = null; try{ j = await r.json() }catch(e){}
    if(!j || j.ok !== true) return {ok:false, reason:'ej bekräftat'};
    return {ok:true};
  }catch(e){ try{ ac.abort() }catch(_){}  return {ok:false, reason:'ingen kontakt'} }
}
async function sendPdf(){
  commitPendingPads();
  await ensureGalleryUploaded();
  toast(T('Building PDF'));
  const out = await buildPdf();
  if(!out) return legacyPrint();
  toast(T('Sending'));
  const m = await mailPdf(out.blob, out.name);
  if(m.ok){ toast(T('Emailed to') + ' ' + mailTarget()); return }
  // Not logged in: the login sheet is already up, and the report is still on the phone. A share
  // sheet on top of it would only be in the way.
  if(m.reason==='login') return toast(T('Log in and send again'));
  if(m.reason==='size') toast(T('Too large for email, opening share'));
  else if(m.reason==='quota') toast(T('Daily email limit reached, opening share'));
  else if(m.reason==='ladda om') toast(T('Reload the app — opening share'));
  else toast(T('The email did not go through, opening share'));
  await sharePdf(out.blob, out.name);
}

// The backup file: the inspection with its photos and video, as one JSON blob. Built apart
// from the sharing so a test can read what Restore will be given.
async function buildBackup(){
  // check-ins have the photos on the checklist rows, other types on the rooms, and a new property
  // on its equipment items too. Include all of them, plus the video, so a backup never becomes
  // silently incomplete.
  const barare = (S.rooms||[]).concat(S.checks||[], S.tech||[]);
  let video = null;
  try{ if(S.video && S.video.stored) video = await store.get(K.video(S.id)) }catch(e){}
  // Written as a stream of pieces straight into the Blob. Turning a hundred photos into one
  // giant string first is exactly what a phone runs out of memory on.
  const parts = ['{"version":1,"exported":' + Date.now() +
                 ',"inspection":' + JSON.stringify(S) +
                 ',"video":' + JSON.stringify(video || null) + ',"photos":{'];
  video = null;
  let forst = true;
  for(const r of barare){
    for(const p of (r.photos||[])){
      const full = await getFull(p.id);
      if(!full) continue;
      parts.push((forst?'':',') + JSON.stringify(p.id) + ':' + JSON.stringify(full));
      forst = false;
    }
  }
  parts.push('}}');
  const blob = new Blob(parts, {type:'application/json'});
  parts.length = 0;
  return {blob, name: fileName().replace(/\.pdf$/,'') + '.json'};
}
async function backup(){
  const {blob, name} = await buildBackup();
  const file = new File([blob], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return }
    catch(e){ if(e && e.name === 'AbortError') return }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
