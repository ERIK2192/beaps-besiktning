async function sendSignRequest(){
  const err = document.getElementById('sr_err'), btn = document.getElementById('sr_send');
  const open = () => !!document.getElementById('signsheet');
  const reset = m => { if(!open()) return; btn.disabled=false; btn.textContent=T('Send signing link');
                       err.textContent=m; err.style.display='block' };
  const to = document.getElementById('sr_to').value.trim();
  const cc = document.getElementById('sr_cc').value.trim();
  const name = document.getElementById('sr_name').value.trim();
  const role = document.getElementById('sr_role').value.trim();
  if(!okMail(to)) return reset(T('Enter a valid email address under Email to.'));
  if(cc && !okMail(cc)) return reset(T("The CC address doesn't look valid."));
  err.style.display = 'none';
  const insp = S;                    // building the PDF takes time, the inspection can be switched in the meantime
  const gammal = (S.signReq && S.signReq.token && (S.signReq.status==='pending' || S.signReq.status==='expired')) ? S.signReq.token : null;

  btn.disabled = true; btn.textContent = T('Building PDF…');
  commitPendingPads(['inspector']);   // the counterparty isn't here, that is why a link is being sent
  await ensureGalleryUploaded();
  // Built for the link: the lines stay empty for the signing, whatever state the report was in.
  const out = await buildPdf({forSigning:true});
  if(S !== insp) return reset(T('You switched inspection, nothing was sent.'));
  if(!out) return reset(T('The PDF engine could not be loaded. Check the connection and try again.'));
  // the same cap the server uses, so it isn't built and uploaded unnecessarily
  if(out.blob.size > SIGN_MAX)
    return reset(T('The report is') + ' ' + mb(out.blob.size) + ' ' + T('and too large for the signing link. Remove a few photos and try again.'));

  btn.textContent = T('Sending…');
  const body = { filename:out.name, ref:ref(), type:S.type,
    address:S.address, apt:aptLabel(S.apt, S.aptName), inspector:S.inspector.name,
    to, cc, recipientName:name, recipientRole:role,
    gallery: (S.gallery && S.gallery.token) || null,
    // printed on the signature page so it and the report can be told to belong together.
    // Done here because the server cannot afford to hash a 16 MB file.
    sha256: await sha256Hex(out.blob) };

  const up = await uploadSignPdf(out.blob, m => { if(S === insp) btn.textContent = m });
  if(S !== insp) return reset(T('You switched inspection, nothing was sent.'));
  if(up.ok) body.pdfId = up.id;
  else if(up.legacy){
    // A host without the upload endpoint takes the PDF inside the request, as it always did.
    if(out.blob.size > 4*1048576) return reset(T('The report is too large for the signing link.'));
    body.pdf = await new Promise(res=>{ const fr=new FileReader();
      fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(out.blob) });
  }
  else if(up.reason==='size') return reset(T('The report is too large for the signing link.'));
  else if(up.reason==='login') return reset(T('Log in and try again.'));
  else if(up.reason==='ladda om') return reset(T('The app needs updating — reload the page and try again.'));
  else return reset(T('No contact with the server. Check the connection and try again.'));

  btn.textContent = T('Sending…');
  const ac = new AbortController();
  let r;
  try{
    r = await withTimeout(fetch('/api/sign-request', {
      method:'POST', headers:{'Content-Type':'application/json', ...AUTH}, signal: ac.signal,
      body: JSON.stringify(body)
    }), 45000);
  }catch(e){ try{ ac.abort() }catch(_){}  return reset(T('No contact with the server. Check the connection and try again.')) }
  if(!r.ok){
    // the server responds with short plain-text errors. If the response is an HTML page the function
    // isn't running, and then the user shouldn't get a wall of markup in the error box.
    const txt = (await r.text().catch(()=>'')).trim();
    const kort = (txt && txt.length < 160 && txt.indexOf('<') < 0) ? txt : '';
    return reset(r.status===429? T("Today's email limit is reached. Try again later.")
               : r.status===413? T('The report is too large for the signing link.')
               : r.status===401? (loginNeeded(r)? T('Log in and try again.') : T('The app needs updating — reload the page and try again.'))
               : r.status===404? T('The signing function is not running on the server yet.')
               : r.status===501? T('Email sending is not configured on the server.')
               : (kort || T('Could not send') + ' (' + r.status + ').'));
  }

  let res; try{ res = await r.json() }catch(e){ res = null }
  if(!res || !res.token) return reset(T('The server responded unexpectedly. Try again.'));
  if(S !== insp) return reset(T('You switched inspection. The link is sent, but could not be linked to the report — open it and send again.'));
  if(gammal) revokeSignLink(gammal);   // any previous link must not be signable in parallel
  if(name) S.counter.name = name;
  if(role) S.counter.role = role;
  S.signReq = { token:res.token, url:res.url, to, cc, name, role,
                sentAt:Date.now(), expires:res.expires, status:'pending' };
  if(!S.closedAt) S.closedAt = Date.now();
  log(`Signing link sent to ${to}${cc? ' (copy '+cc+')':''}`);
  log('Report locked awaiting signature');
  await flushSave();
  closeSignSheet();
  toast(T('Signing link sent'));
  render(); window.scrollTo(0,0);
}

async function checkSignStatus(silent){
  if(!S || !S.signReq) return;
  const insp = S;                    // the call is often made in the background, the inspection can be closed in the meantime
  let r;
  try{ r = await withTimeout(fetch('/api/sign-load?t='+insp.signReq.token), 15000) }
  catch(e){ if(!silent) toast(T('No contact with the server')); return }
  if(!r.ok){
    // The record is gone from the server (a waiting one lives 37 days). A link past its own
    // date is expired, and the phone may as well say so instead of "awaiting" for ever.
    if(r.status===404 && S === insp && S.signReq && S.signReq.status==='pending' && S.signReq.expires && Date.now() > S.signReq.expires){
      S.signReq.status = 'expired';
      saveOpenComment(); saveCheckComments(); await flushSave(); render();
      if(!silent) toast(T('The link has expired'));
      return;
    }
    if(!silent) toast(T('Could not read status right now')); return;
  }
  const m = await r.json();
  if(S !== insp || !S.signReq) return;
  const before = S.signReq.status;
  S.signReq.status = m.status;
  // the status is fetched in the background when the report is opened. Never redraw without
  // first taking care of what the user may have typed in an open field.
  saveOpenComment(); saveCheckComments();

  if(m.status==='signed' && before!=='signed'){
    S.signReq.signedAt = m.signedAt;
    S.signReq.signedName = m.signedName;
    S.signReq.signedRole = m.signedRole;
    S.sig.counter = {remote:true, ts:m.signedAt, name:m.signedName||S.signReq.name||''};
    if(!S.signedAt) S.signedAt = m.signedAt;
    if(m.signedName) S.counter.name = m.signedName;
    if(m.signedRole) S.counter.role = m.signedRole;
    log(`Signed by ${m.signedName || S.signReq.name || 'the counterparty'} via signing link`);
    await flushSave(); render();
    return toast(T('Signed, the report has been emailed'));
  }
  await flushSave();
  if(silent){ if(before!==m.status) render(); return }
  render();
  toast(m.status==='signed'? T('Already signed')
      : m.status==='cancelled'? T('The link is revoked')
      : m.status==='expired'? T('The link has expired')
      : T('Still awaiting signature'));
}

async function copySignLink(){
  if(!S.signReq) return;
  try{ await navigator.clipboard.writeText(S.signReq.url); toast(T('Link copied')) }
  catch(e){ prompt(T('Copy the link:'), S.signReq.url) }
}

// Revoke a link on the server. If it isn't confirmed (offline/error) the token is put in a queue
// that is drained the next time an inspection is opened, so an old link never stays alive.
async function revokeSignLink(token){
  if(!token) return;
  let r;
  try{ r = await withTimeout(fetch('/api/sign-cancel', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({t:token})}), 12000) }
  catch(e){ queueRevoke(token); return }
  // ok = revoked, 409 = already signed, 404/410 = does not exist/expired: nothing more to do
  if(!(r.ok || r.status===409 || r.status===404 || r.status===410)) queueRevoke(token);
}
function queueRevoke(token){
  if(!S || !token) return;
  S.revoke = S.revoke || [];
  if(!S.revoke.includes(token)){ S.revoke.push(token); save() }
}
async function drainRevokes(){
  if(!S || !S.revoke || !S.revoke.length) return;
  const kvar = [];
  for(const t of S.revoke){
    let r;
    try{ r = await withTimeout(fetch('/api/sign-cancel', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({t})}), 12000) }
    catch(e){ kvar.push(t); continue }
    if(!(r.ok || r.status===409 || r.status===404 || r.status===410)) kvar.push(t);
  }
  if(kvar.length !== S.revoke.length){ S.revoke = kvar; save() }
}
// The first time a locked report is changed: unlock it silently so the exported PDF never
// claims a signature on content that changed afterwards. No dialog - just a notice.
function unlockIfLocked(){
  if(!S || !(S.signedAt || S.closedAt)) return false;
  const q = S.signReq;
  if(q && q.token && (q.status==='pending' || q.status==='expired')){
    revokeSignLink(q.token); toast(T('The signing link was revoked — the report opened for editing'));
  } else toast(T('The report opened for editing'));
  S.signReq = null; S.signedAt = null; S.closedAt = null; S.sig = {};
  log('Changed after locking — the report is open again');
  return true;
}

async function cancelSignLink(){
  if(!S || !S.signReq) return;
  if(!confirm(T('Revoke the signing link? The recipient can then no longer sign it.'))) return;
  const insp = S;
  let r;
  try{
    r = await withTimeout(fetch('/api/sign-cancel', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({t:insp.signReq.token})}), 15000);
  }catch(e){ return toast(T('No contact with the server')) }
  if(r.status===409){ toast(T('Was signed first')); return checkSignStatus(true) }
  if(!r.ok) return toast(T('Could not revoke the link'));
  if(S !== insp || !S.signReq) return toast(T('The link is revoked'));
  S.signReq.status = 'cancelled';
  log('Signing link revoked');
  await flushSave(); render();
  toast(T('The link is revoked'));
}

// A backup file back into this phone: the inspection, its photos and its video, exactly as
// Backup wrote them. This is how work moves from one address or icon to another, since the
// phone keeps every address's storage apart. An inspection that is already here is left
// alone - a backup is never allowed to write over newer work - and the file is read as a
// whole first, so a broken file changes nothing.
async function restoreBackup(d){
  const insp = d && d.inspection;
  if(!insp || !insp.id || !Array.isArray(insp.rooms)) return {ok:false, reason:'bad'};
  if(await store.get(K.insp(insp.id))) return {ok:false, reason:'exists', id:insp.id};
  const barare = (insp.rooms||[]).concat(insp.checks||[], insp.tech||[]);
  for(const rc of barare) for(const p of (rc.photos||[])){ const data = d.photos && d.photos[p.id]; if(data) await store.set(K.photo(insp.id,p.id), data) }
  if(d.video && insp.video){ if(await store.set(K.video(insp.id), d.video)) insp.video.stored = true }
  if(!await store.set(K.insp(insp.id), insp)) return {ok:false, reason:'write'};
  const idx = (await store.get(K.index)) || [];
  if(!idx.find(x=>x.id===insp.id)) idx.unshift(indexRow(insp));
  await store.set(K.index, idx);
  return {ok:true, id:insp.id};
}
async function pickRestore(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.onchange = async e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    let r;
    try{ r = await restoreBackup(JSON.parse(await f.text())) }catch(err){ r = {ok:false, reason:'bad'} }
    if(r.ok){ toast(T('Restored')); if(view==='start') renderStart(); return }
    toast(r.reason==='exists'? T('Already on this phone') : r.reason==='write'? T('The phone refused a write. Make a backup.') : T('Could not read the file'));
  };
  inp.click();
}
// The list on the start screen is an index kept next to the inspections. Should a row ever be
// missing from it — an interrupted write, a database connection iOS closed mid-save — the
// inspection itself is still on the phone under its own key. Put such orphans back in the
// list instead of letting them look deleted. If the index can't be read at all, nothing is
// written: a truncated list must never be saved over a good one.
async function loadIndex(){
  let idx;
  try{ idx = await store.getStrict(K.index) }
  catch(e){ return (await store.get(K.index)) || [] }
  if(!Array.isArray(idx)) idx = [];
  const seen = new Set(idx.map(r=>r && r.id));
  let added = 0;
  for(const k of await store.keys('bp:insp:')){
    const id = String(k).slice('bp:insp:'.length);
    if(!id || seen.has(id)) continue;
    const s = await store.get(k);
    if(!s || s.id !== id) continue;
    idx.push(indexRow(s));
    seen.add(id); added++;
  }
  if(added){
    idx.sort((a,b)=>(b.created||0)-(a.created||0));
    await store.set(K.index, idx);
  }
  return idx;
}
// The reports live in the browser's storage, and iPhone keeps a separate store for Safari, for
// every app's built-in browser and for a home-screen icon. The icon is the one place they are
// safe, so the start screen says so until the app runs from one. Information, not a gate.
const isStandalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
let showInstall = false;
function toggleInstall(){ showInstall = !showInstall; renderStart() }
function homeScreenCard(){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const steps = ios
    ? ['Open this address in Safari.', 'Tap the Share button (the square with an arrow).', 'Scroll down and tap Add to Home Screen, then Add.', 'From now on, open the app from the icon.']
    : ['Open this address in Chrome.', 'Open the menu (the three dots).', 'Tap Add to Home screen or Install app.', 'From now on, open the app from the icon.'];
  return `<div class="card" style="border-color:var(--brand-dark);box-shadow:inset 3px 0 0 var(--brand)">
    <div style="font-weight:650">${T('Save the app to the home screen')}</div>
    <div class="hint" style="margin-top:4px">${T('Reports are stored only in the browser they were made in. In a private tab, or in the browser inside Outlook or Teams, they can disappear. The home-screen app keeps them.')}</div>
    ${showInstall? `<ol style="margin:10px 0 4px;padding-left:20px;font-size:14px;line-height:1.5">${steps.map(s=>`<li>${T(s)}</li>`).join('')}</ol>
      <div class="hint">${T('Reports made here in the browser are not moved to the icon. Send anything unfinished first, and never delete the icon while it holds unsent reports.')}</div>` : ''}
    <button class="btn ghost small" style="margin-top:10px" onclick="toggleInstall()">${showInstall? T('Hide') : T('Show how')}</button>
  </div>`;
}
async function renderStart(){

            ${r.plan && r.plan.length && !r.locked ? `<div class="planline">${T(r.plan.length === 1 ? 'key' : 'keys')} ${esc(r.plan.join(', '))} ${T('with you')}</div>` : ''}</span>
            <span class="chev">›</span>

        </div>`).join('')
        : `<div class="empty">

           </div>`}
      ${editList && idx.length? `<button class="btn ghost small" style="width:100%;margin-top:6px;color:var(--rec)" onclick="delAll()">${T('Delete all')} ${idx.length} ${T('reports')}</button>`:''}
    </div>`;
  // One button at the bottom. Checking a key in or out moved into the menu (Erik, 2026-09-23):

  document.body.classList.toggle('noreports', !idx.length);

}

async function wipe(id){
  for(const k of await store.keys('bp:ph:'+id+':')) await store.del(k);
  for(const k of await store.keys('bp:th:'+id+':')) await store.del(k);
  await store.del(K.video(id));
  await store.del(K.insp(id));
}
async function delInsp(id){
  const idx = (await store.get(K.index)) || [];
  const row = idx.find(x=>x.id===id) || {};
  if(!confirm(`${T('Delete')} ${refOf(row)}? ${T('Photos and video disappear and cannot be recovered.')}`)) return;
  await wipe(id);
  await store.set(K.index, idx.filter(x=>x.id!==id));
  toast(T('Deleted'));
  renderStart();
}
async function delAll(){
  const idx = (await store.get(K.index)) || [];
  if(!confirm(`${T('Delete all')} ${idx.length} ${T('reports on this phone?')}`)) return;
  if(!confirm(T('Are you sure? This cannot be undone.'))) return;
  for(const r of idx) await wipe(r.id);
  await store.set(K.index, []);

}
async function newInsp(){
  editList = false;
  // The inspector is the name set in the menu; it is the same person every time on this phone.
  // aptName is left unset until the register has answered once (syncAptName), so an inspection
  // typed in while the register could not load is looked up again when it is next opened.
  S = { id:uid(), created:Date.now(), address:'', apt:'', type:'Upplåsning',
        inspector:{name:keyMe||''}, counter:{name:'',role:''},
        rooms:[...DEFAULT_ROOMS.map(n=>mkRoom(n)), mkRoom(KEYS_ROOM,true)],
        video:null, comp:{in:0,out:0}, checks:null, tech:null, sig:{}, signReq:null, gallery:null,
        signedAt:null, closedAt:null, log:[] };
  photoCache={}; videoURL=null; openRoom=null; legacyType=null;
  for(const k in pads) delete pads[k];   // ink drawn in another inspection must not follow along
  ensureChecks(); log('Inspection created'); save(); go('object');
}
async function openInsp(id){
  editList = false;
  S = await store.get(K.insp(id));
  if(!S) return alert(T('Could not read the inspection.'));
  photoCache={}; videoURL=null; openRoom=null;
  for(const k in pads) delete pads[k];
  if(!S.rooms.some(r=>r.fixed)) S.rooms.push(mkRoom(KEYS_ROOM,true));
  if(!S.comp) S.comp = {in:0,out:0};
  if(!S.sig) S.sig = {};
  legacyType = NEW_TYPES.includes(S.type)? null : S.type;
  ensureChecks(); ensureTech();
  await loadMedia(id); paintTicker(); go((S.signedAt||S.closedAt)?'sign':'rooms');
  // A draft made before the apartment name was kept gets it now, from the register. Only a
  // draft: a report already finished or signed keeps the title it was closed with. In the
  // background and only once the inspection is on screen: a slow network must not hold it
  // back, and a repaint must never land on the start screen the user just left.
  if(S.apt && S.aptName === undefined && !(S.signedAt || S.closedAt)){
    const insp = S;
    loadFastigheter().then(()=>{
      if(S !== insp || view === 'start') return;
      // Repainted only on the rooms view, where nothing can be lost to it. On the finish view a
      // signature may be half drawn on a pad, and a repaint would wipe it; the name is on the
      // record and shows on the next paint, and the PDF reads ref() when it is built.
      if(syncAptName()){ save(); if(view === 'rooms'){ saveOpenComment(); saveCheckComments(); render() } }
      else if(S.aptName !== undefined) save();
    });
  }
  drainRevokes();   // send any revocations that didn't go through during an offline moment
  // check in the background whether the counterparty has signed via the link
  if(S.signReq && S.signReq.status==='pending') checkSignStatus(true);
}

    ${S.log.map(l=>`<div class="logline"><b>${stamp(new Date(l.ts))}</b><span>${esc(l.txt)}</span></div>`).join('')}
  </div><button class="btn ghost" onclick="this.closest('.sheet').remove()">${T('Close')}</button></div>`;
  document.body.appendChild(el);
}

/* ---------- Key bundles ----------
   A tag carries the bundle number - "112:3" - either bare or as the link
   https://beaps.se/#nyckel=112:3, and nothing else. Scanning one, or typing the

   needed.

   to every phone from /api/keys-log. Where a bundle is right now is never stored as such:
   it is the last event for that bundle, whoever wrote it, worked out afresh on every sync.

   waiting wherever the bundle appears. */
const KEYNAME = 'bp:keyname';   // the name that goes on every line of the log
const KEYEV   = 'bp:keyev';     // the recent log as last seen from the server, plus ours
const KEYBASE = 'bp:keybase';   // the server's last event per bundle - reaches further back than KEYEV
const KEYQ    = 'bp:keyq';      // events written here that have not reached the server yet
const KEYSEEN = 'bp:keyseen';   // when the log was last fetched successfully, 0 = never
const KEYINI  = 'bp:keyini';    // your own initials, when the two letters from your name are wrong
const KEYREG  = 'bp:keyreg';    // the admin's register corrections {rev, recs:{id:entry}} (cflib/keyreg.js)

// as the server leaves them out (cflib/keys.js EPOCH). 0 = never emptied.
const KEYEPOCH = 'bp:keyepoch';

const afterEpoch = e => !!e && (Number(e.ts) || 0) >= keyEpoch;

function loadScript(src, ready){
  if(ready()) return Promise.resolve(true);
  return new Promise(res=>{
    let done = false;
    const finish = ok => { if(!done){ done = true; res(ok) } };
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>finish(ready()); s.onerror = ()=>finish(false);
    setTimeout(()=>finish(false), 15000);

// Both files are served from our own origin. A key cabinet is usually in a basement,
// and a script from a CDN is exactly what does not arrive down there.
const loadJsQR    = () => loadScript('jsqr.js', ()=>typeof jsQR==='function');

// Reads what is already on the phone. No network, no register - safe to call on every
// start screen paint.
let keyLocalP = null;
function keyLocal(){
  if(keyState) return Promise.resolve();
  if(keyLocalP) return keyLocalP;    // two early callers share one read, so neither can
  keyLocalP = (async()=>{            // overwrite the other's fresher state with a stale copy
    await store.del('bp:keys');      // tidy: the old projection is not kept any more
    keyMe     = (await store.get(KEYNAME))  || '';
    keyIni    = (await store.get(KEYINI))   || '';
    keyEvents = (await store.get(KEYEV))    || [];
    keyBase   = (await store.get(KEYBASE))  || [];
    keyQueue  = (await store.get(KEYQ))     || [];

// The full thing: local state plus the register behind the tags.

// The register as it stands: nycklar.js, with the admin's entries replacing their lines and
// adding new bundles. Worked out again only when either side has changed.
let regCache = null, regCacheSig = '';
function regAll(){
  const base = window.NYCKLAR || [], over = (keyReg && keyReg.recs) || {};
  const sig = base.length + ':' + (keyReg.ver || 0) + ':' + (keyReg.rev || 0) + ':' + Object.keys(over).length;
  if(regCache && sig === regCacheSig) return regCache;
  const have = new Set(base.map(b=>b.id));
  regCache = base.map(b => over[b.id] || b)
    .concat(Object.values(over).filter(r => r && okBundle(r.id) && !have.has(r.id)));
  regCache.byId = {}; regCache.forEach(b => { regCache.byId[b.id] = b });
  regCacheSig = sig;

}
const bundleOf = id => regAll().byId[id];
async function keyRegSet(recs, rev, ver){

  const map = {};
  (recs||[]).forEach(r => { if(r && okBundle(r.id) && Array.isArray(r.k)) map[r.id] = r });
  // An entry this phone saved after the server's copy was made is not in it yet: keep it.

/* Where a bundle is, is not stored - it is worked out from the log. The last event for a

   kept in keyEvents, so a bundle checked out long ago and never checked back in still
   shows as out even once its own check-out has scrolled off that tail.

const later = (a, b) => a.ts > b.ts || (a.ts === b.ts && String(a.id) > String(b.id));

    // it over to another person, otherwise the one who registered it (2026-10-13).

async function keyRemember(){

// Send whatever has not reached the server. Anything that fails stays queued. A write and

    try{
      const batch = keyQueue.slice(0,50);

        method:'POST',
        headers:{...AUTH, 'Content-Type':'application/json'},
        body: JSON.stringify({events: batch})

function keySync(force){

    let before = '';
    try{

      await keyFlush();

      // itself is read only by the key log page (logMore).
      // reg: the register rev this phone has; the server leaves the entries out when it matches.
      const r = await fetch('/api/keys-log?view=state&reg=' + (keyReg.ver || 0), {headers:AUTH});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if(typeof j.epoch === 'number') await keyEpochSet(j.epoch);
      if(Array.isArray(j.reg)) await keyRegSet(j.reg, j.regRev, j.regVer);

        // sent in the last two minutes (KV takes a few seconds to list a fresh entry).

// Write one event: visible here at once, on its way to everyone else. The person just
// acted, so the event must sort after the one that decides this bundle's status now -
// even when that one came from a phone whose clock runs ahead, or this one's runs
// behind - which is what the max() guarantees. Only this bundle's event is looked at,
// so one bad clock cannot drag every later timestamp in the log along with it.
async function keyWrite(bundle, kind, extra){
  const b = bundleOf(bundle), cur = bstate(bundle).ev;

    id: uid(), bundle, kind, ts: Math.max(Date.now(), cur ? (cur.ts||0) + 1 : 0, keyEpoch ? keyEpoch + 1 : 0),
    who: keyMe, reason: '', name: b? (b.n || 'lgh ' + b.l) : ''

  keyEvents.unshift(ev);
  keyQueue.push(ev);

// A name shrunk to the two letters that fit in a circle: "Erik Gardbring" -> EG. The full

// no wall and no /api/session, and a Log out there would promise something false. Asked once
// at start, through the bare fetch, so the answer can never raise the login sheet.
let hasWall = false;
async function probeWall(){
  try{
    const r = await withTimeout(_fetch('/api/session', {cache:'no-store'}), 8000);
    hasWall = (r.ok && /json/i.test(r.headers.get('content-type')||'')) || loginNeeded(r);
  }catch(e){}

/* ----- the login wall, from inside the app ----- */
// The server sets the session cookie at login and checks it on every call (see
// functions/_middleware.js); the app never holds the password. It only ever notices the wall
// as a 401 when the cookie has run out, and then asks for the password here, in place, so
// nothing typed into an open inspection is lost to a reload. Closing the sheet is allowed -
// the reports are on the phone - but no server call goes through until the login is done.
// Closed by hand, the sheet stays away for ten minutes: photos keep being copied to the
// server in the background, and every refused upload would otherwise raise it again over
// whatever is being typed. Nothing takes the focus either, for the same reason.
let loginDismissedAt = 0;
function needLogin(force){
  if(document.getElementById('login')) return;
  if(!force && Date.now() - loginDismissedAt < 10*60000) return;
  const el = document.createElement('div');
  el.className = 'sheet hasbar'; el.id = 'login';
  el.innerHTML = topbar(T('Log in'), T('The login has run out'), null, 'closeLogin(true)') + `<div class="wrap">
    <div class="card">
      <div class="hint" style="margin:0 0 12px">${T('Enter the team password to continue. You stay logged in until six months pass without the app being opened.')}</div>
      <form id="loginform" onsubmit="return doLogin(event)">
        <div class="field"><label class="eyebrow">${T('Password')}</label>
          <input id="loginpw" type="password" autocomplete="current-password" autocapitalize="off"
                 autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
      </form>
      <div class="hint" id="loginerr" style="color:var(--rec);display:none"></div>
    </div>
  </div>
  <div class="sheetbar">
    <button class="btn ghost small" onclick="closeLogin(true)">${T('Close')}</button>
    <button class="btn" id="loginbtn" onclick="doLogin()">${T('Log in')}</button>
  </div>`;
  document.body.appendChild(el);
}
function closeLogin(dismissed){
  const el = document.getElementById('login'); if(!el) return;
  el.remove();
  if(dismissed) loginDismissedAt = Date.now();
}
async function doLogin(ev){
  if(ev) ev.preventDefault();
  const pw = document.getElementById('loginpw'), btn = document.getElementById('loginbtn'), err = document.getElementById('loginerr');
  if(!pw || !btn || !pw.value) return false;
  btn.disabled = true; btn.textContent = T('Logging in…'); err.style.display = 'none';
  let r = null;
  try{
    r = await withTimeout(_fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pw.value})}), 15000);
  }catch(e){}
  if(r && r.ok){ closeLogin(); toast(T('Logged in')); return false }
  // Two kinds of 429: a burst (Retry-After a few seconds) and the fifteen-minute pause.
  const wait = r && r.status===429 ? Number(r.headers.get('Retry-After')) || 900 : 0;
  err.textContent = !r? T('No contact with the server')
    : r.status===401? T('Wrong password.')
    : r.status===429? (wait < 60 ? T('Too many attempts. Try again in a few seconds.') : T('Too many attempts. Wait fifteen minutes and try again.'))
    : r.status===503? T('The app password is not set on the server yet.')
    : T('Could not log in') + ' (' + r.status + ')';
  err.style.display = 'block';
  btn.disabled = false; btn.textContent = T('Log in');
  if(r && r.status===401){ pw.value = ''; try{ pw.focus() }catch(e){} }
  return false;
}

const LOG_HASH = '#nyckellogg';

// The log, newest first, one page at a time - read only while the key log page is open.
let logEv = [], logCursor = null, logLoaded = false, logBusy = false;
async function logMore(size){

    const q = '/api/keys-log?view=events&limit=' + (size || 50) + (logCursor? '&cursor=' + encodeURIComponent(logCursor) : '');

/* The key log as a table you can search and sort, like a spreadsheet (Erik, 2026-10-07).
   Two tabs: "Where now" - every bundle in the register and any the log knows of, with where it
   is - and "Log", every event newest first. One search box filters both as you type; every word
   has to match somewhere in the row (number, apartment, address, person, place, guest, reason).
   A click on a column heading sorts by it, a second click turns the order round. Export saves
   what is on screen as a file Excel opens. The log is read 50 rows at a time; "Load all" reads
   the rest when a search has to reach further back. Nothing here is fetched unless this page is
   open. */
let logTab = 'now', logQ = '', logSort = { now: ['status', 1], apts: ['ts', -1], log: ['ts', -1] };
// In the apartment and with the guest are the same place to us (Erik, 2026-10-21): one group,
// newest first within it; which of the two stays as the detail on the row.
const STATUS_ORDER = { lost: -1, out: 0, guest: 1, apt: 1, old: 1, box: 4, tube: 5, in: 6 };
const qWords = q => String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
const rowHits = (hay, ws) => { const h = hay.toLowerCase(); return ws.every(w => h.indexOf(w) >= 0) };
const aptOf = (id, ev) => { const b = bundleOf(id); return b ? ('lgh ' + b.l + (b.n ? ' ' + b.n : '')) : ((ev && ev.name) || '') };
const addrOf = id => { const b = bundleOf(id); return b ? b.a : '' };

// status is one of STATUS_ORDER's words (stKind); `where` who has it or where it is, `who`
// whoever registered it.
function nowRows(){
  const ids = new Set(regAll().filter(b=>!b.off).map(b=>b.id).concat(Object.keys(keyState||{})));
  // An archived bundle shows only while it is still out somewhere.
  return [...ids].filter(okBundle).filter(id => { const b = bundleOf(id); return !(b && b.off && bstate(id).status === 'in') }).map(id=>{
    const st = bstate(id), status = stKind(st);
    return { id, apt: aptOf(id, st.ev), addr: addrOf(id), status, st,
      who: status === 'in' ? '' : (st.by||''), where: stWhere(st),
      guest: st.guest||'', phone: st.phone||'', at: st.place || aptOf(id, st.ev),
      ts: status === 'in' ? (st.ev ? st.ev.ts : 0) : (st.since||0), ev: st.ev };
  });
}
// In apartments: every bundle left in an apartment or with a guest, and the older 'left' lines
// that may be either - one list (2026-10-21), the status saying which.
const IN_APT = ['apt', 'guest', 'old'];
const aptRows = () => nowRows().filter(r => IN_APT.includes(r.status));
function logRows(){
  return logLines().map(e=>({ id: e.bundle, apt: aptOf(e.bundle, e), addr: addrOf(e.bundle), what: evLine(e),
    who: e.who||'', ts: e.ts||0, ev: e, key: e.id }));
}
const NOW_COLS = [['id','Bundle'], ['apt','Apartment'], ['status','Status'], ['where','Where'], ['who','By'], ['ts','Since']];
const APT_COLS = [['id','Bundle'], ['at','Apartment'], ['status','Status'], ['guest','Guest'], ['phone','Phone'], ['ts','Since'], ['who','Left by']];
const LOG_COLS = [['ts','Time'], ['id','Bundle'], ['apt','Apartment'], ['what','What'], ['who','By']];
const TABS = { now: [NOW_COLS, () => nowRows()], apts: [APT_COLS, () => aptRows()], log: [LOG_COLS, () => logRows()] };
// Bundle numbers sort as numbers: 112:3 before 112:10, 99:1 before 112:1.
const bundleKey = id => { const m = /^(\d+):?(\d+)?/.exec(id||''); return m ? [Number(m[1]), m[2] != null ? Number(m[2]) : 1e9, id] : [1e12, 0, id] };
function cmpBy(col){
  return (x, y) => {
    if(col === 'id'){ const p = bundleKey(x.id), q = bundleKey(y.id); return p[0]-q[0] || p[1]-q[1] || String(p[2]).localeCompare(q[2]) }
    if(col === 'ts') return (x.ts||0) - (y.ts||0);
    if(col === 'status') return STATUS_ORDER[x.status] - STATUS_ORDER[y.status] || (y.ts||0) - (x.ts||0);
    return String(x[col]||'').localeCompare(String(y[col]||''), 'sv');
  };
}
function shownRows(){
  const ws = qWords(logQ), rows = TABS[logTab][1]();
  const hay = r => [r.id, r.apt, r.addr, r.who, r.where||'', r.what||'', r.ev ? [r.ev.reason, r.ev.place, r.ev.guest, r.ev.from, r.ev.holder, r.ev.phone, r.ev.unit, r.ev.note].join(' ') : '',
    r.st ? stText(r.st) : ''].join(' ');
  const [col, dir] = logSort[logTab];
  return rows.filter(r => !ws.length || rowHits(hay(r), ws)).sort((x, y) => dir * cmpBy(col)(x, y));
}
function keyLogHtml(){
  const out = Object.values(keyState||{}).filter(s=>s.status!=='in').length;

      <div class="kltabs">

        <button class="kltab${logTab==='log'?' on':''}" data-tab="log" onclick="logTab='log';paintLogBody()">${T('Log')}</button>
        <button class="kltab${logTab==='apts'?' on':''}" data-tab="apts" onclick="logTab='apts';paintLogBody()">${T('In apartments')}</button>

}
function logBodyHtml(){
  const hint = syncHint(), q = (keyQueue||[]).length;
  const cols = TABS[logTab][0], [scol, sdir] = logSort[logTab];

  return `
    ${hint? `<div class="hint" style="margin:6px 3px 8px">${hint}</div>` : ''}

      <thead><tr>${cols.map(([c, label])=>`<th onclick="logSortBy('${c}')" class="${c===scol?'on':''}">${T(label)}<span class="klarrow">${c===scol ? (sdir>0?'▲':'▼') : ''}</span></th>`).join('')}</tr></thead>

        || `<tr><td colspan="${cols.length}" class="klnone">${(logTab==='log' && logBusy) ? T('Updating…') : T('No matches')}</td></tr>`}</tbody>
    </table></div>
    ${rows.length > LIMIT ? `<div class="klcount" style="margin-top:8px">${T('Showing the first')} ${LIMIT}. ${T('Search to narrow it down.')}</div>` : ''}
    ${logTab==='log' && logCursor ? `<div class="kbtns">
        <button class="btn ghost" onclick="logMore()">${logBusy? T('Updating…') : T('Load older (50)')}</button>
        <button class="btn ghost" onclick="logAll()">${T('Load all')}</button></div>` : ''}`;

function exportLog(){

    </div>

    <div class="view">
      <video id="scanview" playsinline muted autoplay></video>
      <div class="scanbox" id="scanbox"><i></i></div>
      <div class="scanok" id="scanok"></div>
      <div class="scanhit" id="scanhit"></div>
      <div class="flash" id="scanflash"></div>
    </div>

  if(!await loadJsQR()) return scanMsg(T('Scanner unavailable — type the number'), true);

    return scanMsg(camReason(e), true);
  }
  // Keep the lens hunting for focus rather than locking on the background.
  try{
    const track = scanStream.getVideoTracks()[0];
    const able = track.getCapabilities ? track.getCapabilities() : {};
    if(able.focusMode && able.focusMode.includes('continuous')){
      await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }
  }catch(e){}

  const v = document.getElementById('scanview');
  if(!v) return;
  v.srcObject = scanStream;
  try{ await v.play() }catch(e){}
  scanOn = true;
  if(!kf.id){ if(!scanDone.length) scanMsg(T('Hold the tag in the frame')); scanSince = Date.now(); scanTick() }
  else paintScanFoot();
}
function scanMsg(txt, hideBox){
  const m = document.getElementById('scanmsg'); if(m) m.textContent = txt;
  if(hideBox){ const b = document.getElementById('scanbox'); if(b) b.classList.add('hidden') }
}
// A 23 mm code held at arm's length covers a small part of the frame, so scaling the
// whole picture down throws away the very pixels the decoder needs. Read the middle of
// the frame - what sits inside the yellow square - at close to full resolution instead,
// and only occasionally sweep the whole frame for a tag held off to one side.
let scanN = 0, scanSince = 0, scanNative = null, scanBusy = false;
// Each pass looks at a different slice: the middle of the frame at full resolution for a
// code held close, a wider square, then the whole picture for one held off to the side.
// Cycling beats picking one, because we cannot know how the tag is being held.
const SLICES = [0.55, 0.8, 1];
function readFrame(v, part, invert){
  const vw = v.videoWidth, vh = v.videoHeight;
  const side = Math.round(Math.min(vw, vh) * part);
  const sx = Math.round((vw - side) / 2), sy = Math.round((vh - side) / 2);
  const f = Math.min(1, 1100 / side);
  scanCv.width = Math.round(side * f); scanCv.height = Math.round(side * f);
  scanCtx.drawImage(v, sx, sy, side, side, 0, 0, scanCv.width, scanCv.height);
  try{
    const img = scanCtx.getImageData(0, 0, scanCv.width, scanCv.height);
    return jsQR(img.data, img.width, img.height,
                {inversionAttempts: invert ? 'attemptBoth' : 'dontInvert'});
  }catch(e){ return null }
}
async function scanTick(){
  if(!scanOn) return;
  const v = document.getElementById('scanview');
  if(v && v.readyState >= 2 && v.videoWidth && !scanBusy){
    scanBusy = true;
    try{
      if(scanNative){
        const found = await scanNative.detect(v);
        if(found && found.length && found[0].rawValue){ scanBusy = false; return gotCode(found[0].rawValue) }
      }
      scanN++;
      const part = SLICES[scanN % SLICES.length];
      const hit = readFrame(v, part, scanN % 6 === 0);
      if(hit && hit.data){ scanBusy = false; return gotCode(hit.data) }
    }catch(e){}
    scanBusy = false;
    // Say something useful if it has been staring at nothing for a while.
    if(Date.now() - scanSince > 6000){
      scanSince = Date.now() + 6000;
      scanMsg(T('Fill the frame and hold still'));
    }
  }
  scanRaf = requestAnimationFrame(scanTick);
}
/* The moment a code is read: a short buzz, the frame goes green, and a click.
   navigator.vibrate is Android only - iOS has no vibration API on the web at all -
   so the flash and the click are what an iPhone actually gives you. */
function scanFeedback(){
  try{ navigator.vibrate && navigator.vibrate(30) }catch(e){}
  const box = document.getElementById('scanbox');
  if(box){ box.classList.add('hit'); setTimeout(()=>box.classList.remove('hit'), 220) }
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ac = new Ctx(), o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 1720;
    g.gain.setValueAtTime(.055, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .09);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + .1);
    setTimeout(()=>{ try{ ac.close() }catch(e){} }, 400);
  }catch(e){}
}
function scanManual(){
  const el = document.getElementById('scanman');
  if(el && el.value.trim()) gotCode(el.value.trim(), true);
}
/* A tag holds "112:3" or "112:EXTRA" - or, on newer tags, a link the phone's own camera
   can open: https://beaps.se/#nyckel=112:3. Out in the world that link lands on the
   website, which says nothing about keys; in here it is just another way of writing
   the number. Only that exact shape counts - https, beaps.se, the number after
   #nyckel= - and the link is never opened or followed, only read. Anything else is
   somebody else's QR code. */
function tagNumber(raw){
  const s = String(raw).trim();
  if(!/^https?:\/\//i.test(s)) return s;
  try{
    const u = new URL(s), host = u.hostname.toLowerCase();
    if(u.protocol !== 'https:' || (host !== 'beaps.se' && host !== 'www.beaps.se')) return '';
    if(u.pathname !== '/' && u.pathname !== '') return '';
    const m = /^#nyckel=([^&]+)$/i.exec(u.hash);
    return m ? decodeURIComponent(m[1]) : '';
  }catch(e){ return '' }
}
// typed: the number was written in, not read by the camera - no pause, it opens at once.
function gotCode(raw, typed){
  const id = tagNumber(raw).toUpperCase().replace(/\s+/g,'');
  const b = bundleOf(id);
  if(!b){
    // It read something, so say what. A tag from the old test sheet, or a number that is
    // simply not in the register yet, look identical from the outside otherwise.
    scanFeedback();
    scanMsg(/^\d+:(\d+|EXTRA)$/.test(id)
      ? `${id} — ${T('not in the register')}`
      : T('Not a key tag'));
    scanSince = Date.now() + 4000;
    if(scanOn) scanRaf = requestAnimationFrame(scanTick);   // a stray QR must not end the scan
    return;
  }
  // The same tag read again while it is on screen: nothing to do.
  if((kf.id === id && document.getElementById('scan')) || scanHold === id) return;
  // Just put on the list and still in front of the camera: not read again until it has been out
  // of sight for a few seconds.
  if(!typed && scanSeen.id === id && Date.now() - scanSeen.at < 4000){ scanSeen.at = Date.now(); if(scanOn) scanRaf = requestAnimationFrame(scanTick); return }
  scanFeedback();
  // Identified - and nothing more. The scanner stops looking while the move is on screen.
  cancelAnimationFrame(scanRaf);
  if(!typed) holdThen(id);
  else if(listScan()) scanToList(id, fetchLast(id));
  else mvOpen(id, 'scan');
}
/* Scanning in a shortstay or a move-in (Erik, 2026-10-21): a bundle read only goes on the
   inspection's list - no move panel, no photo step, no Confirm. The key box's one button then
   leaves everything on the list (leavePlanned); the photo is taken with the key photo row as usual.
   One archived, reported lost or already there is not added, and said so. The scanner goes straight
   on to the next tag. A move-out (pick up) and a locked report still open the bundle as before. */
const listScan = () => scanJob.insp && scanJob.mode !== 'pick' && !!S && !S.signedAt && !S.closedAt;
let scanSeen = { id:'', at:0 };
async function scanToList(id, pre){
  await pre;
  if(!document.getElementById('scan') || !S) return;
  const b = bundleOf(id), k = mvKind(id), m = scanJob.mode;
  const why = b.off ? 'Archived' : k === 'lost' ? 'reported lost' : k === m ? (m === 'apt' ? 'already in the apartment' : 'already with the guest')
    : planPending(S).includes(id) ? 'already on the list' : '';
  if(!why){
    // A receipt from earlier in this inspection no longer holds once the bundle has moved since.
    S.keysOut = (S.keysOut || []).filter(r => r.bundle !== id);
    S.keysPlan = [...new Set((S.keysPlan || []).concat(id))];
    log(`Key ${id} scanned in for this inspection by ${keyMe}`);
    if(!scanDone.includes(id)) scanDone.push(id);
    const ok = document.getElementById('scanok');
    if(ok){ ok.innerHTML = `<b>✓</b><span>${esc(id)}</span>`; ok.classList.add('on'); setTimeout(() => ok.classList.remove('on'), 900) }
  }
  paintScanFoot();
  scanMsg(why ? `${id}: ${T(why)}` : `${id} ${T('on the list')}`);
  scanSeen = { id, at: Date.now() };
  if(scanOn){ scanSince = Date.now() + 2000; scanRaf = requestAnimationFrame(scanTick) }
}
// × on a chip: off the list again (a tag read by mistake).
function scanUnlist(id){
  if(!S) return;
  S.keysPlan = (S.keysPlan || []).filter(x => x !== id);
  scanDone = scanDone.filter(x => x !== id);
  log(`Key ${id} taken off the list`);
  paintScanFoot(); scanMsg(`${id} ${T('taken off the list')}`);
}
/* A tag read by the camera is held on screen for a moment before the bundle opens (Erik,
   2026-10-21: so fast it felt like nothing happened): its number, its name and a ring filling
   round it, SCAN_HOLD long. Where the bundle is is read from the server meanwhile, so the pause
   costs nothing - the bundle comes up already knowing. */
let SCAN_HOLD = 2000, scanHold = null;
function holdThen(id){
  const b = bundleOf(id), pre = fetchLast(id);
  scanHold = id;
  const hit = document.getElementById('scanhit');
  if(hit){
    hit.innerHTML = `<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="arc" cx="50" cy="50" r="44"/></svg>
        <b class="${id.length > 6 ? 'long' : ''}">${esc(id)}</b></div>
      <span>${esc([b.n, b.l ? 'lgh ' + b.l : ''].filter(Boolean).join(' · '))}</span>`;
    hit.style.setProperty('--hold', SCAN_HOLD + 'ms');
    hit.classList.add('on');
  }
  const sb = document.getElementById('scanbox'); if(sb) sb.classList.add('hidden');
  scanMsg(`${T('Reading')} ${id}…`);
  setTimeout(() => {
    if(scanHold !== id) return;
    scanHold = null;
    const h = document.getElementById('scanhit'); if(h) h.classList.remove('on');
    if(!document.getElementById('scan')) return;
    if(listScan()) scanToList(id, pre);
    else mvOpen(id, 'scan', pre);
  }, SCAN_HOLD);
}
function closeScan(){
  scanOn = false; cancelAnimationFrame(scanRaf); scanHold = null;
  if(scanStream){ scanStream.getTracks().forEach(t=>{ try{ t.stop() }catch(e){} }); scanStream = null }
  const el = document.getElementById('scan'); if(el) el.remove();
  if(kf.where === 'scan') kf = { id:null };
}
async function scanFinish(){
  const any = scanDone.length, insp = scanJob.insp;
  scanDone = [];
  closeScan();
  if(insp) paintInspKeyCard();
  else if(any && view === 'start') await renderStart();
}
// Back to reading tags, the camera still running: after a move, or "Scan another".
function scanAgain(){
  kf = { id:null }; scanHold = null;
  const ok = document.getElementById('scanok'); if(ok) ok.classList.remove('on');
  paintScanFoot();
  if(scanOn){ scanMsg(T('Hold the tag in the frame')); scanSince = Date.now(); scanRaf = requestAnimationFrame(scanTick) }
}

/* ----- the bundle behind the tag, opened from a list ----- */
function showBundle(id){
  const b = bundleOf(id);
  if(!b) return;
  closeBundle();          // never stack two bundle sheets on top of each other
  const el = document.createElement('div');
  el.className = 'sheet hasbar ksheet'; el.id = 'bundle'; el.dataset.bundle = id;
  document.body.appendChild(el);
  window.scrollTo(0,0);
  mvOpen(id, 'sheet');
}
function closeBundle(){ const el = document.getElementById('bundle'); if(el) el.remove(); if(kf.where === 'sheet') kf = { id:null } }
let histOpen = false;
function toggleHist(){ histOpen = !histOpen; const el = document.getElementById('bundle'); if(!el) return;
  paintBundle(el.dataset.bundle); if(histOpen) histLoad(el.dataset.bundle) }
async function backToStart(){ closeBundle(); closeScan(); if(view==='start') await renderStart() }

/* ======== Moving a bundle (2026-10-14) ========
   Scanning or opening a bundle only shows it: which bundle, where it is registered (the cabinet,
   a person, an apartment, a guest, a box or a tube) and the moves possible from there, the likely
   one first. Nothing changes until the move is confirmed, written out in full - "Flytta 113:1
   från lgh 1301 TRAST till skåpet". The bundle's state is read from the server when it is shown
   and again just before the move is written; if someone else moved it in between, the move is
   not written and the new state is shown. A state that cannot be read at all, with nothing on
   this phone either, is said to be unknown and nothing can be moved (admin can correct it).
   One move is one event: the status, the place, the holder and the log line all come from it.

   kf: { id, where:'scan'|'sheet', dest, reason, name, phone, unit, place, fresh:'loading'|'ok'|
         'stale'|'unknown', basis: id of the event the screen is based on, note, photos:[data] } */
const DESTS = ['me','cab','apt','guest','person','box','tube','lost'];
const DEST_LABEL = { me:'Me', cab:'Cabinet', apt:'In the apartment', guest:'Guest', person:'Someone else', box:'Service box', tube:'Key tube', lost:'Lost' };
let kf = { id:null };
const bundleApt = b => b ? 'lgh ' + b.l + (b.n ? ' ' + b.n : '') : '';
const objOf = id => String(id).split(':')[0];
// Where the bundle is, as a starting point: in (cabinet), mine, person (someone else), apt, guest,
// old (left, before the two were told apart), box, tube.
function mvKind(id){
  const s = bstate(id), k = stKind(s);
  return k === 'out' ? (sameName(s.holder, keyMe) ? 'mine' : 'person') : k;
}
const inInsp = () => kf.where === 'scan' && scanJob.insp && canHandover();
function validDests(id){
  if(kf.fresh === 'unknown' || kf.fresh === 'loading') return [];
  const k = mvKind(id);
  const all = {
    in:     ['me','apt','guest','person','box','tube','lost'],
    mine:   ['cab','apt','guest','person','box','tube','lost'],
    person: ['me','cab','apt','guest','person','box','tube','lost'],
    apt:    ['me','cab','guest','person','box','tube','lost'],
    guest:  ['me','cab','apt','person','box','tube','lost'],
    old:    ['me','cab','apt','guest','person','box','tube','lost'],
    box:    ['me','cab','apt','guest','person','box','tube','lost'],
    tube:   ['me','cab','apt','guest','person','box','tube','lost'],
    // found again: to you, or straight back to the cabinet
    lost:   ['me','cab']
  }[k] || [];
  return DESTS.filter(d => all.includes(d));
}
// The likely next step. In an inspection: what the inspection is for (in the apartment, to the
// guest, pick up) - nothing at all when the bundle is already there. Elsewhere: from the cabinet
// to you; from you back to the cabinet; from anyone or anywhere else to you.
function defaultDest(id){
  const v = validDests(id), k = mvKind(id);
  if(!v.length) return null;
  if(inInsp()){
    const m = scanJob.mode === 'pick' ? 'me' : scanJob.mode;
    if(m === k) return null;
    return v.includes(m) ? m : null;
  }
  const d = k === 'mine' ? 'cab' : 'me';
  return v.includes(d) ? d : v[0];
}
// The place an apartment or guest move goes to: the inspection's apartment, else the bundle's own.
function mvApt(id){
  const b = bundleOf(id);
  if(inInsp()){ const c = inspApt(); return { apt: c.apt || objOf(id), place: c.place || bundleApt(b) } }
  return { apt: objOf(id), place: bundleApt(b) };
}
const mvGuest = () => inInsp() ? (S.keyTo || ((S.counter && S.counter.name) || '')) : (kf.name || '').trim();
function fromText(id){
  const s = bstate(id), k = mvKind(id);
  return k === 'in' ? T('the cabinet') : k === 'mine' ? T('you') : k === 'lost' ? T('lost') : k === 'person' ? (s.holder || T('someone'))
    : k === 'guest' ? [s.guest || T('the guest'), s.place].filter(Boolean).join(' · ')
    : (placeLabel(s) || T('the apartment'));
}
function toText(id, d){
  const f = kf;
  return d === 'me' ? T('you') : d === 'cab' ? T('the cabinet')
    : d === 'apt' ? T('the apartment') + ' ' + mvApt(id).place
    : d === 'guest' ? (mvGuest() || T('the guest')) + ' · ' + mvApt(id).place
    : d === 'person' ? ((f.name || '').trim() || '…')
    : (locName(d).toLowerCase() + ((f.unit || '').trim() ? ' ' + f.unit.trim() : ''));
}
// An e-mail address is optional; one that is filled in has to look like one.
const okEmail = e => !String(e || '').trim() || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e).trim());
const EMAIL_BAD = 'That e-mail address does not look right - write it like name@example.se, or leave it empty.';
const emailErr = v => okEmail(v) ? '' : `<div class="ferr" id="kf_emailerr">${T(EMAIL_BAD)}</div>`;
const moveSentence = (id, d) => d === 'lost'
  ? `${T('Report')} ${id} ${T('as lost')} (${T('last')}: ${fromText(id)})`
  : `${T('Move')} ${id} ${T('from')} ${fromText(id)} ${T('to')} ${toText(id, d)}`;
// The heading over the choices: what you are about to do from where it is.
function moveTitle(id){
  const k = mvKind(id), s = bstate(id);
  return k === 'lost' ? T('Found – to') : k === 'in' ? T('Check out to') : k === 'mine' ? T('Leave with') : k === 'person' ? `${T('Take over from')} ${s.holder} – ${T('to')}`
    : T('Pick up – to');
}

// Reads the bundle's last move straight from the server (one KV read, not the whole list) and
// folds it in. null when the server could not be reached.
async function fetchLast(id){
  try{
    const r = await withTimeout(fetch('/api/keys-log?view=hist&bundle=' + encodeURIComponent(id), {headers:AUTH}), 8000);
    if(!r.ok) return null;
    const j = await r.json();
    if(typeof j.epoch === 'number') await keyEpochSet(j.epoch);
    const hist = (j.events || []).filter(e => e && e.bundle === id);
    histCache[id] = hist;
    const ev = hist.filter(e => STATUS_KINDS.includes(e.kind) && afterEpoch(e)).sort((a, b) => later(a, b) ? -1 : 1)[0] || null;
    const cur = bstate(id).ev;
    if(ev && !(keyEvents||[]).some(e => e.id === ev.id) && (!cur || later(ev, cur))){ keyEvents.push(ev); applyEvents() }
    return { ev };
  }catch(e){ return null }
}
// pre: the server read already under way (started while the tag was held on screen).
async function mvOpen(id, where, pre){
  const b = bundleOf(id), place = b ? [b.a, b.l ? 'lgh ' + b.l : ''].filter(Boolean).join(' ') : '';
  kf = { id, where, dest:null, reason:'', name:'', phone:'', email:'', unit:'', place, fresh:'loading', basis:'', note:'', photos:[] };
  paintMove();
  const r = await (pre || fetchLast(id));
  if(kf.id !== id || kf.where !== where) return;
  kf.fresh = r ? 'ok' : (keySeenAt || bstate(id).ev) ? 'stale' : 'unknown';
  kf.basis = (bstate(id).ev && bstate(id).ev.id) || '';
  kf.dest = defaultDest(id);
  paintMove();
}
function paintMove(){
  if(!kf.id) return;
  if(kf.where === 'scan') paintScanFoot();
  else paintBundle(kf.id);
}
function kfSet(field, v){
  kf[field] = v;
  const el = document.getElementById('mvsentence'); if(el && kf.dest) el.textContent = moveSentence(kf.id, kf.dest);
  if(field === 'email'){ const er = document.getElementById('kf_emailerr'), ok = okEmail(v);
    if(ok && er) er.remove();
    else if(!ok && !er){ const box = document.getElementById('kf_email'); if(box) box.closest('.kfwrap').insertAdjacentHTML('beforeend', emailErr(v)) } }
}
function kfDest(d){ if(validDests(kf.id).includes(d)) kf.dest = d; kf.note = ''; kf.more = true; paintMove() }
// "Other errand": every move from the cabinet, in place of the shortstay-first view.
function mvMore(){ if(!kf.id) return; kf.more = true; paintMove() }
let koBusy = false;
const REASONS = ['Visning','Service','Hantverkare','Städ','Besiktning','Utflytt'];
function koPick(btn, reason){
  const already = btn.classList.contains('on');
  document.querySelectorAll('#kochips .chip').forEach(c=>c.classList.remove('on'));
  const input = document.getElementById('koreason');
  kf.reason = already ? '' : reason;
  if(input) input.value = kf.reason;
  if(!already) btn.classList.add('on');
}
// The name is the one thing the log cannot do without. Set once, in the menu, and kept on the
// phone. An inspection that already names its inspector counts as having set it.
async function koName(){
  let name = (keyMe || '').trim();
  if(!name && S && S.inspector && S.inspector.name) name = S.inspector.name.trim();
  if(!name){ toast(T('Set your name in the menu')); openMenu(); return '' }
  if(name !== keyMe){ keyMe = name; await store.set(KEYNAME, name) }
  return name;
}
// Where it was before, when that was not the cabinet: the person, the guest or the place.
const fromOf = (s, name) => s.status === 'placed' ? placeLabel(s) : (s.status === 'out' && s.holder && !sameName(s.holder, name) ? s.holder : '');

// The state line and the choices, the same in the scanner and on the sheet. Brief: the state line
// only (the scanner's shortstay-first view of a bundle in the cabinet).
function moveHtml(id, brief){
  const b = bundleOf(id), s = bstate(id), k = stKind(s), f = kf;
  const inp = (fld, ph, extra) => `<input id="kf_${fld}" value="${esc(f[fld])}" placeholder="${T(ph)}" oninput="kfSet('${fld}',this.value)" ${extra||''}>`;
  const stateLine = f.fresh === 'loading' ? `<div class="hint">${T('Reading where it is…')}</div>`
    : f.fresh === 'unknown' ? `<div class="mvwarn"><b>${T('Where this bundle is could not be read.')}</b> ${T('Nothing is changed. Try again with a connection.')}
        <div class="kbtns"><button class="btn ghost small" onclick="mvOpen('${id}','${f.where}')">${T('Try again')}</button>
        ${admOn ? `<button class="btn ghost small" onclick="mvCorrect('${id}')">${T('Correct (admin)')}</button>` : ''}</div></div>`
    : `<div class="mvstate"><span class="kstat ${stClass(k)}">${stText(s)}</span>
        ${k !== 'in' ? `<span>${esc(stWhere(s))}${s.since ? ' · ' + stamp(new Date(s.since)) : ''}${s.by && !sameName(s.by, s.holder) ? ' · ' + T('by') + ' ' + esc(s.by) : ''}</span>` : ''}</div>
       ${f.fresh === 'stale' ? `<div class="hint">${T('No contact - shown as last known on this phone')}</div>` : ''}
       ${k === 'old' ? `<div class="hint">${T('Older entry: left, not recorded whether in the apartment or with the guest.')}</div>` : ''}
       ${isQueued(s.ev) ? `<div class="kwait" style="margin-top:6px">${T('waiting')}</div>` : ''}`;
  if(b.off) return stateLine + `<div class="mvwarn"><b>${T('Archived')}</b> · ${T('This bundle is no longer in use. Hand it to an admin.')}</div>`;
  const v = validDests(id);
  if(!v.length || brief) return stateLine + (brief && f.note ? `<div class="mvwarn">${esc(f.note)}</div>` : '');
  const already = inInsp() && !f.dest && scanJob.mode !== 'pick' && mvKind(id) === scanJob.mode;
  const d = f.dest;
  const fields = d === 'me' && mvKind(id) === 'in' ? `
      <div class="chips" id="kochips" style="margin-top:10px">
        ${REASONS.map(r=>`<button class="chip${f.reason===r?' on':''}" onclick="koPick(this,'${r}')">${r}</button>`).join('')}
      </div>
      <input id="koreason" style="margin-top:8px" value="${esc(f.reason)}" placeholder="${T('Reason')}"
             oninput="kfSet('reason',this.value);document.querySelectorAll('#kochips .chip').forEach(c=>c.classList.remove('on'))">`

// The event a confirmed move writes - one, carrying everything the status and the log line show.
function moveEvent(id, d, name){
  const s = bstate(id), k = mvKind(id), f = kf;
  const reason = (f.reason || '').trim() || (inInsp() ? inspReason(S) : '');
  const a = mvApt(id);
  if(d === 'lost') return ['place', { who:name, loc:'lost', apt:objOf(id), place:'', reason:(f.reason||'').trim(), from: k === 'mine' ? name : fromOf(s, name) }];
  if(k === 'lost'){
    // Found: to you, or back in the cabinet.
    if(d === 'me') return ['out', { who:name, from:'Borttappad', reason:'Hittad' }];
    if(d === 'cab') return ['in', { who:name, from:'Borttappad' }];
  }
  if(d === 'me'){
    if(k === 'in') return ['out', { who:name, reason }];
    if(k === 'person') return ['out', { who:name, from: s.holder || '', reason }];
    return ['out', { who:name, act:'pickup', from: placeLabel(s), reason }];
  }
  if(d === 'cab') return ['in', { who:name, from: k === 'mine' ? '' : fromOf(s, name) }];
  if(d === 'apt') return ['place', { who:name, loc:'apt', apt:a.apt, place:a.place, reason, from: fromOf(s, name) }];
  if(d === 'guest') return ['place', { who:name, loc:'guest', guest: mvGuest(), phone: inInsp() ? '' : (f.phone||'').trim(), email: inInsp() ? '' : (f.email||'').trim(), apt:a.apt, place:a.place, reason, from: fromOf(s, name) }];
  if(d === 'person') return ['out', { who:name, holder:(f.name||'').trim(), phone:(f.phone||'').trim(), email:(f.email||'').trim(), from: k === 'mine' ? name : fromOf(s, name) }];
  return ['place', { who:name, loc:d, unit:(f.unit||'').trim(), place:(f.place||'').trim(), apt:objOf(id), from: fromOf(s, name) }];
}
// Confirm: read the bundle again, write the one event, then the photos and the receipt in an
// inspection. A second tap while it is being written does nothing.
async function bundleAct(id){
  if(koBusy || kf.id !== id) return;
  const b = bundleOf(id); if(!b || b.off){ toast(T('Archived')); return }
  const d = kf.dest;
  if(!d || !validDests(id).includes(d)) return;
  if(d === 'person' && !(kf.name||'').trim()){ toast(T('Write the name')); const n = document.getElementById('kf_name'); if(n) try{ n.focus() }catch(e){} return }
  if((d === 'person' || d === 'guest') && !okEmail(kf.email)){ toast(T(EMAIL_BAD)); const n = document.getElementById('kf_email'); if(n) try{ n.focus() }catch(e){} return }
  koBusy = true; paintMove();
  try{
    const name = await koName(); if(!name) return;
    // Has anyone moved it since this was shown? Then nothing is written; the new state is shown.
    const r = await fetchLast(id);
    const now = (bstate(id).ev && bstate(id).ev.id) || '';
    if(r && now !== kf.basis){
      kf.basis = now; kf.fresh = 'ok';
      kf.dest = validDests(id).includes(d) ? d : defaultDest(id);
      kf.note = T('Moved by someone else just now - check and confirm again');
      return;
    }
    if(!r && !keySeenAt && !bstate(id).ev){ kf.fresh = 'unknown'; return }
    const sentence = moveSentence(id, d);
    const insp = inInsp() ? S : null, locked = !!(insp && (insp.signedAt || insp.closedAt));
    const [kind, extra] = moveEvent(id, d, name);
    const ev = await keyWrite(id, kind, extra);
    if(!ev){ kf.note = T('Could not save'); return }
    // In an inspection: the photos of the keys into the report, and the receipt line.
    if(insp && S === insp && !locked){
      const pids = [];
      const tgt = keyPhotoTarget();
      if(tgt) for(const p of kf.photos){ if(await savePhoto(tgt.id, p)) pids.push(tgt.photos[tgt.photos.length - 1].id) }
      const act = d === 'apt' ? 'apt' : d === 'guest' ? 'guest' : (d === 'me' && ev.act === 'pickup') ? 'pickup' : '';
      if(act){
        S.keysOut = (S.keysOut || []).filter(k => k.bundle !== id);
        S.keysOut.push({ bundle:id, name:ev.name||'', place: act === 'pickup' ? (ev.from || '') : (ev.place || ''), guest: ev.guest || '',
                         act, ts:ev.ts, who:ev.who||'', evId:ev.id, photos: pids,
                         keys: b.k.filter(keyOn).map(k => [k[0]||'', k[1]||'', k[2]||1]) });
      }
      log(`Key ${id}: ${act === 'pickup' ? 'picked up' : act === 'guest' ? 'left with ' + (ev.guest || 'the guest') : act === 'apt' ? 'left in the apartment' : kind} by ${ev.who}`);
      await flushSave();
    }
    if(kf.where === 'scan'){
      if(!scanDone.includes(id)) scanDone.push(id);
      const ok = document.getElementById('scanok');
      if(ok){ ok.innerHTML = `<b>✓</b><span>${esc(id)}</span>`; ok.classList.add('on') }
      koBusy = false;
      scanAgain();
      const ok2 = document.getElementById('scanok'); if(ok2) ok2.classList.add('on');
      scanMsg(sentence + (locked ? ' · ' + T('report locked: in the key log only') : ''));
      setTimeout(() => { const o = document.getElementById('scanok'); if(o) o.classList.remove('on') }, 1100);
      return ev;
    }
    kf = { id:null };
    await backToStart();
    toast(sentence);
    return ev;
  }finally{ koBusy = false; if(kf.id === id) paintMove() }
}
/* Check out for shortstay (2026-10-20): from the cabinet to you, and a shortstay inspection for
   the bundle's apartment, address and apartment taken from the register - nothing to type. A
   second key for the same apartment joins the same inspection (one that is not finished and was
   made in the last two days), it does not make another. The keys wait in the inspection's key box
   as "leave in the apartment", so they are not scanned again there. */
async function checkoutForShortstay(id){
  if(koBusy || kf.id !== id || !validDests(id).includes('me')) return;
  kf.dest = 'me'; kf.reason = 'Shortstay';
  const ev = await bundleAct(id);
  if(!ev) return;
  const r = await planShortstay(id);
  if(r) scanMsg(`${id} ${T('checked out')} · ${T(r.created ? 'shortstay created' : 'added to the shortstay')} · ${bundleApt(bundleOf(id))}`);
}
async function planShortstay(id){
  const b = bundleOf(id); if(!b) return null;
  const idx = await loadIndex();
  const same = r => r && r.type === 'Upplåsning' && !r.locked && squash(r.address) === squash(b.a) && squash(r.apt) === squash(b.l)
    && Date.now() - (r.created || 0) < 48 * 3600e3;
  const row = idx.find(same);
  const prev = S;
  try{
    if(row) S = await store.get(K.insp(row.id));
    if(!S){
      S = { id:uid(), created:Date.now(), address:b.a || '', apt:b.l || '', type:'Upplåsning',
            inspector:{name:keyMe||''}, counter:{name:'',role:''},
            rooms:[...DEFAULT_ROOMS.map(n=>mkRoom(n)), mkRoom(KEYS_ROOM,true)],
            video:null, comp:{in:0,out:0}, checks:null, tech:null, sig:{}, signReq:null, gallery:null,
            signedAt:null, closedAt:null, log:[], keyMode:'apt' };
      ensureChecks();
      S.log.push({ts:Date.now(), txt:'Inspection created from key ' + id});
    }
    S.keysPlan = [...new Set((S.keysPlan || []).concat(id))];
    S.log.push({ts:Date.now(), txt:`Key ${id} checked out for this inspection by ${keyMe}`});
    await flushSave();
    return { created: !row, id: S.id };
  }finally{ S = prev }
}
/* Leaving the keys checked out for this inspection (2026-10-21): one tap on "Jag har lämnat 115:2
   och 115:3 i lägenheten" and it is done - no camera, no second step (Erik). The photo of the keys
   is its own thing, taken with the key photo row. Each bundle is read from the server first and
   moved from where it really is. One already in the apartment, archived or reported lost is not
   moved: it is said so and taken off the list, there being nothing more to do with it here. One
   whose state cannot be read at all (no contact, nothing on this phone) stays on the list. Each
   bundle gets its own event and its own receipt line, as from the scanner. */
const leaveTo = dest => dest === 'guest' ? T('to') + ' ' + (inspTo() || T('the guest')) : T('in the apartment');
const andList = ids => ids.length < 2 ? ids.join('') : ids.slice(0, -1).join(', ') + ' ' + T('and') + ' ' + ids[ids.length - 1];
const inspReason = s => ({ 'Upplåsning':'Shortstay', 'Inflytt':'Inflytt', 'Utflytt':'Utflytt' }[s.type] || '');
let leaving = false;
async function leavePlanned(){
  if(leaving || !S || !canHandover() || S.signedAt || S.closedAt || keyModeOf() === 'pick') return;
  const insp = S, ids = planPending(S), dest = keyModeOf();
  if(!ids.length) return;
  leaving = true; paintInspKeyCard();
  try{
    const name = await koName(); if(!name) return;
    const read = await Promise.all(ids.map(id => fetchLast(id)));
    const c = inspApt(), made = [], drop = [], said = [];
    for(const [i, id] of ids.entries()){
      const b = bundleOf(id), k = b ? mvKind(id) : '';
      const why = !b ? 'not in the register' : b.off ? 'Archived' : k === 'lost' ? 'reported lost'
        : k === dest ? (dest === 'apt' ? 'already in the apartment' : 'already with the guest') : '';
      if(why){ drop.push([id, why]); said.push(id + ': ' + T(why)); continue }
      if(!read[i] && !keySeenAt && !bstate(id).ev){ said.push(id + ': ' + T('could not be read')); continue }
      const ev = await keyWrite(id, 'place', Object.assign({ who:name, loc:dest, apt: c.apt || objOf(id), place: c.place || bundleApt(b),
        reason: inspReason(insp), from: fromOf(bstate(id), name) }, dest === 'guest' ? { guest: inspTo() } : {}));
      if(ev) made.push([id, ev]); else said.push(id + ': ' + T('Could not save'));
    }
    for(const [id, ev] of made){
      insp.keysOut = (insp.keysOut || []).filter(r => r.bundle !== id);
      insp.keysOut.push({ bundle:id, name:ev.name||'', place:ev.place||'', guest:ev.guest||'', act:dest, ts:ev.ts, who:ev.who||'', evId:ev.id,
                          photos:[], keys:bundleOf(id).k.filter(keyOn).map(r => [r[0]||'', r[1]||'', r[2]||1]) });
      insp.log.push({ ts:Date.now(), txt:`Key ${id}: ${dest === 'guest' ? 'left with ' + (ev.guest || 'the guest') : 'left in the apartment'} by ${ev.who}` });
    }
    if(drop.length){
      insp.keysPlan = (insp.keysPlan || []).filter(id => !drop.some(([d]) => d === id));
      insp.log.push({ ts:Date.now(), txt:`Keys not left by this inspection: ${drop.map(([id, why]) => id + ' (' + why + ')').join(', ')}` });
    }
    // Saved into this inspection even if another one was opened meanwhile.
    const prev = S; S = insp;
    try{ await flushSave() }finally{ if(S === insp) S = prev }
    toast([made.length ? `✓ ${andList(made.map(([id]) => id))} ${leaveTo(dest)}` : '', ...said].filter(Boolean).join(' · '));
  }finally{ leaving = false; paintInspKeyCard() }
}

// What the sheet had before it had a choice; kept for anything that calls them.

const keyOffCount = ks => (ks||[]).filter(k => !keyOn(k)).reduce((n, k) => n + (Number(k[2]) || 1), 0);
// The sheet: the bundle, where it is, the move, its keys and its history.

          <span class="knum">${k.off ? '–' : ++n}</span>
          <span class="kt">
            <b>${esc(k.t)}</b>
            ${k.m? `<span>${esc(k.m)}</span>` : '<span>—</span>'}
            ${k.note? `<span>${esc(k.note)}</span>` : ''}
          </span>

      ${(()=>{ const ev = eventsFor(id);

          ${histOpen? `<div class="card" style="margin-top:8px">${ev.slice(0,20).map(e=>
            `<div class="logline"><b>${stamp(new Date(e.ts))}</b><span>${esc(evSentence(e))}${queuedSuffix(e)}</span></div>`).join('')}</div>` : ''}`;
      })()}
    </div>
    <div class="sheetbar">
      <button class="btn ghost" onclick="closeBundle()">${T('Close')}</button>
      ${kf.dest && !b.off ? `<button class="btn" onclick="bundleAct('${id}')"${koBusy ? ' disabled' : ''}>${koBusy ? T('Saving…') : T('Confirm')}</button>` : ''}
    </div>`;
  if(focused && /^(kf_|koreason)/.test(focused)){
    const fe = document.getElementById(focused);
    if(fe){ try{ fe.focus(); if(caret != null) fe.setSelectionRange(caret, caret) }catch(e){} }
  }

/* ----- keys in an inspection (2026-10-14) -----
   What this inspection does with keys - in the apartment (shortstay), to the guest (move-in),
   pick up (move-out) - and the one scanner with the photo step, opened from the key box. Each confirmed move goes on the report's key receipt with its keys as they
   were, what was done, by whom and when, and the photos taken with it. */
const HANDOVER_TYPES = ['Upplåsning','Inflytt','Utflytt'];
const canHandover = () => !!S && HANDOVER_TYPES.includes(S.type);
// Shortstay unlock: always in the apartment (Erik, 2026-10-21). A move-in: to the guest, unless an
// older inspection chose otherwise. A single bundle can still go elsewhere in the scanner.
const keyModeOf = () => !S ? 'apt' : S.type === 'Utflytt' ? 'pick' : S.type === 'Upplåsning' ? 'apt'
  : (S.keyMode === 'apt' || S.keyMode === 'guest') ? S.keyMode : S.type === 'Inflytt' ? 'guest' : 'apt';
// The inspection's apartment as the register knows it, when it does: "lgh 1102 TÄRNA" and
// the object number 112. An apartment the register has not got yet is named by what the
// inspection says, address included.
const squash = s => String(s||'').toLowerCase().replace(/[\s,.\-]/g,'');
function inspApt(){
  const addr = squash(S.address), apt = squash(S.apt);
  const b = addr && apt ? regAll().find(b => !b.off && squash(b.a) === addr && squash(b.l) === apt) : null;
  if(b) return { apt: String(b.id).split(':')[0], place: 'lgh ' + b.l + (b.n ? ' ' + b.n : ''), known: true };
  const place = [S.address, S.apt ? 'lgh ' + S.apt : ''].filter(Boolean).join(', ').trim();
  return { apt: '', place, known: false };
}
const inspTo = () => S.keyTo || ((S.counter && S.counter.name) || '');
const hoDest = () => { if(!S) return ''; const m = keyModeOf(), c = inspApt();
  return m === 'pick' ? T('Picked up by you') : m === 'guest' ? [inspTo() || T('the guest'), c.place].filter(Boolean).join(' · ') : [T('In the apartment'), c.place].filter(Boolean).join(' · ') };
const actOf = k => k.act === 'pickup' ? T('picked up') : k.act === 'guest' ? T('to') + ' ' + (k.guest || T('the guest'))
  : k.act === 'apt' ? T('in the apartment') : '';

// The key box (2026-10-21): what is done (✓); the keys on the inspection's list - checked out for it,
// or scanned in here - as one button, "Jag har lämnat 115:2 och 115:3 i lägenheten", one tap and done
// (leavePlanned); and a small Scan in keys, which puts more on the list (scanToList). The photo of the
// keys is the key photo row's, as for any other row.
function inspKeyCard(){
  if(!canHandover()) return '';
  const mode = keyModeOf(), locked = !!(S.signedAt || S.closedAt);
  const done = (S.keysOut || []).filter(k => k.bundle);
  const plan = locked || mode === 'pick' ? [] : planPending(S);
  return `<div class="kcard inspkeys" id="inspkeys">
    ${done.map(k => `<div class="hoconf" style="margin:0 0 8px"><span class="hocheck">✓</span><div style="flex:1;min-width:0">
        <b>${esc(k.bundle)}${k.name ? ' · ' + esc(k.name) : ''}</b>
        <div>${esc(actOf(k))}${actOf(k) ? ' · ' : ''}${(k.keys||[]).reduce((n, x) => n + (x[2] || 1), 0)} ${T('keys')}${(k.photos||[]).length ? ' · ' + k.photos.length + ' ' + T(k.photos.length === 1 ? 'photo' : 'photos') : ''} · ${stamp(new Date(k.ts))}</div></div></div>`).join('')}
    ${plan.length ? `<button class="kbleave" id="kbleave" onclick="leavePlanned()"${leaving ? ' disabled' : ''}>${leaving ? T('Saving…') : esc(T('I have left') + ' ' + andList(plan) + ' ' + leaveTo(mode))}</button>` : ''}
    <button class="btn ghost small" id="kbscan" onclick="inspScan()">${T('Scan in keys')}</button>
  </div>`;
}
// Repaint the card in place - never the whole view, which would wipe a comment mid-typing.
function paintInspKeyCard(){
  const el = document.getElementById('inspkeys'); if(!el || !S) return;
  el.outerHTML = inspKeyCard();
}
// Fetch the register and the shared state behind the card, then repaint it once.
