/* ---------- Key bundles ----------
   A tag carries the bundle number - "112:3" - either bare or as the link
   https://beaps.se/#nyckel=112:3, and nothing else. Scanning one, or typing the
   number, opens the ring, shows the keys that belong on it, and takes it out of or back
   into the cabinet. The register lives in nycklar.js and is fetched the first time it is
   needed.

   The log is shared. Every check-out and check-in goes to /api/keys-event and comes back
   to every phone from /api/keys-log. Where a bundle is right now is never stored as such:
   it is the last event for that bundle, whoever wrote it, worked out afresh on every sync.
   What has not reached the server yet waits in a queue on this phone and is shown as
   waiting wherever the bundle appears. */
const KEYNAME = 'bp:keyname';   // the name that goes on every line of the log
const KEYEV   = 'bp:keyev';     // the recent log as last seen from the server, plus ours
const KEYBASE = 'bp:keybase';   // the server's last event per bundle - reaches further back than KEYEV
const KEYQ    = 'bp:keyq';      // events written here that have not reached the server yet
const KEYSEEN = 'bp:keyseen';   // when the log was last fetched successfully, 0 = never
const KEYINI  = 'bp:keyini';    // your own initials, when the two letters from your name are wrong
let keyState = null, keyMe = '', keyIni = '', keyEvents = null, keyBase = null, keyQueue = null;
let keySeenAt = 0, keyFailAt = 0, keySyncP = null;

function loadScript(src, ready){
  if(ready()) return Promise.resolve(true);
  return new Promise(res=>{
    let done = false;
    const finish = ok => { if(!done){ done = true; res(ok) } };
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>finish(ready()); s.onerror = ()=>finish(false);
    setTimeout(()=>finish(false), 15000);
    document.head.appendChild(s);
  });
}
// Both files are served from our own origin. A key cabinet is usually in a basement,
// and a script from a CDN is exactly what does not arrive down there.
const loadJsQR    = () => loadScript('jsqr.js', ()=>typeof jsQR==='function');
const loadNycklar = () => loadScript('nycklar.js', ()=>Array.isArray(window.NYCKLAR));

// Reads what is already on the phone. No network, no register - safe to call on every
// start screen paint.
let keyLocalP = null;
function keyLocal(){
  if(keyState) return Promise.resolve();
  if(keyLocalP) return keyLocalP;    // two early callers share one read, so neither can
  keyLocalP = (async()=>{            // overwrite the other's fresher state with a stale copy
    await store.del('bp:keys');      // tidy: the old projection is not kept any more
    keyMe     = (await store.get(KEYNAME))  || '';
    keyIni    = (await store.get(KEYINI))   || '';
    keyEvents = (await store.get(KEYEV))    || [];
    keyBase   = (await store.get(KEYBASE))  || [];
    keyQueue  = (await store.get(KEYQ))     || [];
    keySeenAt = (await store.get(KEYSEEN))  || 0;
    applyEvents();
  })();
  return keyLocalP;
}
// The full thing: local state plus the register behind the tags.
async function keyBoot(){ await keyLocal(); await loadNycklar() }

const bundleOf = id => (window.NYCKLAR||[]).find(b=>b.id===id);
// Read-only: a bundle with no event of its own is simply in the cabinet.
function bstate(id){
  return keyState[id] || {status:'in', holder:null, reason:'', since:null, ev:null};
}
const eventsFor = id => (keyEvents||[]).filter(e=>e.bundle===id);
const outNow = () => Object.keys(keyState||{})
  .filter(id=>keyState[id].status==='out')
  .sort((a,b)=>(keyState[b].since||0) - (keyState[a].since||0));
// Left in an apartment or with a guest - nobody is carrying these.
const placedNow = () => Object.keys(keyState||{})
  .filter(id=>keyState[id].status==='placed')
  .sort((a,b)=>(keyState[b].since||0) - (keyState[a].since||0));
const isQueued = ev => !!ev && (keyQueue||[]).some(q => q.id === ev.id);

/* Where a bundle is, is not stored - it is worked out from the log. The last event for a
   bundle wins, whoever wrote it, so two phones that were both offline end up agreeing as
   soon as they have both synced. keyBase reaches further back than the 400-event tail
   kept in keyEvents, so a bundle checked out long ago and never checked back in still
   shows as out even once its own check-out has scrolled off that tail.

   Two events in the same millisecond are settled by id, which is the order KV lists
   them in - so every phone and the server land on the same answer instead of each
   picking whichever it happened to read last. */
const later = (a, b) => a.ts > b.ts || (a.ts === b.ts && String(a.id) > String(b.id));
// A bundle number is 112:3 or 112:EXTRA - the server refuses anything else, and so does
// this, because the number is written straight into the page as text and as an id.
const okBundle = id => typeof id === 'string' && /^[A-Za-z0-9:_-]{1,32}$/.test(id);
function applyEvents(){
  const last = {};
  for(const e of (keyBase||[]).concat(keyEvents||[])){
    if(!e || !okBundle(e.bundle)) continue;
    if(!last[e.bundle] || later(e, last[e.bundle])) last[e.bundle] = e;
  }
  const next = {};
  Object.keys(last).forEach(id=>{
    const e = last[id];
    // out: someone is carrying it. placed: it was left in an apartment or with a guest and
    // nobody is carrying it. Anything else - a check-in - is the cabinet. One status per
    // bundle, read from one event, so it can never be in two places at once.
    next[id] = e.kind === 'out'   ? { status:'out', holder:e.who, reason:e.reason||'', since:e.ts, ev:e }
             : e.kind === 'place' ? { status:'placed', holder:null, reason:'', since:e.ts, place:e.place||'', guest:e.guest||'', apt:e.apt||'', by:e.who, ev:e }
             :                      { status:'in', holder:null, reason:'', since:null, ev:e };
  });
  keyState = next;
}
async function keyRemember(){
  const a = await store.set(KEYEV, (keyEvents||[]).slice(0, 400));
  await store.set(KEYBASE, keyBase||[]);
  const q = await store.set(KEYQ, keyQueue||[]);
  await store.set(KEYSEEN, keySeenAt);
  return a && q;     // the two that carry an event just written
}
// Send whatever has not reached the server. Anything that fails stays queued. A write and
// the sync right behind it both ask for a flush; the second waits for the first and then
// sends only what is still left, rather than posting the same event twice.
let keyFlushP = null;
function keyFlush(){
  if(!keyQueue || !keyQueue.length) return Promise.resolve(true);
  if(keyFlushP) return keyFlushP.then(()=>keyFlush());
  keyFlushP = (async()=>{
    try{
      const batch = keyQueue.slice(0,50);
      const r = await fetch('/api/keys-event', {
        method:'POST',
        headers:{...AUTH, 'Content-Type':'application/json'},
        body: JSON.stringify({events: batch})
      });
      if(!r.ok) return false;
      const sent = new Set(batch.map(e=>e.id));
      keyQueue = keyQueue.filter(e=>!sent.has(e.id));
      await store.set(KEYQ, keyQueue);
      return true;
    }catch(e){ return false }
    finally{ keyFlushP = null }
  })();
  return keyFlushP;
}
// What every screen paints from - anything not in here cannot possibly need a repaint.
const keySig = () => JSON.stringify([
  (keyEvents||[]).map(e=>e.id), (keyQueue||[]).map(e=>e.id), !!keySeenAt, keyFailAt >= keySeenAt,
  Object.keys(keyState||{}).sort().map(id=>{ const s = keyState[id]; return [id, s.status, s.since] })
]);
// Pull everyone's events down and fold ours in. Returns true when something a screen
// paints from actually changed - a fetch that failed counts, since the screens say so.
// A caller that arrives mid-sync gets that same result instead of a bare `false` that
// would look like nothing had moved.
function keySync(force){
  if(keySyncP) return keySyncP;
  if(!force && Date.now() - keySeenAt < 20000) return Promise.resolve(false);
  keySyncP = (async()=>{
    let before = '';
    try{
      await keyLocal();
      before = keySig();
      await keyFlush();
      const r = await fetch('/api/keys-log', {headers:AUTH});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if(Array.isArray(j.events)){
        const seen = new Set(j.events.map(e=>e.id));
        const queued = new Set((keyQueue||[]).map(e=>e.id));
        // Keep what the server has not shown us yet: anything still unsent, and anything
        // we sent in the last two minutes. KV takes a few seconds to list a fresh entry,
        // and without this an event we had just written would vanish from our own screen
        // until the next sync, taking the bundle's status with it.
        const fresh = Date.now() - 120000;
        const ours = keyEvents.filter(e => !seen.has(e.id) && (queued.has(e.id) || e.ts > fresh));
        keyEvents = j.events.concat(ours).sort((a,b)=>b.ts-a.ts);
        if(Array.isArray(j.state)) keyBase = j.state;
        keySeenAt = Date.now();
        applyEvents();
        await keyRemember();
      }
    }catch(e){ keyFailAt = Date.now() }
    keySyncP = null;
    return before !== keySig();
  })();
  return keySyncP;
}
// Write one event: visible here at once, on its way to everyone else. The person just
// acted, so the event must sort after the one that decides this bundle's status now -
// even when that one came from a phone whose clock runs ahead, or this one's runs
// behind - which is what the max() guarantees. Only this bundle's event is looked at,
// so one bad clock cannot drag every later timestamp in the log along with it.
async function keyWrite(bundle, kind, extra){
  const b = bundleOf(bundle), cur = bstate(bundle).ev;
  const ev = Object.assign({
    id: uid(), bundle, kind, ts: Math.max(Date.now(), cur ? (cur.ts||0) + 1 : 0),
    who: keyMe, reason: '', name: b? (b.n || 'lgh ' + b.l) : ''
  }, extra || {});
  keyEvents.unshift(ev);
  keyQueue.push(ev);
  applyEvents();
  if(!await keyRemember()){
    // The phone could not keep it. Take it back out, so no screen shows a move that
    // exists nowhere, and tell the caller: nothing has changed.
    keyEvents = keyEvents.filter(e=>e.id!==ev.id); keyQueue = keyQueue.filter(e=>e.id!==ev.id);
    applyEvents(); await keyRemember();
    return null;
  }
  // Not awaited: the screen must not wait for the network. Once it has gone, whatever
  // screen says "waiting to sync" needs to stop saying so.
  keyFlush().then(ok=>{ if(ok) refreshKeyViews(true) });
  return ev;
}

// A name shrunk to the two letters that fit in a circle: "Erik Gardbring" -> EG. The full
// name is still on the event, and sits in the title attribute wherever these are shown.
function initials(name){
  const w = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length) return '–';
  return (w.length > 1 ? w[0][0] + w[w.length-1][0] : w[0].slice(0,2)).toUpperCase();
}
// Two letters taken off a name are a guess, and it is wrong often enough - a double surname,
// a middle name, a name the guess simply gets backwards. So your own are yours to set, saved
// on this phone beside your name, and used wherever your own line shows up. Everyone else's
// are still worked out from what they wrote, since this phone has nothing else to go on.
const cleanIni = s => String(s||'').replace(/\s/g,'').slice(0,3).toUpperCase();
const iniOf = name => (keyIni && name && name === keyMe) ? keyIni : initials(name);
const myIni = () => keyIni || initials(keyMe);
// What happened, in as few words as it takes. Who did it is shown as initials beside the
// line, not spelled out inside it.
function evLine(e){
  // The apartment and the person it went to both stay - that pair is the whole point of a
  // hand-over. Where it came from is on the event and in the bundle's history; it is not
  // repeated here.
  if(e.kind === 'place'){
    if(e.place) return `${T('Left in')} ${e.place}${e.guest? ' · ' + e.guest : ''}`;
    // An inspection with no address yet still logs the hand-over; the bundle number already
    // says which apartment the keys belong to.
    return e.guest ? `${T('Left to')} ${e.guest}` : T('Left');
  }
  return e.kind === 'out'
    ? `${T('Out')}${e.reason? ' · ' + e.reason : ''}`
    : T('In the cabinet');
}
// Where a placed bundle is: the apartment, the guest, or both.
const placeLabel = s => [s.place, s.guest].filter(Boolean).join(' · ');
// Whoever last touched a bundle - the one carrying it, or the one who left it somewhere.
const whoOf = s => s.status === 'out' ? (s.holder||'') : (s.by||'');
// A queued line has not reached anyone else's phone yet - flag it wherever it shows up.
const queuedSuffix = ev => isQueued(ev)? ' · ' + T('waiting') : '';
// Only says something when the shared state is not fresh, so a stale read never looks as
// certain as a live one. Silent the rest of the time.
function syncHint(){
  if(!keySeenAt) return T('Not fetched yet');
  if(keyFailAt >= keySeenAt) return T('No contact — showing') + ' ' + stamp(new Date(keySeenAt));
  return '';
}
// After a sync that changed something, repaint whichever key screen is showing.
function refreshKeyViews(moved){
  if(!moved) return;
  if(document.getElementById('handover')) return paintHandover();
  const bundleEl = document.getElementById('bundle');
  if(bundleEl) return paintBundle(bundleEl.dataset.bundle);
  const logEl = document.getElementById('keylog');
  if(logEl) return logEl.innerHTML = keyLogHtml();
  if(document.getElementById('inspkeys')) return paintInspKeyCard();   // in place: a comment mid-typing must survive
  if(view==='start') renderStart();
}
// A queued event must not wait for the next visit to the start screen to be sent: catch
// it the moment connectivity, or the tab itself, comes back.
window.addEventListener('online', ()=>{ keySync(true).then(refreshKeyViews) });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') keySync().then(refreshKeyViews) });

async function openMenu(){

  const el = document.createElement('div');
  el.className = 'menu'; el.id = 'menu';
  el.addEventListener('click', e=>{ if(e.target === el) closeMenu() });
  el.innerHTML = `<div class="panel">

// Initials follow the name unless you have written your own. The field is read against both
// the old name and the new one: a field still holding the letters the previous name gave
// counts as untouched and follows the new name, and only something neither name would have
// produced is kept as yours. Without that, changing the name alone would freeze the old
// initials in place as if they had been typed.
async function saveMenuName(){
  const n = document.getElementById('menuname'), g = document.getElementById('menuini');
  const forra = keyMe;
  const name = (n ? n.value : keyMe).trim();
  if(name !== keyMe){ keyMe = name; await store.set(KEYNAME, name) }
  const typed = g ? cleanIni(g.value) : '';
  const eget = (typed && typed !== initials(name) && typed !== initials(forra)) ? typed : '';
  if(eget !== keyIni){ keyIni = eget; await store.set(KEYINI, eget) }
  if(g) g.value = myIni();
  if(view === 'start') renderStart();
  const card = document.getElementById('inspkeys'); if(card) paintInspKeyCard();

/* ----- the shared log ----- */
// A small card on the start screen, painted from what is already on the phone so it costs
// no waiting. The sync behind it refreshes it a moment later if anything moved.
// Only what this person is carrying, and only the numbers. Who has the rest is in the log.
const myKeys = () => outNow().filter(id => (keyState[id].holder||'') === keyMe && keyMe);
// What you are carrying, and nothing else. How many keys the whole company has out is a
// question for the log, which lives in the menu.

            `<button class="knum-chip" onclick="showBundle('${id}')">${esc(id)}</button>`).join('')}</div>`
        : `<span class="hint" style="margin:0">${T('None with you')}</span>`}
    </div>
    ${waiting? `<div class="kwait" style="margin-top:10px">${waiting} ${T('waiting')}</div>` : ''}
  </div>`;
}
/* The log has an address of its own: #nyckellogg. Opening the app with it lands here
   straight away, and the hash follows the sheet - set while it is open, cleared when it
   closes - so a reload comes back to the same place. It is a shortcut into the app, not
   around it: the log is still fetched through the same guarded endpoint as everything
   else, and any access check the app gets later runs at boot, before this is looked at. */
const LOG_HASH = '#nyckellogg';
const logLink = () => location.origin + location.pathname + LOG_HASH;
async function openKeyLog(){
  if(document.getElementById('keylog')) return;
  await keyBoot();
  const done = keySync(true);        // started before the first paint, so it can say "updating"
  const el = document.createElement('div');
  el.className = 'sheet ksheet'; el.id = 'keylog';
  el.innerHTML = keyLogHtml();
  document.body.appendChild(el);
  window.scrollTo(0,0);
  if(location.hash !== LOG_HASH) try{ history.replaceState(null, '', logLink()) }catch(e){}
  // Repaint once the server has answered either way - the "updating" line must go, and
  // a failed fetch changes the hint.
  done.then(()=>{ const s = document.getElementById('keylog'); if(s) s.innerHTML = keyLogHtml() });
}
function closeKeyLog(){
  const el = document.getElementById('keylog'); if(el) el.remove();
  if(location.hash === LOG_HASH) try{ history.replaceState(null, '', location.pathname + location.search) }catch(e){}
  render();                        // back to whatever was underneath, normally the start screen
}
// Only from the start screen: an inspection in progress is never covered by the log.
window.addEventListener('hashchange', ()=>{ if(location.hash === LOG_HASH && view==='start') openKeyLog() });
async function copyLogLink(){
  const url = logLink();
  try{ await navigator.clipboard.writeText(url); toast(T('Link copied')) }
  catch(e){ prompt(T('Copy the link:'), url) }   // same fallback as the other links
}
/* One list: every bundle that is not in the cabinet, whoever has it and wherever it is.
   The person is the circle of initials on the left - a full name on every row was the bulk
   of the text on this screen, and the number is what anyone is actually looking for. The
   name is still there on a press, and spelled out on the bundle itself. */
function keyLogHtml(){
  const rows = outNow().concat(placedNow()).sort((a,b)=>(keyState[b].since||0) - (keyState[a].since||0));
  const q = (keyQueue||[]).length, hint = syncHint();
  return topbar(T('Key log'), keySyncP? T('Updating…') : rows.length + ' ' + T('out'), null, "closeKeyLog()") + `
    <div class="wrap">
      ${hint? `<div class="hint" style="margin:0 3px 10px">${hint}</div>` : ''}
      ${q? `<div class="kwait" style="margin:0 3px 10px">${q} ${T('waiting')}</div>` : ''}
      ${rows.length? rows.map(id=>{ const s = keyState[id], who = whoOf(s); return `
        <button class="list-item" onclick="closeKeyLog();showBundle('${id}')">
          <span class="kini" title="${esc(who)}">${esc(iniOf(who))}</span>
          <span style="min-width:0"><b>${esc(id)}${s.ev && s.ev.name? ' · '+esc(s.ev.name):''}</b>
            <div class="klsub">${s.status==='placed'? esc(placeLabel(s)) + ' · ' : ''}${stamp(new Date(s.since))}${queuedSuffix(s.ev)}</div></span>
          <span class="chev">›</span>
        </button>`}).join('')
        : `<div class="card"><span class="hint" style="margin:0">${T('All keys are in the cabinet')}</span></div>`}

      <div class="csec"><span>${T('Latest')}</span><button class="addc" onclick="copyLogLink()">${T('Copy link')}</button></div>
      <div class="card">
        ${(keyEvents||[]).slice(0,40).map(e=>`<div class="logline">
          <b>${stamp(new Date(e.ts))}</b>
          <span><b>${esc(e.bundle)}</b> ${esc(evLine(e))} · <span title="${esc(e.who)}">${esc(iniOf(e.who))}</span>${queuedSuffix(e)}</span>
        </div>`).join('') || `<span class="hint" style="margin:0">${T('Nothing here yet')}</span>`}
      </div>
    </div>`;
}

/* ----- the scanner ----- */
let scanRaf = 0, scanStream = null, scanOn = false;
const scanCv = document.createElement('canvas');
const scanCtx = scanCv.getContext('2d', {willReadFrequently:true});

// The same scanner and the same tag for both jobs: opened bare it shows the bundle behind
// the tag; opened with 'hand' it reads the tag for a hand-over already set up (see ho).
let scanMode = 'open';
async function openScan(mode){
  await keyBoot();
  keySync().then(refreshKeyViews);   // not awaited: the tag may be read before this lands
  closeScan();            // same again: one scanner at a time, camera released first
  scanMode = mode === 'hand' && ho ? 'hand' : 'open';
  const hand = scanMode === 'hand';
  const el = document.createElement('div');
  el.className = 'cam'; el.id = 'scan';
  el.innerHTML = `
    <div class="camtop">
      <span style="font-weight:600">${hand? T('Scan the key') : T('Scan QR code')}</span>
      <button onclick="closeScan()" style="font-size:15px">${T('Close')}</button>
    </div>
    <div class="view">
      <video id="scanview" playsinline muted autoplay></video>
      <div class="scanbox" id="scanbox"><i></i></div>
    </div>
    <div class="scanfoot">
      ${hand? `<div class="dest">→ ${esc(hoDest())}</div>` : ''}
      <div class="msg" id="scanmsg">${T('Starting the camera…')}</div>
      <input id="scanman" placeholder="112:3"
             autocapitalize="characters" autocomplete="off" spellcheck="false">
      <button class="btn ghost" onclick="scanManual()">${hand? T('Leave') : T('Open')}</button>
    </div>`;
  document.body.appendChild(el);
  document.getElementById('scanman').addEventListener('keydown', e=>{ if(e.key==='Enter') scanManual() });

  if(!await loadJsQR()) return scanMsg(T('Scanner unavailable — type the number'), true);

  // Where the browser has a barcode reader of its own it is faster and steadier than
  // anything we can do in JavaScript. Chrome on Android has one; Safari does not, which
  // is why jsQR is loaded above either way.
  scanNative = null;
  try{
    if(window.BarcodeDetector){
      const kinds = await BarcodeDetector.getSupportedFormats();
      if(kinds.includes('qr_code')) scanNative = new BarcodeDetector({formats:['qr_code']});
    }
  }catch(e){}

  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('no api'), {name:'NoApi'});
    // Ask for more pixels than the screen needs. A 23 mm code at arm's length is only a
    // few hundred pixels wide, and the decoder wants every one of them.
    scanStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    });
  }catch(e){
    return scanMsg(camReason(e), true);
  }
  // Keep the lens hunting for focus rather than locking on the background.
  try{
    const track = scanStream.getVideoTracks()[0];
    const able = track.getCapabilities ? track.getCapabilities() : {};
    if(able.focusMode && able.focusMode.includes('continuous')){
      await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    }
  }catch(e){}

  const v = document.getElementById('scanview');
  if(!v) return;
  v.srcObject = scanStream;
  try{ await v.play() }catch(e){}
  scanMsg(T('Hold the tag in the frame'));
  scanOn = true; scanSince = Date.now(); scanTick();
}
function scanMsg(txt, hideBox){
  const m = document.getElementById('scanmsg'); if(m) m.textContent = txt;
  if(hideBox){ const b = document.getElementById('scanbox'); if(b) b.classList.add('hidden') }
}
// A 23 mm code held at arm's length covers a small part of the frame, so scaling the
// whole picture down throws away the very pixels the decoder needs. Read the middle of
// the frame - what sits inside the yellow square - at close to full resolution instead,
// and only occasionally sweep the whole frame for a tag held off to one side.
let scanN = 0, scanSince = 0, scanNative = null, scanBusy = false;
// Each pass looks at a different slice: the middle of the frame at full resolution for a
// code held close, a wider square, then the whole picture for one held off to the side.
// Cycling beats picking one, because we cannot know how the tag is being held.
const SLICES = [0.55, 0.8, 1];
function readFrame(v, part, invert){
  const vw = v.videoWidth, vh = v.videoHeight;
  const side = Math.round(Math.min(vw, vh) * part);
  const sx = Math.round((vw - side) / 2), sy = Math.round((vh - side) / 2);
  const f = Math.min(1, 1100 / side);
  scanCv.width = Math.round(side * f); scanCv.height = Math.round(side * f);
  scanCtx.drawImage(v, sx, sy, side, side, 0, 0, scanCv.width, scanCv.height);
  try{
    const img = scanCtx.getImageData(0, 0, scanCv.width, scanCv.height);
    return jsQR(img.data, img.width, img.height,
                {inversionAttempts: invert ? 'attemptBoth' : 'dontInvert'});
  }catch(e){ return null }
}
async function scanTick(){
  if(!scanOn) return;
  const v = document.getElementById('scanview');
  if(v && v.readyState >= 2 && v.videoWidth && !scanBusy){
    scanBusy = true;
    try{
      if(scanNative){
        const found = await scanNative.detect(v);
        if(found && found.length && found[0].rawValue){ scanBusy = false; return gotCode(found[0].rawValue) }
      }
      scanN++;
      const part = SLICES[scanN % SLICES.length];
      const hit = readFrame(v, part, scanN % 6 === 0);
      if(hit && hit.data){ scanBusy = false; return gotCode(hit.data) }
    }catch(e){}
    scanBusy = false;
    // Say something useful if it has been staring at nothing for a while.
    if(Date.now() - scanSince > 6000){
      scanSince = Date.now() + 6000;
      scanMsg(T('Fill the frame and hold still'));
    }
  }
  scanRaf = requestAnimationFrame(scanTick);
}
/* The moment a code is read: a short buzz, the frame goes green, and a click.
   navigator.vibrate is Android only - iOS has no vibration API on the web at all -
   so the flash and the click are what an iPhone actually gives you. */
function scanFeedback(){
  try{ navigator.vibrate && navigator.vibrate(30) }catch(e){}
  const box = document.getElementById('scanbox');
  if(box){ box.classList.add('hit'); setTimeout(()=>box.classList.remove('hit'), 220) }
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ac = new Ctx(), o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 1720;
    g.gain.setValueAtTime(.055, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .09);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + .1);
    setTimeout(()=>{ try{ ac.close() }catch(e){} }, 400);
  }catch(e){}
}
function scanManual(){
  const el = document.getElementById('scanman');
  if(el && el.value.trim()) gotCode(el.value.trim());
}
/* A tag holds "112:3" or "112:EXTRA" - or, on newer tags, a link the phone's own camera
   can open: https://beaps.se/#nyckel=112:3. Out in the world that link lands on the
   website, which says nothing about keys; in here it is just another way of writing
   the number. Only that exact shape counts - https, beaps.se, the number after
   #nyckel= - and the link is never opened or followed, only read. Anything else is
   somebody else's QR code. */
function tagNumber(raw){
  const s = String(raw).trim();
  if(!/^https?:\/\//i.test(s)) return s;
  try{
    const u = new URL(s), host = u.hostname.toLowerCase();
    if(u.protocol !== 'https:' || (host !== 'beaps.se' && host !== 'www.beaps.se')) return '';
    if(u.pathname !== '/' && u.pathname !== '') return '';
    const m = /^#nyckel=([^&]+)$/i.exec(u.hash);
    return m ? decodeURIComponent(m[1]) : '';
  }catch(e){ return '' }
}
function gotCode(raw){
  const id = tagNumber(raw).toUpperCase().replace(/\s+/g,'');
  const b = bundleOf(id);
  if(!b){
    // It read something, so say what. A tag from the old test sheet, or a number that is
    // simply not in the register yet, look identical from the outside otherwise.
    scanFeedback();
    scanMsg(/^\d+:(\d+|EXTRA)$/.test(id)
      ? `${id} — ${T('not in the register')}`
      : T('Not a key tag'));
    scanSince = Date.now() + 4000;
    if(scanOn) scanRaf = requestAnimationFrame(scanTick);   // a stray QR must not end the scan
    return;
  }
  scanFeedback();
  const hand = scanMode === 'hand';
  closeScan();
  if(hand) return hoGot(id);
  showBundle(id);
}
function closeScan(){
  scanOn = false; scanMode = 'open'; cancelAnimationFrame(scanRaf);
  if(scanStream){ scanStream.getTracks().forEach(t=>{ try{ t.stop() }catch(e){} }); scanStream = null }
  const el = document.getElementById('scan'); if(el) el.remove();
}

/* ----- the bundle behind the tag ----- */
function showBundle(id){
  const b = bundleOf(id);
  if(!b) return;
  closeBundle();          // never stack two bundle sheets on top of each other
  const el = document.createElement('div');
  el.className = 'sheet hasbar ksheet'; el.id = 'bundle'; el.dataset.bundle = id;
  document.body.appendChild(el);
  paintBundle(id);
  window.scrollTo(0,0);
  // Ask the server what everyone else has done with this ring, then repaint either way -
  // a failed fetch changes the hint too.
  keySync(true).then(()=>{ const s = document.getElementById('bundle'); if(s && s.dataset.bundle===id) paintBundle(id) });
}
function closeBundle(){ const el = document.getElementById('bundle'); if(el) el.remove() }
let histOpen = false;
function toggleHist(){ histOpen = !histOpen; const el = document.getElementById('bundle'); if(el) paintBundle(el.dataset.bundle) }

// After checking a bundle in or out, land on the start screen, where the Keys card now
// shows the result. (It briefly reopened the scanner instead; Erik preferred this.)
async function backToStart(){ closeBundle(); closeScan(); if(view==='start') await renderStart() }

// Renders the sheet in place, so a sync landing mid-visit (or a toggled chip, or the name
// field opening) never has to tear the sheet down and rebuild it from nothing.
function paintBundle(id){
  const el = document.getElementById('bundle');
  if(!el) return;
  const b = bundleOf(id), s = bstate(id);
  const out = s.status === 'out', placed = s.status === 'placed';
  const keys = b.k.map(k=>({t:k[0], m:k[1]||'', q:k[2]||1, note:k[3]||''}));
  const total = keys.reduce((n,k)=>n+k.q, 0);

  // A repaint can land mid-keystroke - the sheet syncs the moment it opens, and that
  // sync can land while someone is already typing - so keep whatever is in the two
  // fields rather than wiping it out from under them, and put the caret back where it was.
  const nameEl = document.getElementById('koname'), reasonEl = document.getElementById('koreason');
  const iniEl = document.getElementById('koini');
  const keepName = nameEl? nameEl.value : '', keepReason = reasonEl? reasonEl.value : '';
  const keepIni = iniEl? iniEl.value : '';
  const focused = document.activeElement && document.activeElement.id;
  const caret = focused ? document.activeElement.selectionStart : null;
  const hint = syncHint();

  el.innerHTML = topbar(T('Key bundle'), '', null, "closeBundle()") + `
    <div class="wrap">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <div class="bhead">
            <span class="bnum">${esc(b.id)}</span>
            ${b.n? `<span class="bname">${esc(b.n)}</span>` : ''}
            <span class="baddr">${esc(b.a)} · lgh ${esc(b.l)}</span>
          </div>
          <span class="kstat ${!keySeenAt? 'unk' : (out?'out': placed?'pl':'in')}" style="margin-top:2px">${!keySeenAt? T('Not fetched yet') : (out? T('Out') : placed? T('In apartment') : T('In the cabinet'))}</span>
        </div>
        ${out? `<div class="hint" style="margin-top:10px"><b>${esc(s.holder||'')}</b> ·
          ${stamp(new Date(s.since))}${s.reason? ' · '+esc(s.reason):''}</div>` : ''}
        ${placed? `<div class="hint" style="margin-top:10px"><b>${esc(placeLabel(s))}</b> ·
          ${stamp(new Date(s.since))} · ${esc(s.by||'')}</div>` : ''}
        ${isQueued(s.ev)? `<div class="kwait" style="margin-top:8px">${T('waiting')}</div>` : ''}
        ${hint? `<div class="hint" style="margin-top:8px">${hint}</div>` : ''}
        ${!out? `<div class="field" style="margin-top:14px">
            <label>${T('Reason')}</label>
            <div class="chips" id="kochips">
              ${REASONS.map(r=>`<button class="chip${keepReason===r?' on':''}" onclick="koPick(this,'${r}')">${r}</button>`).join('')}
            </div>
            <input id="koreason" style="margin-top:10px" value="${esc(keepReason)}" placeholder="${T('Something else')}"
                   oninput="document.querySelectorAll('#kochips .chip').forEach(c=>c.classList.remove('on'))">
          </div>` : ''}
      </div>

      <div class="csec">${T('Keys')}<span class="ccount">${total}</span></div>
      ${(()=>{ // one line per physical key, numbered, so you can count them off the ring
        let n = 0;
        return keys.map(k=>Array.from({length:k.q}, ()=>`<div class="krow">
          <span class="knum">${++n}</span>
          <span class="kt">
            <b>${esc(k.t)}</b>
            ${k.m? `<span>${esc(k.m)}</span>` : '<span>—</span>'}
            ${k.note? `<span>${esc(k.note)}</span>` : ''}
          </span>
        </div>`).join('')).join('');
      })()}

      ${(()=>{ const ev = eventsFor(id); if(!ev.length) return '';
        return `<button class="addc" style="margin:18px 3px 0" onclick="toggleHist()">
            ${histOpen? T('Hide history') : T('History') + ' (' + ev.length + ')'}</button>
          ${histOpen? `<div class="card" style="margin-top:8px">${ev.slice(0,20).map(e=>
            `<div class="logline"><b>${stamp(new Date(e.ts))}</b><span>${esc(evLine(e))}${queuedSuffix(e)}</span></div>`).join('')}</div>` : ''}`;
      })()}
    </div>
    <div class="sheetbar">
      <button class="btn ghost" onclick="closeBundle()">${T('Close')}</button>
      ${placed? `<button class="btn ghost" onclick="checkOut('${id}')">${T('Take it')}</button>
                 <button class="btn" onclick="checkIn('${id}')">${T('Check in')}</button>`
        : out? `<button class="btn" onclick="checkIn('${id}')">${T('Check in')}</button>`
             : `<button class="btn" onclick="checkOut('${id}')">${T('Check out')}</button>`}
    </div>`;
  if(focused === 'koname' || focused === 'koreason' || focused === 'koini'){
    const f = document.getElementById(focused);
    if(f){ try{ f.focus(); if(caret != null) f.setSelectionRange(caret, caret) }catch(e){} }
  }
}

/* Check out and check in are one tap on the bundle sheet itself - the name field and the
   reason chips live there (see paintBundle). Only the name is needed; the log is worth
   nothing without one, but everything else can be left as it stands. A second tap while
   the first is still being written is ignored, so a nervous thumb cannot log twice. */
let koBusy = false;
const REASONS = ['Inflytt','Utflytt','Visning','Hantverkare','Städ','Besiktning'];
function koPick(btn, reason){
  const already = btn.classList.contains('on');
  document.querySelectorAll('#kochips .chip').forEach(c=>c.classList.remove('on'));
  const input = document.getElementById('koreason');
  if(already){ input.value = ''; return }
  btn.classList.add('on');
  input.value = reason;
}
// The name is the one thing the log cannot do without. It is read from the field when one is
// shown, otherwise it is the saved one; either way it is saved for next time.
async function koName(){
  // Set once, in the menu, and kept on the phone. An inspection that already names its
  // inspector counts as having set it, so an older report still writes a name to the log.
  let name = (keyMe || '').trim();
  if(!name && S && S.inspector && S.inspector.name) name = S.inspector.name.trim();
  if(!name){ toast(T('Set your name in the menu')); openMenu(); return '' }
  if(name !== keyMe){ keyMe = name; await store.set(KEYNAME, name) }
  return name;
}
async function checkOut(id){
  if(koBusy) return;
  koBusy = true;
  try{
    const name = await koName(); if(!name) return;
    const f = document.getElementById('koreason');
    const reason = (f ? f.value : '').trim();
    // Where it came from when that was not the cabinet: the apartment or guest it had been
    // left with, or the colleague it is being taken over from.
    const s = bstate(id);
    const from = s.status === 'placed' ? placeLabel(s) : (s.status === 'out' && s.holder && s.holder !== name ? s.holder : '');

/* ----- leaving a bundle in the apartment, or with the guest -----
   The third place a bundle can be, and it is only ever reached from inside an inspection:
   a shortstay unlock, a move-in or a move-out. The apartment is the inspection's own, the
   person it goes to is the counterparty (or a name typed on the card), and the bundle is
   the one tag read - scanned, or typed - so the whole thing is one tap on the Keys card.
   From the cabinet straight into the apartment, or via the inspector's own holdings: both
   are written as one 'place' event, without questions. Only a bundle registered with
   somebody else, or belonging to another apartment, is shown for a second look first.
   Closing the scanner or the review writes nothing; a failed save leaves things as they
   were and says so. */
const HANDOVER_TYPES = ['Upplåsning','Inflytt','Utflytt'];
const canHandover = () => !!S && HANDOVER_TYPES.includes(S.type);
let ho = null;        // the hand-over in progress: {apt, place, guest, got, notes, step}
let hoLast = null;    // the last one written from an inspection: {insp, ev}, shown on its card

// The inspection's apartment as the register knows it, when it does: "lgh 1102 TÄRNA" and
// the object number 112 - the half of a bundle number in front of the colon. An apartment
// the register has not got yet is named by what the inspection says, address included,
// since "lgh 1201" alone would not say which house.
const squash = s => String(s||'').toLowerCase().replace(/[\s,.\-]/g,'');
function inspApt(){
  const addr = squash(S.address), apt = squash(S.apt);
  const b = addr && apt ? (window.NYCKLAR||[]).find(b => squash(b.a) === addr && squash(b.l) === apt) : null;
  if(b) return { apt: String(b.id).split(':')[0], place: 'lgh ' + b.l + (b.n ? ' ' + b.n : ''), known: true };
  const place = [S.address, S.apt ? 'lgh ' + S.apt : ''].filter(Boolean).join(', ').trim();
  return { apt: '', place, known: false };
}
// Who the keys go to. It is the counterparty, always - the inspection already asked for that
// name on the first step, and asking again on the key card was a field for nothing. (An
// inspection that still carries a name typed into the old field keeps it.)
const inspTo = () => S.keyTo || ((S.counter && S.counter.name) || '');
const hoDest = () => !ho ? '' : ([ho.place, ho.guest].filter(Boolean).join(' · ') || T('the apartment'));

// apartment, and the one field that does the hand-over. Painted from what is already on

  const carried = ctx.apt ? myKeys().filter(id => String(id).split(':')[0] === ctx.apt) : myKeys();

    <div style="margin-top:8px">

      ${carried.map(id => `<button class="kbrow" onclick="inspPick('${id}')"><span class="kstat out">${T('with you')}</span><b>${esc(id)}</b>

async function hoBegin(){

function hoGot(id){

// The three coloured proposals that used to live here are gone: the key screens are white
// like the rest of the app. The stored choice is dropped so no phone keeps a dark one.
try{ localStorage.removeItem('beaps-ktheme') }catch(e){}

/* ----- the properties behind the two fields on the Property step -----
   Addresses and apartments out of fastigheter.js, offered as you type. Nothing is forced:
   both fields take whatever is written, and a property the register has not got is typed in
   exactly as before - the suggestions only save the typing. Getting the address written the
   same way every time is also what lets the key card further in find the apartment in the
   key register, so it is worth a little help here. */
const loadFastigheter = () => loadScript('fastigheter.js', ()=>Array.isArray(window.FASTIGHETER));
// Matching is word by word: every word typed has to turn up somewhere in the address, in any
// order, so "eriksg 53b" finds "Sankt Eriksgatan 53B" and "91b uppl" finds Upplandsgatan 91B.
// "S:t" and "St" are folded to "Sankt" because the key list and the property list spell it
// differently, and a comparison with the spaces taken out decides whether a field already
// names one property exactly.
const fold = s => String(s==null?'':s).toLowerCase()
  .replace(/\bs:t\b/g,'sankt').replace(/[.,:;\-]/g,' ').replace(/\bst\b/g,'sankt')
  .replace(/\s+/g,' ').trim();
const tight = s => fold(s).replace(/\s/g,'');
const words = q => fold(q).split(' ').filter(Boolean);
const hitsAll = (text, ws) => { const t = fold(text); return ws.every(w => t.includes(w)) };
const propOf = a => (window.FASTIGHETER||[]).find(f => tight(f.a) === tight(a));
const SUG_MAX = 8;
// Fetch the register when the Property step opens, then paint - never before, so a phone that
// only ever opens the start screen pays nothing for it.
function propPrime(){ loadFastigheter().then(()=>{ if(view==='object') paintPropSug() }) }
function paintPropSug(){
  const reg = window.FASTIGHETER || [];
  const aEl = document.getElementById('f_address'), pEl = document.getElementById('f_apt');
  const aBox = document.getElementById('sugaddr'), pBox = document.getElementById('sugapt');
  if(!aBox || !pBox) return;
  const aVal = aEl ? aEl.value : '', pVal = pEl ? pEl.value : '';
  const hit = propOf(aVal);

  // Addresses: only once something is typed, and not when it already names one exactly.
  let rows = [];
  if(reg.length && tight(aVal) && !hit){
    const ws = words(aVal);
    const m = reg.filter(f => hitsAll(f.a, ws));
    rows = m.slice(0, SUG_MAX).map(f =>
      `<button class="sugrow" onclick="pickAddr('${esc(f.a).replace(/'/g,"\\'")}')"><b>${esc(f.a)}</b>${f.l.length? `<span>${f.l.length} ${T(f.l.length===1?'apartment':'apartments')}</span>`:''}</button>`);
    if(m.length > rows.length) rows.push(`<span class="sugmore">+${m.length - rows.length} ${T('more')}</span>`);
  }
  aBox.innerHTML = rows.join('');

  // Apartments: the ones at the address, as soon as it is known. Few enough to just show.
  let arows = [];
  if(hit && hit.l.length){
    const q = tight(pVal), ws = words(pVal);
    const m = q ? hit.l.filter(l => hitsAll(l[0] + ' ' + (l[1]||''), ws)) : hit.l;
    const exact = hit.l.some(l => tight(l[0]) === q);
    if(!(exact && m.length === 1)){
      arows = m.slice(0, 12).map(l =>
        `<button class="sugrow${tight(l[0])===q?' on':''}" onclick="pickApt('${esc(l[0]).replace(/'/g,"\\'")}')"><b>${esc(l[0])}</b>${l[1]? `<span>${esc(l[1])}</span>`:''}</button>`);
      if(m.length > arows.length) arows.push(`<span class="sugmore">+${m.length - arows.length} ${T('more')}</span>`);
    }
  }
  pBox.innerHTML = arows.join('');
}
// Picking writes the same way typing does, so nothing else has to know where it came from.

  const el = document.getElementById('f_address'); if(!el) return;
  el.value = a; unlockIfLocked(); S.address = a; save();

}

  const el = document.getElementById('f_apt'); if(!el) return;

  paintPropSug();

}

/* ---------- PDF ---------- */
function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(true);
  return new Promise(res=>{
    let done = false;
    const finish = ok => { if(!done){ done = true; res(ok) } };
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ()=>finish(!!window.jspdf); s.onerror = ()=>finish(false);
    setTimeout(()=>finish(false), 15000);   // a hanging CDN on a bad network must not lock the PDF flow for minutes
    document.head.appendChild(s);
  });
}
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src }) }
async function shrinkForPdf(data, budget){
  try{
    if(bytesOf(data) <= budget){ const im = await loadImg(data); return {data, w:im.naturalWidth, h:im.naturalHeight} }
    const im = await loadImg(data);
    let maxDim = 1100, q = 0.78, out = draw(im, im.naturalWidth, im.naturalHeight, maxDim, q), n = 0;
    while(bytesOf(out) > budget && n < 8){
      n++;
      if(q > 0.66) q = Math.round((q-0.06)*100)/100;
      else if(maxDim > 560) maxDim = Math.max(560, Math.round(maxDim*0.85));
      else break;
      out = draw(im, im.naturalWidth, im.naturalHeight, maxDim, q);
    }
    const om = await loadImg(out);
    return {data: out, w: om.naturalWidth, h: om.naturalHeight};
  }catch(e){ return null }
}
const sizeCache = {};
function imgSize(data){
  if(sizeCache[data]) return Promise.resolve(sizeCache[data]);
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{ sizeCache[data] = {w:im.naturalWidth, h:im.naturalHeight}; res(sizeCache[data]) };
    im.onerror = ()=>res({w:4,h:3});
    im.src = data;
  });
}
function fileName(){
  return (ref()||'Inspection').replace(/[\/\\:*?"<>|]/g,' ').replace(/\s+/g,' ').trim() + '.pdf';
}
async function buildPdf(){
  if(!await loadJsPDF()){ toast('Could not load the PDF engine, using print'); return null }
  const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4', compress:true});
  // jsPDF's default font only draws Latin-1. Sanitise all text in one sweep so the user's
  // emoji/arrows don't become gibberish in the report (wa() leaves aao untouched).
  const _text = doc.text.bind(doc), _split = doc.splitTextToSize.bind(doc);
  doc.text = (t, ...a) => _text(Array.isArray(t)? t.map(wa) : wa(t), ...a);
  doc.splitTextToSize = (t, ...a) => _split(wa(t), ...a);
  const allPhotos = isCheck()
    ? visibleChecks().reduce((a,c)=>a+((c.photos&&c.photos.length)||0), 0)
    : S.rooms.reduce((a,r)=>a+r.photos.length, 0);
  const photoBudget = Math.max(80*1024, Math.min(720*1024, Math.floor(3.3*1048576 / Math.max(1, allPhotos))));
  let packed = 0;
  const packNote = ()=>{ packed++; if(allPhotos>8 && packed%5===0) toast(`Packing photos ${packed} of ${allPhotos}`) };
  const M = 34, W = 595, H = 842, CW = W - M*2;
  let y = M;
  const need = h => { if(y + h > H - 46){ doc.addPage(); y = M } };
  const line = (txt, size, style, gap) => {
    doc.setFont('helvetica', style||'normal'); doc.setFontSize(size||10);
    const rows = doc.splitTextToSize(txt, CW);
    need(rows.length*(size||10)*1.25);
    doc.text(rows, M, y + (size||10));
    y += rows.length*(size||10)*1.25 + (gap||0);
  };

  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text(isCheck()? 'SHORTSTAY UPPLÅSNING' : 'INSPECTION REPORT', M, y+8);
  doc.setFontSize(8);
  doc.text(isCheck()? [stamp(new Date(S.created)), 'ID '+S.id]
                    : [TYPE_LABEL[S.type]||S.type, stamp(new Date(S.created)), 'ID '+S.id],
           W-M, y+8, {align:'right'});
  y += 22;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(ref(), M, y+12); y += 24;
  doc.setDrawColor(20); doc.setLineWidth(1.2); doc.line(M, y, W-M, y); y += 16;

  // The link at the very top, in its own box. The photos further down are squeezed so
  // the document fits in an email — there they are as they were taken, and the video can
  // be played, which it never can in a PDF.
  // The Dropbox folder when the inspection was filed there, otherwise the app's own gallery.
  const lank = (S.dropbox && S.dropbox.url) || (S.gallery && S.gallery.url) || null;
  if(lank){
    const harVideo = !!(S.video && S.video.stored);
    const rubrik = harVideo
      ? 'See the video and zoom into the photos'
      : 'Zoom into the photos';
    const rader = [
      harVideo ? 'Click the link below to see the recorded videos and photos at full size.'
               : 'Click the link below to see the photos at full size and zoom into them.',
      'The photos in this document are compressed to fit in an email.'
    ];
    const boxH = 30 + rader.length*11 + 16;
    need(boxH + 8);
    doc.setFillColor(250, 246, 232); doc.setDrawColor(233, 175, 18); doc.setLineWidth(.9);
    doc.roundedRect(M, y, CW, boxH, 6, 6, 'FD');

    let by = y + 17;
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0);
    doc.text(rubrik, M + 12, by); by += 14;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90);
    rader.forEach(t=>{ doc.text(t, M + 12, by); by += 11 });
    by += 5;
    doc.setFont('helvetica','bold'); doc.setTextColor(20, 80, 170);
    // A Dropbox share link is far longer than the gallery's. Shrink it until it fits the box
    // rather than letting it run off the edge of the page.
    let ls = 9.5;
    doc.setFontSize(ls);
    try{ while(ls > 6 && doc.getTextWidth(lank) > CW - 24){ ls -= 0.5; doc.setFontSize(ls) } }catch(e){}
    try{ doc.textWithLink(lank, M + 12, by, {url: lank}) }
    catch(e){ doc.text(lank, M + 12, by) }
    doc.setTextColor(0); doc.setFont('helvetica','normal');
    y += boxH + 16;
  }

  const keys = isCheck()? null : S.rooms.find(r=>r.fixed || r.name.toLowerCase().startsWith('nyck'));
  line(`Inspector: ${S.inspector.name||'-'}`, 10);
  if(!isCheck()) line(`Counterparty: ${S.counter.name||'-'}${S.counter.role? ' ('+S.counter.role+')':''}`, 10);
  if(keys) line(`Keys: ${keys.comment||'-'}, ${keys.photos.length} photos`, 10);
  if(S.video) line(`Video recorded ${stamp(new Date(S.video.ts))}`, 10);
  if(S.wifi) line(`Internet: ${wifiLine(S.wifi)}`, 10);
  y += 8;

  /* A receipt for the keys, not a question about them. It appears only when a bundle was
     actually handed over during this inspection, and then it lists every physical key on the
     ring by type and marking - which is the thing a move-in or move-out argument is later
     about, and which no free-text "3 nycklar + bricka" can settle. Drawn from S.keysOut,
     copied off the register at the moment of the hand-over. */
  if((S.keysOut||[]).length){

  const RCOL = 3, RGAP = 10, rcw = (CW - RGAP*(RCOL-1))/RCOL, rmaxH = 240;
  for(const r of (isCheck()? [] : S.rooms)){

      const raw = await getFull(p.id); if(!raw) continue;

    if(cmt){

    }

      row.forEach((x,col)=>{

  if(isCheck()){

    doc.setFont('helvetica','normal'); doc.setFontSize(10);

  const logRows = isCheck()

  doc.setFont('courier','normal'); doc.setFontSize(9);
  logRows.forEach(l=>{ need(14); doc.text(`${stamp(new Date(l.ts))}   ${l.txt}`, M, y+9); y += 14 });

  const pages = doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(`${ref()}  ·  page ${i} of ${pages}`, W/2, H-24, {align:'center'});
  }

  return {blob: doc.output('blob'), name: fileName()};
}
async function sharePdf(blob, name){
  const file = new File([blob], name, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name,
      text: isCheck()? `Upplåsning ${ref()}` : `Inspection ${ref()}` }); return }
    catch(e){ if(e && e.name === 'AbortError') return }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

}
const mailTarget = () => isCheck()? 'guestservice@beaps.se' : 'longstay@beaps.se';
// Up to this size the PDF rides base64-encoded inside the request, as it always has. Above it
// the report is parked in the gallery's storage first (report-put) and the mail carries a link
// the mail service fetches itself, so the server never holds the bytes as text. That is what
// lets a move-out with two hundred photos go out by mail like any other instead of stopping at
// the share sheet.
const MAIL_INLINE_MAX = 4*1048576;
// beaps.se is Microsoft 365, which takes a message of about 25 MB once the attachment is base64-encoded.
const MAIL_MAX = 16*1048576;
// The signing link takes the same size; MAX_PDF on the server is the twin of this.
const SIGN_MAX = 16*1048576;
// The report's fingerprint, printed on the signature page so the two files that come out of a
// signing can be told to belong together. Computed here because a worker on the free plan cannot
// spare the CPU to hash a 16 MB file. Null when the browser won't do it - it must never block.
async function sha256Hex(blob){
  try{
    const buf = await crypto.subtle.digest('SHA-256', await blob.arrayBuffer());
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return null }
}
// Sends the report for a signing link up as raw bytes. Returns {ok,id}, or {legacy:true} when
// the host has no such endpoint - an older Netlify deploy answers 404 and Cloudflare answers
// the app's own HTML with 200 on an unknown /api path, so neither counts as an upload.
async function uploadSignPdf(blob, say){
  let shown = -1, sist = 'ingen kontakt';
  for(let attempt=0; attempt<2; attempt++){
    if(attempt) await new Promise(r=>setTimeout(r, 1500));
    try{
      const r = await putWithProgress('/api/sign-upload', blob, 'application/pdf', 120000,
        pct => { if(pct !== shown){ shown = pct; say(`${T('Uploading the report')} ${pct} %`) } });
      if(r.status===404 || r.status===405) return {ok:false, legacy:true};
      if(r.status===401) return {ok:false, reason:'ladda om'};
      if(r.status===413) return {ok:false, reason:'size'};
      let j = null; try{ j = JSON.parse(r.text) }catch(e){}
      if(r.status>=200 && r.status<300) return (j && j.ok && j.id)? {ok:true, id:j.id} : {ok:false, legacy:true};
      sist = 'server ' + r.status;
    }catch(e){ sist = String(e && e.message || e) }
  }
  return {ok:false, reason:sist};
}
// PUT with a progress figure, which fetch cannot give. Resolves with the status and body text.
function putWithProgress(url, blob, type, ms, onPct){
  return new Promise((res, rej)=>{
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Type', type);
    Object.keys(AUTH).forEach(k=>x.setRequestHeader(k, AUTH[k]));
    x.timeout = ms;
    x.upload.onprogress = e => { if(e.lengthComputable && onPct) onPct(Math.round(e.loaded*100/e.total)) };
    x.onload = ()=>res({status:x.status, text:x.responseText||''});
    x.onerror = ()=>rej(new Error('ingen kontakt'));
    x.ontimeout = ()=>rej(new Error('timeout'));
    x.onabort = ()=>rej(new Error('abort'));
    x.send(blob);
  });
}
// Uploads the report to the gallery's storage. One retry, as with the photos: mobile networks
// drop a request after idle now and then. The toast follows the upload so a long one is not
// mistaken for a hang.
async function parkReport(blob, token){
  let shown = -1, sist = 'ingen kontakt';
  for(let attempt=0; attempt<2; attempt++){
    if(attempt) await new Promise(r=>setTimeout(r, 1500));
    try{
      const r = await putWithProgress('/api/report-put?t='+token, blob, 'application/pdf', 120000,
        pct => { if(pct !== shown){ shown = pct; toast(`${T('Uploading the report')} ${pct} %`) } });
      if(r.status===401) return {ok:false, reason:'ladda om'};
      if(r.status===413) return {ok:false, reason:'size'};
      let j = null; try{ j = JSON.parse(r.text) }catch(e){}
      // The id is random per upload, so the report cannot be guessed at from the gallery link.
      if(r.status>=200 && r.status<300 && j && j.ok && j.id) return {ok:true, id:j.id};
      sist = 'server ' + r.status;
    }catch(e){ sist = String(e && e.message || e) }
  }
  return {ok:false, reason:sist};
}
async function mailPdf(blob, name){
  if(blob.size > MAIL_MAX) return {ok:false, reason:'size'};
  const body = {
    filename: name,
    kind: isCheck()? 'upplasning' : 'besiktning',
    subject: (isCheck()? 'UpplåsningPDF ' : 'BesiktningPDF ') + ref(),
    // lets the server file the report next to its own photos in Dropbox, and is where a big
    // report is parked
    gallery: (S.gallery && S.gallery.token) || null
  };
  if(blob.size <= MAIL_INLINE_MAX){
    body.pdf = await new Promise(res=>{ const fr = new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob) });
  } else {
    // no gallery means nowhere to park it, so this one goes by the share sheet
    if(!body.gallery) return {ok:false, reason:'size'};
    const up = await parkReport(blob, body.gallery);
    if(!up.ok) return up;
    body.hosted = up.id;
    toast(T('Sending'));
  }
  const ac = new AbortController();
  try{
    // A hosted report gets longer: inside this one call the server copies it to Dropbox and
    // Resend fetches it, and a timeout here after the mail has gone would only produce a
    // "did not go through" and a second copy by the share sheet.
    const r = await withTimeout(fetch('/api/send-pdf', {
      method:'POST', headers:{'Content-Type':'application/json', ...AUTH}, signal: ac.signal,
      body: JSON.stringify(body)
    }), body.hosted ? 60000 : 25000);
    if(r.status===429) return {ok:false, reason:'quota'};
    if(r.status===401) return {ok:false, reason:'ladda om'};
    if(!r.ok) return {ok:false, reason:'server '+r.status};
    // Cloudflare responds 200 with the app's HTML on an unknown /api path. Require a real JSON ok
    // so we never claim "Emailed" when the function never ran.
    let j = null; try{ j = await r.json() }catch(e){}
    if(!j || j.ok !== true) return {ok:false, reason:'ej bekräftat'};
    return {ok:true};
  }catch(e){ try{ ac.abort() }catch(_){}  return {ok:false, reason:'ingen kontakt'} }
}
async function sendPdf(){
  commitPendingPads();
  await ensureGalleryUploaded();
  toast(T('Building PDF'));
  const out = await buildPdf();
  if(!out) return legacyPrint();
  toast(T('Sending'));
  const m = await mailPdf(out.blob, out.name);
  if(m.ok){ toast(T('Emailed to') + ' ' + mailTarget()); return }
  if(m.reason==='size') toast(T('Too large for email, opening share'));
  else if(m.reason==='quota') toast(T('Daily email limit reached, opening share'));
  else if(m.reason==='ladda om') toast(T('Reload the app — opening share'));
  else toast(T('The email did not go through, opening share'));
  await sharePdf(out.blob, out.name);
}

async function backup(){
  // check-ins have the photos on the checklist rows, other types on the rooms.
  // Include both, plus the video, so a backup never becomes silently incomplete.
  const barare = (S.rooms||[]).concat(S.checks||[]);
  let video = null;
  try{ if(S.video && S.video.stored) video = await store.get(K.video(S.id)) }catch(e){}
  // Written as a stream of pieces straight into the Blob. Turning a hundred photos into one
  // giant string first is exactly what a phone runs out of memory on.
  const parts = ['{"version":1,"exported":' + Date.now() +
                 ',"inspection":' + JSON.stringify(S) +
                 ',"video":' + JSON.stringify(video || null) + ',"photos":{'];
  video = null;
  let forst = true;
  for(const r of barare){
    for(const p of (r.photos||[])){
      const full = await getFull(p.id);
      if(!full) continue;
      parts.push((forst?'':',') + JSON.stringify(p.id) + ':' + JSON.stringify(full));
      forst = false;
    }
  }
  parts.push('}}');
  const blob = new Blob(parts, {type:'application/json'});
  parts.length = 0;
  const name = fileName().replace(/\.pdf$/,'') + '.json';
  const file = new File([blob], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return }
    catch(e){ if(e && e.name === 'AbortError') return }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

          <div style="font-size:12px">${esc(S.inspector.name)}<br>${S.sig.inspector?stamp(new Date(S.sig.inspector.ts)):''}</div></div>
        <div>${S.sig.counter?`<img src="${S.sig.counter.data}">`:'<div style="height:60px;border-bottom:1px solid #333;width:260px"></div>'}
          <div style="font-size:12px">${esc(S.counter.name)}<br>${esc(S.counter.role||'')}<br>${S.sig.counter?stamp(new Date(S.sig.counter.ts)):''}</div></div>
      </div>
      <h3 style="margin-top:20px">Activity log</h3>
      <table style="font:11px monospace;border-collapse:collapse;width:100%">
        ${S.log.map(l=>`<tr><td style="padding:2px 8px 2px 0;white-space:nowrap">${stamp(new Date(l.ts))}</td><td>${esc(l.txt)}</td></tr>`).join('')}
      </table>
    </div>`;
  setTimeout(()=>window.print(), 60);
}

// Land on the start screen, then wherever the address points.
renderStart().then(()=>{ if(location.hash === LOG_HASH) openKeyLog() });
</script>
