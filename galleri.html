<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F1ED">
<title>Photos & video</title>
<style>
  :root{
    --paper:#F2F1ED; --card:#FFFFFF; --ink:#16325C; --ink2:#6E7C94;
    --line:#E0DDD7; --brand:#FFC629; --brand-dark:#E9AF12; --rec:#C2352F;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
  button{font-family:inherit;font-size:16px;cursor:pointer;border:0;background:none;color:inherit}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
  .hint{font-size:13px;color:var(--ink2);margin-top:6px}

  .top{position:sticky;top:0;z-index:30;background:rgba(242,241,237,.94);backdrop-filter:blur(8px);
       border-bottom:1px solid var(--line);padding:calc(13px + env(safe-area-inset-top)) 16px 13px}
  .top .row{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:1100px;margin:0 auto}
  .logo{height:24px;width:auto;display:block;flex:none}

  .wrap{padding:16px;max-width:1100px;margin:0 auto calc(30px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tile{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line);
        background:#eceae6;display:block;padding:0;width:100%}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(16,19,20,.82),rgba(16,19,20,0));
             color:#fff;font-size:12px;padding:16px 8px 6px;text-align:left;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
              font-size:34px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}

  .sect{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
        color:var(--ink2);margin:22px 3px 9px}

  video{width:100%;border-radius:11px;background:#000;display:block}

  /* Fullscreen view with pinch-zoom */
  .viewer{position:fixed;inset:0;z-index:80;background:#0b0d0e;display:none;flex-direction:column}
  .viewer.on{display:flex}
  .viewer .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
               padding:calc(10px + env(safe-area-inset-top)) 16px 10px;color:#fff;font-size:14px}
  .viewer .bar button{color:#fff;font-size:15px;padding:6px 10px}
  .viewer .stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;
                 -webkit-overflow-scrolling:touch;touch-action:pinch-zoom}
  .viewer .stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .viewer .nav{display:flex;gap:10px;justify-content:space-between;align-items:center;
               padding:10px 16px calc(14px + env(safe-area-inset-bottom));color:#fff}
  .viewer .nav button{border:1px solid #3A3D3E;border-radius:9px;padding:10px 18px;color:#fff}
  .viewer .nav button[disabled]{opacity:.35}
  .big{text-align:center;padding:40px 18px}
  .big .mark{font-size:32px;font-weight:650;margin-bottom:10px}
</style>

<div class="top"><div class="row">
  <div><div class="eyebrow">Inspection</div><h1 id="title">Photos & video</h1></div>
  <img class="logo" src="logo.png" alt="Beaps" onerror="this.remove()">
</div></div>
<div class="wrap" id="app"><div class="card"><div class="big">Loading…</div></div></div>

<div class="viewer" id="viewer">
  <div class="bar">
    <span id="vcap"></span>
    <button onclick="stang()">Close</button>
  </div>
  <div class="stage" id="vstage"></div>
  <div class="nav">
    <button id="vprev" onclick="stega(-1)">‹ Previous</button>
    <span id="vnum" style="font-family:var(--mono);font-size:12px"></span>
    <button id="vnext" onclick="stega(1)">Next ›</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stamp = ms => ms? new Intl.DateTimeFormat('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit',
  hour:'2-digit',minute:'2-digit'}).format(new Date(ms)).replace(',','') : '';
const token = (new URLSearchParams(location.search).get('t')||'').replace(/[^a-f0-9]/g,'');
const filUrl = id => '/api/media-file?t='+token+'&id='+encodeURIComponent(id);

const TYPE_LABEL = {'Upplåsning':'Shortstay upplåsning','Inflytt':'Move-in','Utflytt':'Move-out','Årlig':'Annual','Skada':'Damage'};

let data = null, bilder = [], visar = -1;

function meddela(rubrik, text){
  $('#app').innerHTML = `<div class="card"><div class="big">
    <div class="mark">!</div><h1 style="margin-bottom:8px">${esc(rubrik)}</h1>
    <div style="font-size:14px;color:var(--ink2)">${text}</div></div></div>`;
}

async function load(){
  if(token.length !== 48) return meddela('The link is incomplete',
    'Copy the entire address from the report, including the code after <code>t=</code>.');
  let r;
  try{ r = await fetch('/api/media-list?t='+token) }
  catch(e){ return meddela('No connection','Check your connection and reload the page.') }
  if(!r.ok) return meddela(r.status===410? 'The gallery has expired' : 'The gallery does not exist',
    r.status===410? 'The photos are kept for one year. Ask Beaps to send new ones.'
                  : 'Check the link, or ask Beaps to send a new one.');

  data = await r.json();
  const objekt = data.ref || [data.address, data.apt].filter(Boolean).join(', ') || 'Inspection';
  document.title = objekt;
  $('#title').textContent = objekt;

  const videor = data.items.filter(i => i.kind === 'video');
  bilder = data.items.filter(i => i.kind !== 'video');

  $('#app').innerHTML =
    `<div class="card">
      <div style="font-size:14px;color:var(--ink2)">
        ${data.type? esc(TYPE_LABEL[data.type]||data.type)+' · ' : ''}${bilder.length} photos${videor.length? ' · '+videor.length+' video':''}
        ${data.inspector? ' · '+esc(data.inspector) : ''}
      </div>
      <div class="hint">Tap a photo to see it in full size. There you can pinch to zoom.
        ${data.saknas? '<br><b>'+data.saknas+' files could not be uploaded.</b>' : ''}</div>
    </div>` +
    (videor.length? `<div class="sect">Video</div>` +
      videor.map(v => `<div class="card"><video controls playsinline preload="metadata" src="${filUrl(v.id)}"></video>
        <div class="hint">${esc(v.name||'Walkthrough')}${v.ts? ' · '+stamp(v.ts):''}</div></div>`).join('') : '') +
    (bilder.length? `<div class="sect">Photos</div><div class="grid">` +
      bilder.map((b,i) => `<button class="tile" onclick="visa(${i})">
        <img loading="lazy" src="${filUrl(b.id)}" alt="${esc(b.name||'')}">
        ${b.name? `<span class="cap">${esc(b.name)}</span>`:''}
      </button>`).join('') + `</div>` : '');
}

function visa(i){
  if(i < 0 || i >= bilder.length) return;
  visar = i;
  const b = bilder[i];
  $('#vstage').innerHTML = `<img src="${filUrl(b.id)}" alt="${esc(b.name||'')}">`;
  $('#vcap').textContent = (b.name || '') + (b.ts? ' · ' + stamp(b.ts) : '');
  $('#vnum').textContent = (i+1) + ' / ' + bilder.length;
  $('#vprev').disabled = i === 0;
  $('#vnext').disabled = i === bilder.length - 1;
  $('#viewer').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function stega(d){ visa(visar + d) }
function stang(){
  $('#viewer').classList.remove('on');
  $('#vstage').innerHTML = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if(!$('#viewer').classList.contains('on')) return;
  if(e.key === 'Escape') stang();
  if(e.key === 'ArrowLeft') stega(-1);
  if(e.key === 'ArrowRight') stega(1);
});

load();
</script>
