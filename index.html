<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inspection">
<meta name="theme-color" content="#F2F1ED">
<title>Beaps Inspection</title>
<style>
  :root{
    --paper:#F2F1ED;
    --card:#FFFFFF;
    --ink:#16325C;
    --ink2:#6E7C94;
    --line:#E0DDD7;
    --brand:#FFC629;
    --brand-dark:#E9AF12;
    --coral:#E8917D;
    --rec:#C2352F;
    /* The app reads in a serif. The system sans and the monospace micro-labels it used to be
       set in are what every phone app looks like; a serif gives it a face of its own and
       suits a document that ends up as a signed report. ui-serif is New York on an iPhone,
       Apple's screen serif - Georgia elsewhere, Times where neither exists. */
    --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
    /* Only where digits have to line up: bundle numbers, counters, the scanner's field. */
    --num: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    /* Kept as names so the rules below did not all have to change at once. Both are the
       reading face now; anything that genuinely needs tabular figures asks for --num. */
    --mono: var(--serif);
    --sans: var(--serif);
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
       padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  /* Labels read as words, not as spaced-out capitals. The uppercase, wide-tracked micro-type
     this app used to be full of is what made it look like a form; plain serif at a small size
     says the same thing and gets out of the way. */
  .eyebrow{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--ink2)}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  h1{font-size:18px} h2{font-size:15px}
  button{font-family:inherit;font-size:16px;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 13px;border:1px solid var(--line);
                 border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  textarea{min-height:132px;resize:vertical;font-size:17px;line-height:1.5;padding:14px}
  .back{font-size:27px;line-height:1;padding:0 12px 5px 0;margin-left:-4px;color:var(--ink);flex:none}
  label{display:block;margin:0 0 6px}
  .readonly{background:#F7F8F8;color:var(--ink2)}

  .top{position:sticky;top:0;z-index:30;background:rgba(242,241,237,.93);backdrop-filter:blur(8px);
       border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .top .row{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .logo{height:27px;width:auto;display:block;flex:none}
  .hlogo{width:112px;max-width:44%;height:auto;display:block;margin:0 auto}
  .logo-fallback{font-weight:700;font-size:15px;letter-spacing:.22em;text-transform:uppercase}
  .progress{height:2px;background:var(--line);margin-top:10px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}

  .wrap{padding:16px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .field{margin-bottom:12px} .field:last-child{margin-bottom:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:11px;
       font-weight:650;width:100%;background:var(--brand);color:var(--ink);min-height:50px;
       border:1px solid var(--brand-dark)}
  .btn:active{background:var(--brand-dark)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:active{background:#F6F5F2}
  .btn.small{padding:9px 13px;min-height:42px;font-size:14px;width:auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:550}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .langsw{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .langbtn{padding:5px 11px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;font-weight:600;
           color:var(--ink2);background:#fff;line-height:1.4}
  .langbtn.on{background:var(--ink);color:#fff}
  .langbtn+.langbtn{border-left:1px solid var(--line)}

  .room{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
  .room .head{display:flex;align-items:stretch}
  .room .headmain{flex:1;display:flex;align-items:center;gap:12px;padding:15px 6px 15px 14px;text-align:left;min-width:0}
  .room .sub{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
  .dot.filled{background:var(--ink)}
  .room .icon{padding:0 12px;color:var(--ink);font-size:19px;line-height:1;display:flex;align-items:center}
  .room .del{padding:0 14px;color:var(--ink2);font-size:20px;line-height:1;display:flex;align-items:center}
  .room .body{padding:14px;border-top:1px solid var(--line)}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:10px}
  .thumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#f3f3f3}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ts{position:absolute;left:0;right:0;bottom:0;background:rgba(16,19,20,.72);color:#fff;font-family:var(--mono);font-size:9px;padding:3px 4px}
  .thumb .x{position:absolute;top:4px;right:4px;background:rgba(16,19,20,.8);color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;line-height:22px;text-align:center}
  .addrow{display:flex;gap:8px;align-items:center} .addrow input{flex:1}
  /* suggestions under the address and apartment fields on the Property step */
  .sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .sugrow{display:flex;align-items:baseline;gap:7px;text-align:left;padding:8px 12px;border:1px solid var(--line);
          border-radius:9px;background:#fff;color:var(--ink);font-size:14px;line-height:1.3;max-width:100%}
  .sugrow:active{background:#F6F5F2}
  .sugrow b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
  .sugrow span{color:var(--ink2);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sugrow.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sugrow.on span{color:#fff;opacity:.75}
  .sugmore{font-size:12px;color:var(--ink2);align-self:center}
  /* the apartment's name under the number, once the number is known: "C/O Miami" */
  .aptname{margin-top:8px;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .crow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
  .crow{transition:border-color .25s, box-shadow .25s}
  .crow.open{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
  .crow.child{margin-left:16px}
  .crow.flash{border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,50,92,.13)}
  .csec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 3px 10px;
        font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink)}
  .csec:first-child{margin-top:2px}
  .ccount{opacity:.7;flex:none}
  .nocmt{font-family:var(--serif);font-size:11px;color:var(--ink2);
         border:1px solid var(--line);border-radius:5px;padding:2px 6px;white-space:nowrap}
  .cwhen{font-family:var(--serif);font-size:11px;color:var(--ink2);margin-bottom:5px}
  .clabel{font-size:17px;font-weight:650;line-height:1.35;margin-bottom:10px}
  .cbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;row-gap:10px}
  .ynrow{display:flex;gap:8px;flex:1 1 200px;min-width:0}
  .yn{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:9px;padding:10px 8px;font-weight:600;font-size:15px;background:#fff}
  .yn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .yn.on.no{background:var(--rec);border-color:var(--rec);color:#fff}
  .yn.on.na{background:var(--ink2);border-color:var(--ink2);color:#fff}
  /* a row answered with a photo: one wide button where Yes and No would be, N/A beside it */
  .yn.snap{flex:2 1 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clinks{margin-left:auto;display:flex;align-items:center;gap:14px}
  .addc{margin:0;padding:0;background:none;border:0;line-height:1;font-family:var(--sans);font-size:13px;
        color:var(--ink2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
  .wifibtn{font-family:var(--sans);font-size:14px;font-weight:650;color:var(--ink);background:var(--brand);
           border:1px solid var(--brand-dark);border-radius:9px;padding:9px 15px;line-height:1;cursor:pointer;white-space:nowrap}
  .wifibtn:active{background:var(--brand-dark)}
  .crow .thumbs{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  .cinput{margin-top:10px;font-size:15px;padding:11px 12px}
  .room.drop, .card.drop{outline:2px dashed var(--ink);outline-offset:-2px;background:#F6F7F7}
  .room.dragging{opacity:.4}
  .handle{padding:0 10px 0 12px;color:#BDB9B1;font-size:16px;cursor:grab;display:flex;align-items:center;touch-action:none}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:90;
         background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;max-width:88vw;
         text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}

  .ticker{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:#E9ECEB;
          padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-family:var(--mono);font-size:11px;
          display:flex;gap:10px;align-items:center}
  .ticker .live{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}
  .ticker .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ticker .cnt{opacity:.6}
  /* A shelf, not a fade. The gradient it used to be let the white report cards show through
     right behind the button, so the one thing you are meant to press sat in the middle of the
     list instead of on top of it. Solid paper, a hairline, and a soft lift: the list clearly
     slides underneath. */
  .bar{position:fixed;left:0;right:0;bottom:calc(37px + env(safe-area-inset-bottom));z-index:39;padding:14px 16px;
       background:var(--paper);display:flex;gap:10px;max-width:720px;margin:0 auto;
       border-top:1px solid #D4D0C8;box-shadow:0 -14px 26px -14px rgba(16,19,20,.30)}
  .bar.stack{flex-direction:column}
  /* A ledger: the timestamp and the bundle number keep their column, what happened is read
     like the rest of the app. All of it in the tabular face made the log look like a
     terminal dump rather than a record. */
  .logline{display:flex;gap:10px;font-family:var(--num);font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}
  .logline > span{font-family:var(--serif);font-size:13.5px}
  .logline > span b{font-family:var(--num);font-size:12px}
  .logline b{font-weight:500;flex:none;color:var(--ink2)}

  .sigpad{border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:180px;display:block}
  .sigdone{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px}
  .sigdone img{width:100%;display:block}
  .sheet{position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto;padding-bottom:40px}
  /* The buttons in a fixed field at the bottom. Otherwise they end up off screen as soon
     as the keyboard is up, and then there is no way out in standalone mode on iPhone. */
  .sheet.hasbar{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  .sheetbar{position:fixed;left:0;right:0;bottom:0;z-index:62;display:flex;gap:10px;
            padding:10px 16px calc(12px + env(safe-area-inset-bottom));
            background:linear-gradient(to top,var(--paper) 74%,rgba(242,241,237,0))}
  .sheetbar .btn{margin:0}
  .hint{font-size:13px;color:var(--ink2);margin-top:6px}
  .locknote{font-family:var(--serif);font-size:12px;background:var(--brand);border:1px solid var(--brand-dark);border-radius:6px;padding:6px 9px;display:inline-block}
  .list-item{display:flex;gap:13px;align-items:center;padding:15px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
  .list-item .chev{margin-left:auto;color:#BDB9B1;font-size:19px;line-height:1}
  .rowwrap{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
  .rowwrap .list-item{margin:0;flex:1;min-width:0}
  .delbtn{width:54px;flex:none;border:1px solid #E3CDCB;border-radius:12px;background:#fff;color:var(--rec);font-size:22px;line-height:1}
  .delbtn:active{background:#FBF2F1}
  .listhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
  .listhead button{font-size:14px;color:var(--ink2);text-decoration:underline}
  .hero{padding:calc(38px + env(safe-area-inset-top)) 20px 26px;text-align:center;position:relative}
  .empty{text-align:center;padding:26px 18px;border:1px dashed #D3CFC7;border-radius:14px;background:#FBFAF8}
  /* Lifted into thumb reach, but only on an empty start screen. With reports on it the bar
     sits at the bottom where a bottom bar belongs - floating at 25vh it cut whichever report
     happened to be level with it in half, and the button read as one more row in the list.
     Nothing scrolls under the lifted one, so it drops the shelf: a hairline across an empty
     screen is just a stray line. */
  .bar.raised{bottom:calc(25vh + env(safe-area-inset-bottom));padding-bottom:16px;
              background:transparent;border-top:0;box-shadow:none}
  body.start{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.start.noreports{padding-bottom:calc(25vh + 120px)}
  body.start .ticker{display:none}
  .hidden{display:none !important}

  /* camera */
  .cam{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column}
  .cam .camtop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;font-size:15px}
  .cam .view{position:relative;flex:1;min-height:0;background:#0A0A0A;overflow:hidden}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .18s}
  .cam .reclabel{position:absolute;top:12px;left:12px;background:var(--rec);color:#fff;font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:5px}
  .cam .roomrow{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
  .cam .rchip{border:1px solid #3A3D3E;color:#C9CDCE;border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:14px;flex:none}
  .cam .rchip.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
  .cam .strip{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
  .cam .strip .t{position:relative;width:54px;height:54px;flex:none;border-radius:8px;overflow:hidden;background:#222}
  .cam .strip .t img{width:100%;height:100%;object-fit:cover}
  .cam .strip .t span{position:absolute;top:1px;right:1px;background:rgba(0,0,0,.7);width:18px;height:18px;border-radius:50%;font-size:11px;line-height:18px;text-align:center}
  .cam .ctrl{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 24px calc(16px + env(safe-area-inset-bottom))}

  /* QR scanning and the key bundle behind a tag */
  .scanbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .scanbox i{width:min(64vw,250px);aspect-ratio:1;border:3px solid var(--brand);border-radius:16px;
             box-shadow:0 0 0 100vmax rgba(0,0,0,.45);transition:border-color .12s,transform .12s}
  .scanbox.hit i{border-color:#4ADE80;transform:scale(.94)}
  @media (prefers-reduced-motion:reduce){ .scanbox i{transition:none} }
  .cam .scanfoot{padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .cam .scanfoot .msg{font-size:13.5px;color:#C9CDCE;text-align:center;line-height:1.45;min-height:20px}
  .cam .scanfoot .btn{background:transparent;color:#fff;border-color:#555}
  /* the move panel inside the scanner (2026-10-14): a light card on the dark camera */
  .cam .scanfoot{max-height:64vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .cam .scanfoot .btn.go{background:var(--brand);color:var(--ink);border-color:var(--brand)}
  .scansteps{display:flex;gap:6px;justify-content:center;padding:0 12px 8px;font-size:12.5px}
  .scansteps:empty{display:none}
  .scansteps span{padding:4px 10px;border-radius:999px;color:#9AA0A1;border:1px solid #3A3D3E}
  .scansteps span.on{background:#fff;color:#000;border-color:#fff;font-weight:650}
  .scansteps span.done{color:#BBF7D0;border-color:#14532D}
  .mvcard{background:#fff;color:var(--ink);border-radius:14px;padding:14px;text-align:left}
  .mvcard .hint{color:var(--ink2)}
  .cam .mvcard input{background:#fff;color:var(--ink);border:1px solid var(--line);font-family:var(--sans);letter-spacing:normal;text-align:left;font-size:16px}
  .mvstate{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:14px}
  .mvwarn{margin-top:10px;padding:10px 12px;border-radius:10px;background:#FFF4E5;color:#7A4B00;font-size:13.5px;line-height:1.45}
  .cmtbox{min-width:200px}
  .cmtin{width:100%;min-height:38px;font-size:13.5px;line-height:1.35;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;resize:vertical}
  .cmtin.dirty{border-color:#D99A00;background:#FFFBEB}
  .cmtin.error{border-color:var(--rec)}
  .cmtst{display:block;font-size:11.5px;margin-top:3px;min-height:14px;color:var(--ink2)}
  .cmtst.dirty{color:#8A5E00} .cmtst.saved{color:#2E7D5B} .cmtst.error{color:var(--rec)}
  .krow.koff{opacity:.55} .krow.koff .kt b,.krow.koff .kt span{text-decoration:line-through}
  .admkey.koff input{text-decoration:line-through;opacity:.6}
  .admnoterow{grid-column:1 / span 4;display:flex;gap:8px;align-items:center} .admnoterow input{flex:1;min-width:0}
  /* a key's on/off switch in admin: on (green) = in use, the normal case; off = inactive, struck through */
  .tgl{display:inline-flex;align-items:center;gap:8px;flex:none;font-size:13px;color:var(--ink2);padding:6px 0}
  .tgl i{position:relative;width:42px;height:26px;border-radius:999px;background:#C9CDCE;transition:background .15s}
  .tgl i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
                box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
  .tgl.on i{background:#2E7D5B} .tgl.on i::after{transform:translateX(16px)} .tgl.on span{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){ .tgl i,.tgl i::after{transition:none} }
  .planline{font-size:12px;color:#8A5E00;margin-top:2px}
  .kbleave{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px;margin:0 0 8px;
           background:var(--brand);color:var(--ink);border-radius:12px;font-size:15px;font-weight:650;line-height:1.35}
  .kbleave:disabled{opacity:.6}
  .scandone span button{color:#BBF7D0;margin-left:2px;padding:0 2px;font-size:15px;line-height:1}
  .ferr{margin-top:6px;font-size:13px;color:var(--rec);line-height:1.4}
  .mvsentence{margin-top:12px;padding:10px 12px;border-radius:10px;background:#EEF6F1;color:#14532D;font-weight:650;font-size:14.5px;line-height:1.4}
  .mvphotos{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .mvphead{font-size:13px;color:var(--ink2);margin-bottom:8px}
  .mvthumbs{display:flex;flex-wrap:wrap;gap:8px}
  .mvthumb{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;background:#eee}
  .mvthumb img{width:100%;height:100%;object-fit:cover}
  .mvthumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:22px}
  .mvshot{width:64px;height:64px;border-radius:9px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);background:#fafbfb}

    if(this._db) return Promise.resolve(this._db);

    try{ if(this._db) this._db.close() }catch(e){}

const T = s => (LANG==='sv' && SV[s]!=null) ? SV[s] : s;
// The language is set once, in the menu, and kept on the phone. Changing it there repaints
// the menu too, so the labels behind the switch follow it straight away.
function setLang(l){
  if(l!=='sv'&&l!=='en') return;
  LANG=l; try{ localStorage.setItem('beaps-lang',l) }catch(e){}
  render();
  if(document.getElementById('menu')){ closeMenu(); openMenu() }
}

function ensureChecks(){
  if(!isCheck()){ if(S && S.checks) S.checks.forEach(c=>{ if(!c.photos) c.photos = [] }); return }
  const old = (S.checks||[]), byKey = {}, used = new Set();
  old.forEach(c=>{ const k = c.key || keyForLabel(c.label); if(k && !byKey[k]) byKey[k] = c });
  // A finished list keeps the rows it was finished with: a question added to the app later is
  // not slipped into a list that was already sent. It appears once the list is opened again.
  const finished = !!(S.signedAt || S.closedAt) && old.length > 0;
  const next = CHECKS.filter(def => !finished || byKey[def.key]).map(def=>{
    const prev = byKey[def.key];
    if(prev) used.add(prev);
    return {
      id: (prev && prev.id) || uid(),
      key: def.key,
      label: def.label,
      section: def.section || null,
      showIf: def.showIf || null,
      val: (prev && prev.val) || null,
      comment: (prev && prev.comment) || '',
      open: !!(prev && prev.open),
      photos: (prev && prev.photos) || []
    };
  });
  // rows from an older version that don't match any key are kept last, no answer is lost
  old.forEach(c=>{ if(!used.has(c)) next.push({...c, key:c.key||null, section:c.section||'Other', showIf:null, photos:c.photos||[]}) });
  S.checks = next;
}

// "1103 C/O Miami". S.apt itself stays the bare number - the key register, the Dropbox folder

// `plain` drops the C/O for a file name, where a slash would be stripped to a blank anyway.
const realName = n => !!n && !/^lgh\b/i.test(String(n).trim());

const indexRow = s => ({id:s.id, address:s.address, apt:s.apt, aptName:s.aptName||'', type:s.type, created:s.created,
                        locked:!!(s.signedAt||s.closedAt), signed:!!s.signedAt, plan: planPending(s)});

async function flushSave(){
  if(!S) return;
  saveOpenComment(); saveCheckComments();   // capture text in open fields even in background mode
  const s = S;                               // hold the reference; S can be nulled while we wait
  clearTimeout(saveTimer);
  const ok = await store.set(K.insp(s.id), s);
  if(!ok) return storeErr();
  let idx;
  try{ idx = (await store.getStrict(K.index)) || [] }
  catch(e){ return }   // the read failed transiently - do NOT write back a truncated list
  const row = indexRow(s);
  const i = idx.findIndex(x=>x.id===s.id);
  if(i>=0) idx[i]=row; else idx.unshift(row);
  if(!await store.set(K.index, idx)) storeErr();
}

/* ---------- images ---------- */
const TARGET = 720*1024;
const bytesOf = d => Math.round((d.length - d.indexOf(',') - 1) * 0.75);
function draw(src,w,h,maxDim,q){
  const scale = Math.min(1, (maxDim||1600)/Math.max(w,h));
  const c = document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*scale)); c.height=Math.max(1,Math.round(h*scale));
  const ctx = c.getContext('2d',{alpha:false});
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,c.width,c.height);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', q||0.85);
}
async function decode(file){
  try{ return await withTimeout(createImageBitmap(file,{imageOrientation:'from-image'}), 15000) }catch(e){}
  try{ return await withTimeout(createImageBitmap(file), 15000) }catch(e){}
  try{ return await withTimeout(new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file) }), 15000) }catch(e){}
  return null;
}
async function compressFile(file){
  const src = await decode(file);
  if(!src) return null;
  const w = src.width||src.naturalWidth, h = src.height||src.naturalHeight;
  let maxDim=1800, q=0.86, out=draw(src,w,h,maxDim,q), n=0;
  while(bytesOf(out)>TARGET && n<6){
    n++;
    if(n===1) q = 0.8; else maxDim = Math.round(maxDim*0.85);
    out = draw(src,w,h,maxDim,q);
  }
  if(src.close) src.close();
  return {data:out, before:file.size, after:bytesOf(out)};
}
// Only a small thumbnail of each photo is kept in memory. A full photo is about 720 kB, and as
// a data URL in memory it is a third bigger again; an inspection with eighty photos held some
// 77 MB of text plus every decoded image, which is more than a phone gives one web page. The
// page was then killed by the phone, most often at the next big redraw. The full photo stays in
// the database and is read one at a time when the PDF, the gallery or a backup needs it.
const THUMB_MAX = 384, THUMB_Q = 0.72;
async function makeThumb(dataUrl){
  try{
    const im = await loadImg(dataUrl);
    return draw(im, im.naturalWidth, im.naturalHeight, THUMB_MAX, THUMB_Q);
  }catch(e){ return null }
}
// Reads one full photo from the database. The caller must let go of it before fetching the next.
async function getFull(pid, inspId){
  const id = inspId || (S && S.id); if(!id) return null;
  try{ return await store.get(K.photo(id, pid)) }catch(e){ return null }
}
const target = id => (S.rooms||[]).find(r=>r.id===id) || (S.checks||[]).find(c=>c.id===id) || (S.tech||[]).find(t=>t.id===id);
async function savePhoto(roomId, data){
  unlockIfLocked();
  const room = target(roomId), pid = uid();
  const ok = await store.set(K.photo(S.id,pid), data);
  if(!ok){ storeErr(); return false }
  const th = (await makeThumb(data)) || data;
  await store.set(K.thumb(S.id,pid), th);
  photoCache[pid] = th;
  room.photos.push({id:pid, ts:Date.now()});
  if(isPhotoRow(room)) room.val = 'ja';   // on a photo row the photo is the answer
  await flushSave();
  schedulePush();      // copy it to the server in a few seconds, without holding up the camera
  return true;
}
async function addPhotos(roomId, files){
  const list = [...files].filter(f=>!f.type || f.type.startsWith('image/'));
  if(!list.length) return;
  let before=0, after=0, fails=0, i=0;
  for(const f of list){
    i++;
    if(list.length>2) toast(`${T('Loading')} ${i} ${T('of')} ${list.length}`);
    try{
      const r = await compressFile(f);
      if(!r){ fails++; continue }
      const ok = await savePhoto(roomId, r.data);
      if(!ok){ fails++; continue }
      before+=r.before; after+=r.after;
      S.comp = S.comp || {in:0,out:0};
      S.comp.in += r.before; S.comp.out += r.after;
    }catch(e){ fails++ }
  }
  toast(`${list.length-fails} ${T('photos')} · ${mb(before)} ${T('to')} ${mb(after)}${fails?` · ${fails} ${T('could not be read')}`:''}`);
}
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t) }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2800);
}

  e.preventDefault();
  saveOpenComment(); saveCheckComments();
  const el = document.getElementById('rm_'+id); if(el) el.classList.remove('drop');
  if(dragRoomId){
    const from = S.rooms.findIndex(r=>r.id===dragRoomId), to = S.rooms.findIndex(r=>r.id===id);

    save(); render(); return;
  }
  const files = [...(e.dataTransfer.files||[])];

window.addEventListener('dragover', e=>e.preventDefault());

async function loadMedia(id){
  const ks = await store.keys('bp:ph:'+id+':');
  let miss = 0;
  for(const k of ks){
    const pid = k.split(':').pop();
    let th = await store.get(K.thumb(id,pid));
    if(!th){
      // A photo taken before thumbnails existed. Build one now and let go of the full photo
      // again straight away, so opening an old report never loads every image into memory.
      const full = await store.get(k);
      if(!full){ miss++; continue }
      th = await makeThumb(full);
      if(th) await store.set(K.thumb(id,pid), th); else th = full;
    }
    photoCache[pid] = th;
  }
  // Some images could not be read (e.g. iOS killed the IDB connection). Warn so the
  // report doesn't silently claim more photos than it carries - a reopen reloads them.
  if(miss) toast(miss+' '+(miss>1?T('photos'):T('photo'))+' '+T('could not be read — reopen the inspection'));
  if(S.video && S.video.stored){ const v = await store.get(K.video(id)); if(v) videoURL = v }
}

          <div style="font-size:14px;color:var(--ink2)">
            ${ja} ${T('yes')} · ${nej} ${T('no')} · ${na} ${T('not applicable')} · ${tom} ${T('unanswered')} · ${list.filter(c=>c.comment).length} ${T('comments')} · ${list.reduce((a,c)=>a+(c.photos?c.photos.length:0),0)} ${T('photos')}
          </div>
          <div class="hint">${T('Performed by')} ${esc(S.inspector.name||T('name missing'))}</div>
        </div>
        ${galleryCard()}
        ${avvik.length? `<div class="card">
          <div class="eyebrow" style="margin-bottom:8px">${T('Deviations')}</div>
          ${avvik.map(c=>

    app.innerHTML = topbar(locked?T('Finished'):T('Finish'),T('Step 3 of 3'),96,'leave()') + `<div class="wrap">

        <div style="font-size:14px;color:var(--ink2)">

        </div>

        <div class="hint">${needSig? T('Signature required for')+' '+esc(TYPE_LABEL[S.type]||S.type)+'.' : esc(TYPE_LABEL[S.type]||S.type)+' '+T('can be finished without a signature.')}</div>

      </div>`:''}
      <div class="card">

// headings are inserted where the section changes, with how far that section has progressed
function checkList(list){
  let out = '', sect = null;
  list.forEach(c=>{
    if(c.section && c.section !== sect){
      sect = c.section;
      const rows = list.filter(x=>x.section===sect);
      out += `<div class="csec"><span>${esc(T(sect))}</span>
        <span class="ccount">${rows.filter(x=>x.val).length}/${rows.length}</span></div>`;
    }
    out += checkRow(c);
  });
  return out;
}

function nextUnanswered(){
  saveCheckComments();
  const c = visibleChecks().find(x=>!x.val);
  if(!c) return toast(T('Everything is answered'));
  const el = document.getElementById('crow_'+c.id);
  if(!el) return;
  window.scrollTo({top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 96), behavior:'smooth'});
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'), 1600);
}

function checkRow(c){
  const bad = badAnswer(c);
  // The key-photo row has no text field at all (Erik, 2026-10-09: too much information) - only the button.
  const show = !isPhotoRow(c) && ((bad!=null && c.val===bad) || c.comment || c.open);
  const cls = v => c.val===v ? (v===bad ? ' on no' : v==='na' ? ' on na' : ' on') : '';
  const parent = c.showIf? checkByKey(c.showIf) : null;
  const photoRow = isPhotoRow(c), n = (c.photos||[]).length;
  // a photo row: the camera button takes the place of Yes and No
  const answers = photoRow
    ? `<button class="yn snap${c.val==='ja'?' on':''}" onclick="openCam('${c.id}')">${n? `${T('Take more')} (${n})` : T('Take photo')}</button>
        <button class="yn${cls('na')}" onclick="setCheck('${c.id}','na')">${T('N/A')}</button>`
    : `<button class="yn${cls('ja')}" onclick="setCheck('${c.id}','ja')">${T('Yes')}</button>
        <button class="yn${cls('nej')}" onclick="setCheck('${c.id}','nej')">${T('No')}</button>
        <button class="yn${cls('na')}" onclick="setCheck('${c.id}','na')">${T('N/A')}</button>`;
  return `<div class="crow${show?' open':''}${c.showIf?' child':''}" id="crow_${c.id}">
    ${parent? `<div class="cwhen">${T('Follow-up')} · ${esc(T(parent.label))} = ${T('Yes')}</div>`:''}
    <div class="clabel">${esc(T(c.label))}</div>
    <div class="cbtns">
      <span class="ynrow">
        ${answers}
      </span>
      <span class="clinks">
        ${c.key==='internet'? `<button class="wifibtn" onclick="measureWifi('${c.id}')">${T('Measure wifi')}</button>`:''}
        ${photoRow? '' : `<button class="addc" onclick="openCheckComment('${c.id}')">${T('Comment')}</button>`}
        ${photoRow? '' : `<button class="addc" onclick="openCam('${c.id}')">${T('Photo')}</button>`}
      </span>
    </div>
    ${c.key==='internet'? `<div class="hint">${T("Make sure the phone is on the apartment's wifi.")}</div>`:''}
    ${show?`<input id="k_${c.id}" class="cinput" value="${esc(c.comment)}" placeholder="${T('Comment')}">`:''}
    ${isPhotoRow(c) && canHandover() ? inspKeyCard() : ''}
    ${c.photos && c.photos.length? `<div class="thumbs">
      ${c.photos.map(ph=>`<div class="thumb"><img src="${photoCache[ph.id]||''}" alt="">
          <div class="x" onclick="delPhoto('${c.id}','${ph.id}')">×</div></div>`).join('')}
    </div>`:''}
  </div>`;
}
// The installations and equipment on a new property. The rows look like the checklist's photo row:
// one wide photo button, a comment behind a link. An item the inspector added can be removed again.
function techSection(){
  return `<div class="csec"><span>${T('Installations and equipment')}</span>
      <span class="ccount">${techFilled().length}/${techItems().length}</span></div>
    <div class="hint" style="margin:-4px 3px 12px">${T('Examples of things that can be good to photograph. Take what is relevant for the property – all items are optional.')}</div>
    ${techItems().map(techRow).join('')}
    <div class="card">
      <div class="eyebrow" style="margin-bottom:9px">${T('Add your own item')}</div>
      <div class="addrow">
        <input id="newtech" placeholder="${T('Custom name')}" onkeydown="if(event.key==='Enter')addTech()">
        <button class="btn small" onclick="addTech()">${T('Add')}</button>
      </div>
    </div>`;
}
function techRow(t){
  const n = (t.photos||[]).length, open = !!(t.comment || t.open);
  return `<div class="crow${open?' open':''}" id="crow_${t.id}">
    <div class="clabel">${esc(techName(t))}</div>
    <div class="cbtns">
      <span class="ynrow">
        <button class="yn snap${n?' on':''}" onclick="openCam('${t.id}')">${n? `${T('Take more')} (${n})` : T('Take photo')}</button>
      </span>
      <span class="clinks">
        <button class="addc" onclick="openCheckComment('${t.id}')">${T('Comment')}</button>
        ${t.key? '' : `<button class="addc" onclick="delTech('${t.id}')">${T('Remove')}</button>`}
      </span>
    </div>
    ${open? `<input id="k_${t.id}" class="cinput" value="${esc(t.comment)}" placeholder="${T('Comment')}">`:''}
    ${n? `<div class="thumbs">
      ${t.photos.map(ph=>`<div class="thumb"><img src="${photoCache[ph.id]||''}" alt="">
          <div class="x" onclick="delPhoto('${t.id}','${ph.id}')">×</div></div>`).join('')}
    </div>`:''}
  </div>`;
}
function addTech(){
  const el = document.getElementById('newtech'); if(!el || !el.value.trim()) return;
  const name = el.value.trim(); el.value = '';
  saveOpenComment(); saveCheckComments(); unlockIfLocked();
  S.tech = techItems().concat({id:uid(), key:null, name, comment:'', open:false, photos:[]});
  save(); render();
}
function delTech(id){
  const t = techItems().find(x=>x.id===id); if(!t || t.key) return;
  saveOpenComment(); saveCheckComments();
  if((t.photos.length || t.comment) && !confirm(`${T('Remove')} ${t.name} ${T('with contents?')}`)) return;
  unlockIfLocked();
  t.photos.forEach(p=>{ store.del(K.photo(S.id,p.id)); store.del(K.thumb(S.id,p.id)); delete photoCache[p.id] });
  S.tech = techItems().filter(x=>x.id!==id);
  save(); render();
}
// Locks a new property. Nothing has to be filled in first, and nobody signs.
async function finishNewProp(){
  saveOpenComment(); saveCheckComments();
  if(S.closedAt) return;
  S.closedAt = Date.now();
  log('New property finished');
  log('Report locked');
  await flushSave(); render();
}
function saveCheckComments(){
  if(!S) return false;
  let changed = false;
  commentItems().forEach(c=>{
    const el = document.getElementById('k_'+c.id);
    if(el && el.value !== c.comment){ c.comment = el.value; changed = true }
  });
  return changed;
}
function setCheck(id,v){
  saveCheckComments();
  const c = S.checks.find(x=>x.id===id);
  c.val = c.val===v? null : v;
  // taking N/A back off a photo row that has photos: the photos are its answer again
  if(!c.val && isPhotoRow(c) && (c.photos||[]).length) c.val = 'ja';
  unlockIfLocked();
  save(); render();
}
function openCheckComment(id){
  const open = document.getElementById('k_'+id);
  if(open) return open.focus();
  saveOpenComment(); saveCheckComments();
  const c = commentItems().find(x=>x.id===id); if(!c) return;
  c.open = true;
  render();
  const el = document.getElementById('k_'+id); if(el) el.focus();
}

        <div style="max-width:310px;line-height:1.5">

async function startStream(startVideo){
  const fb = document.getElementById('camfb');
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw Object.assign(new Error('no api'), {name:'NoApi'});
    }
    cam.stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}, width:{ideal:1920}}
    });
    const v = document.getElementById('camview');
    v.srcObject = cam.stream; await v.play();
    if(fb) fb.classList.add('hidden');
    document.getElementById('camshot').style.opacity=1;
    document.getElementById('camrecbtn').style.opacity=1;

      document.getElementById('camerr').textContent = camReason(e);
    }
    document.getElementById('camshot').style.opacity=.3;

    return false;
  }
}
function camReason(e){
  const n = e && e.name;
  if(n==='NotAllowedError') return T('The phone denied access. Open Settings, Safari, Camera and choose Allow for this address. If you run the app from the home screen you may need to remove the icon and add it again afterwards.');
  if(n==='NotFoundError' || n==='OverconstrainedError') return T('No camera was found on the device.');
  if(n==='NotReadableError') return T('The camera is in use by another app right now. Close it and try again.');
  if(n==='SecurityError' || n==='NoApi') return T('The camera requires a secure address. Open the app via https, not as a local file.');
  return T('Unknown error') + (n? ' ('+n+')' : '') + T('. Use the buttons below for now.');
}
async function retryCam(){ await startStream(false) }
async function ensureAudio(){
  if(!cam.stream || cam.stream.getAudioTracks().length) return;

    const a = await navigator.mediaDevices.getUserMedia({audio:true});
    a.getAudioTracks().forEach(t=>cam.stream.addTrack(t));
  }catch(e){}
}
// On a new property the camera steps through the rooms and then the equipment items.
const camItems = () => (isCheck()? visibleChecks() : (S.rooms || [])).concat(showTech()? techItems() : []);
const curRoom = () => camItems()[cam.idx];
const shortName = t => (t||'').length>24? t.slice(0,23)+'…' : (t||'');
function paintCam(){

// MP4 first (iPhone always, Chrome on Android and desktop in newer versions), WebM only when that
// is all the phone records.
function recMime(){
  try{
    if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';
  }catch(e){ return '' }
}
async function toggleRec(){
  if(!cam.stream) return;
  const btn = document.getElementById('camrecbtn'), lab = document.getElementById('camrec');
  if(cam.rec){ cam.rec.stop(); return }
  await ensureAudio();
  try{
    cam.chunks=[];
    const mime = recMime();
    const mr = new MediaRecorder(cam.stream, mime ? {videoBitsPerSecond:900000, mimeType:mime} : {videoBitsPerSecond:900000});
    mr.ondataavailable = e => e.data.size && cam.chunks.push(e.data);
    mr.onstop = async ()=>{
      clearInterval(cam.timer); cam.rec=null;
      btn.classList.remove('on'); lab.classList.add('hidden');
      await saveVideo(new Blob(cam.chunks,{type:mr.mimeType}), Math.round((Date.now()-cam.t0)/1000));
      paintCam();
    };
    mr.start(1000); cam.rec=mr; cam.t0=Date.now();
    btn.classList.add('on'); lab.classList.remove('hidden');
    cam.timer = setInterval(()=>{
      const s = Math.round((Date.now()-cam.t0)/1000);
      lab.textContent = `REC ${Math.floor(s/60)}:${pad(s%60)}`;
      if(s>=180) cam.rec && cam.rec.stop();
    },500);
  }catch(e){ alert(T('Video recording is not supported in this browser.')) }
}
async function saveVideo(blob, dur){
  unlockIfLocked();
  if(videoURL && videoURL.startsWith('blob:')) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(blob);
  // Its own id (2026-10-16): with one fixed id a re-recorded video counted as already uploaded
  // and never reached the gallery or Dropbox. A video saved before keeps the id 'video'.
  S.video = {id:'video-' + uid(), ts:Date.now(), size:blob.size, dur:dur||null, stored:false, type:blob.type||''};
  // Above this the base64 string gets so large that the mobile tab can OOM-crash during saving.
  const limit = NATIVE ? 3.4*1048576 : 60*1048576;
  if(blob.size < limit){
    try{
      const data = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob) });
      if(await store.set(K.video(S.id), data)){ S.video.stored = true; videoURL = data }
    }catch(e){}
  }
  save();
  schedulePush();
}
function delVideo(){
  if(!confirm(T('Remove the video?'))) return;
  unlockIfLocked();
  store.del(K.video(S.id)); S.video=null; videoURL=null; save(); render();
}
function closeCam(){
  cam.open=false;
  if(cam.rec) try{cam.rec.stop()}catch(e){}
  clearInterval(cam.timer);
  if(cam.stream) cam.stream.getTracks().forEach(t=>t.stop());
  cam.stream=null;
  const el=document.getElementById('cam'); if(el) el.remove();
  render();
}

/* ---------- signature ---------- */
function sigBlock(who){
  const s = S.sig[who];
  if(s && s.remote) return `<div class="sigdone" style="padding:13px">
      <div style="font-size:14px"><b>${esc(s.name||T('The counterparty'))}</b> ${T('signed digitally via signing link')}</div>
      <div class="hint" style="font-family:var(--mono);font-size:11px;margin-top:4px">${stamp(new Date(s.ts))}</div>
    </div>
    <div class="hint">${T('Already emailed to longstay@beaps.se.')}</div>`;
  if(s) return `<div class="sigdone"><img src="${s.data}" alt="signature"></div>
    <div class="hint" style="font-family:var(--mono);font-size:11px">${T('Signed')} ${stamp(new Date(s.ts))}</div>`;
  return `<canvas class="sigpad" id="pad_${who}"></canvas>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn ghost small" onclick="clearPad('${who}')">${T('Clear')}</button>
      <button class="btn small" onclick="commitPad('${who}')">${T('Approve signature')}</button>
    </div>`;
}
const pads = {};
function initPad(who){
  const c = document.getElementById('pad_'+who); if(!c) return;
  const dpr = window.devicePixelRatio||1, r = c.getBoundingClientRect();
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x = c.getContext('2d'); x.scale(dpr,dpr);
  x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#16325C';
  let drawing=false, empty=true;
  const pt = e => { const b=c.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top] };
  c.addEventListener('pointerdown', e=>{ drawing=true; empty=false; c.setPointerCapture(e.pointerId); const[a,b]=pt(e); x.beginPath(); x.moveTo(a,b) });
  c.addEventListener('pointermove', e=>{ if(!drawing)return; const[a,b]=pt(e); x.lineTo(a,b); x.stroke() });
  c.addEventListener('pointerup', ()=>drawing=false);
  c.addEventListener('pointercancel', ()=>drawing=false);
  pads[who]={c, isEmpty:()=>empty, reset:()=>{ x.clearRect(0,0,c.width,c.height); empty=true }};
}
function clearPad(w){ pads[w] && pads[w].reset() }
async function sendToCamilla(){
  saveCheckComments();
  // unanswered items may be sent as they are, the count is in the summary and in the PDF
  if(!S.closedAt){ S.closedAt = Date.now(); log('Upplåsning finished'); await flushSave(); render() }
  await ensureGalleryUploaded();
  toast(T('Building PDF'));
  const out = await buildPdf();
  if(!out) return legacyPrint();
  toast(T('Sending'));
  const m = await mailPdf(out.blob, out.name);
  if(m.ok){ toast(T('Emailed to') + ' ' + mailTarget()); return }
  if(m.reason==='login') return toast(T('Log in and send again'));
  if(m.reason==='quota') toast(T('Daily email limit reached, opening share'));
  else if(m.reason==='size') toast(T('Too large for email, opening share'));
  else if(m.reason==='ladda om') toast(T('Reload the app — opening share'));
  else toast(T('The email did not go through, opening share'));
  await sharePdf(out.blob, out.name);
}
function closeUnsigned(){
  const needSig = S.type==='Inflytt' || S.type==='Utflytt';
  const msg = needSig
    ? `${T('Signature is normally required for')} ${TYPE_LABEL[S.type]||S.type}. ${T('Finish without a signature anyway?')}`
    : T('Finish the report without a signature?');
  if(!confirm(msg)) return;
  // "Without a signature" answers for any ink on a pad that was never approved: it is dropped
  // here, so a later Share or Email cannot turn it into a signature on a finished report.
  delete pads.inspector; delete pads.counter;
  S.closedAt = Date.now();
  log('Finished without signature');
  log('Report locked');
  flushSave(); render();
}
function unlock(){
  const q = S.signReq;
  const active = q && (q.status==='pending' || q.status==='expired');
  if(active && !confirm(T('There is a signing link that has been sent out. If you unlock it, it is revoked, and you get to send a new link once the report is changed. Continue?'))) return;
  if(!active && !confirm(isCheck()? T('Unlock the list so it can be changed again?')
                        : isNewProp()? T('Unlock the report so it can be changed again?')
                        : T('Unlock the report? The signatures are removed and it is noted in the log.'))) return;
  if(q && q.token) revokeSignLink(q.token);   // even already signed ones: the token must not be signable again
  S.signReq = null;
  S.signedAt = null; S.closedAt = null; S.sig = {};
  log(isCheck()? 'List unlocked' : isNewProp()? 'Report unlocked' : 'Report unlocked, signatures removed');
  flushSave(); view='rooms'; render(); window.scrollTo(0,0);
}
function commitPad(w){
  const p = pads[w];
  if(!p || p.isEmpty()) return alert(T('Draw the signature in the box first.'));
  S.sig[w] = {data:p.c.toDataURL('image/png'), ts:Date.now()};
  log(`Signed by ${w==='inspector'? (S.inspector.name||'inspector') : (S.counter.name||'counterparty')}`);
  const bada = !!(S.sig.inspector && S.sig.counter);
  if(bada && !S.signedAt){ S.signedAt=Date.now(); log('Report locked') }
  save();
  delete pads[w];
  // Redraw ONLY the box that was approved. A full redraw would erase the other
  // party's started signature, which hasn't been approved yet — if you're standing with
  // the tenant and both are signing, the other one would have to redo it.
  // If both are done the report is locked, and then there is nothing started to lose.
  if(bada) return render();
  const box = document.getElementById('sigbox_'+w);
  if(box) box.innerHTML = sigBlock(w); else render();
}
// A signature that has been drawn but not yet approved is still a signature. When the report
// is emailed, shared or sent for signing, keep it — before this the ink was silently dropped
// and the PDF went out with empty signature lines.
function commitPendingPads(list){
  if(!S) return 0;
  let n = 0;
  for(const w of (list || ['inspector','counter'])){
    const p = pads[w];
    // A pad whose canvas is no longer on the screen belongs to a view that has been painted
    // over, or to a report that was finished without it: its ink is not a signature.
    if(!p || p.isEmpty() || S.sig[w] || !document.body.contains(p.c)) continue;
    S.sig[w] = {data:p.c.toDataURL('image/png'), ts:Date.now()};
    log(`Signed by ${w==='inspector'? (S.inspector.name||'inspector') : (S.counter.name||'counterparty')}`);
    delete pads[w]; n++;
    const box = document.getElementById('sigbox_'+w);
    if(box) box.innerHTML = sigBlock(w);
  }
  if(!n) return 0;
  if(S.sig.inspector && S.sig.counter && !S.signedAt){ S.signedAt = Date.now(); log('Report locked'); render() }
  save();
  toast(T('Signature saved'));
  return n;
}

/* ---------- wifi measurement ----------
   Removed 2026-10-09 (65e38c5) on Erik's word, back 2026-10-13 for the shortstay checklist only:
   the button on "Does the internet work?". The result goes into that row's comment, which the
   PDF prints with the row. The rooms' Internet card (S.wifi) stays out; old values are kept. */
// Measures against Beaps' own functions (functions/api/speed-*), no third-party service involved.
// The numbers are an assessment of the phone -> internet connection, not a lab measurement:
// they reflect what a guest actually gets out of the network, which is what we want to know.
const WIFI_DOWN = 4*1024*1024, WIFI_UP = 2*1024*1024, WIFI_PINGS = 5;
// matches exactly one previous measurement and nothing more, so a handwritten comment after it survives
const MATNING = /^Down .*?Latency \d+ ms(?: · mobile data)?/;
let measuring = false;

async function pingOnce(){
  const t = performance.now();
  const r = await withTimeout(fetch('/api/speed-ping?x='+uid(), {cache:'no-store'}), 8000);
  if(!r.ok) throw new Error('ping ' + r.status);
  await r.text();
  return performance.now() - t;
}

async function measureDown(){
  const tReq = performance.now();
  const r = await withTimeout(fetch('/api/speed-down?bytes='+WIFI_DOWN+'&x='+uid(), {cache:'no-store'}), 45000);
  if(!r.ok || !r.body) throw new Error('down');
  const reader = r.body.getReader();
  let bytes = 0, t0 = 0;
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    if(!t0) t0 = performance.now();   // the clock starts on the first byte, not on the connection
    bytes += value.length;
  }
  const end = performance.now();
  if(bytes < WIFI_DOWN * 0.9) return null;          // cut short: no honest number
  // On a very fast network 4 MB lands in under 50 ms after the first byte, too short to time;
  // then the clock from the request is used, which can only come out lower, never flattering.
  let s = (end - t0)/1000;
  if(s <= 0.05) s = (end - tReq)/1000;
  return s > 0 ? (bytes*8)/s/1e6 : null;
}

async function measureUp(){
  const buf = new Uint8Array(WIFI_UP);
  for(let i=0;i<buf.length;i+=65536) crypto.getRandomValues(buf.subarray(i, Math.min(i+65536, buf.length)));
  const t0 = performance.now();
  const r = await withTimeout(fetch('/api/speed-up?x='+uid(), {method:'POST', body:buf, cache:'no-store'}), 45000);
  if(!r.ok) throw new Error('up');
  const j = await r.json();
  if(!j || j.bytes !== WIFI_UP) return null;        // the server did not get it all
  const s = (performance.now() - t0)/1000;           // from the request: includes the round trip, never flattering
  return s > 0 ? (WIFI_UP*8)/s/1e6 : null;
}

async function measureWifi(id){
  if(measuring) return toast(T('A measurement is already running'));
  if(!S || !S.checks) return;
  const insp = S;                    // the measurement takes seconds, the user may switch inspection in the meantime
  const c = S.checks.find(x=>x.id===id);
  if(!c) return;
  measuring = true;
  saveCheckComments();
  try{
    toast(T('Measuring latency'));
    const pings = [];
    for(let i=0;i<WIFI_PINGS;i++){ try{ pings.push(await pingOnce()) }catch(e){} }
    if(!pings.length) throw new Error('no contact');
    pings.sort((a,b)=>a-b);
    const latens = Math.round(pings[Math.floor(pings.length/2)]);

    toast(T('Measuring download'));
    const ned = await measureDown();
    toast(T('Measuring upload'));
    const upp = await measureUp().catch(()=>null);

    // another inspection opened in the meantime: don't write the result in the wrong place
    if(S !== insp){ measuring = false; return toast(T('Measurement cancelled, you switched inspection')) }

    // short enough to be shown in full in the comment field. The time is deliberately omitted,
    // it is in the activity log that follows along in the PDF.
    const bit = v => v==null? '?' : (v>=10? String(Math.round(v)) : v.toFixed(1));
    const conn = navigator.connection;
    const mobil = conn && conn.type === 'cellular';
    const rad = `Down ${bit(ned)} · Up ${bit(upp)} Mbit/s · Latency ${latens} ms`
              + (mobil? ' · mobile data' : '');

    // keep any handwritten comment, only replace a previous measurement. Read the fields again
    // first: the comment may have been typed into while the measurement ran.
    saveCheckComments();
    const rest = (c.comment||'').replace(MATNING,'').replace(/^\s*[—·-]\s*/,'').trim();
    c.comment = rad + (rest? ' — ' + rest : '');
    unlockIfLocked();
    // Yes only for a whole measurement, and only when nobody has answered yet: a "?" in it, or
    // an answer already given, is left for the inspector to judge.
    const whole = ned != null && upp != null && !mobil;   // mobile data says nothing about the wifi
    if(whole && !c.val) c.val = 'ja';
    c.open = true;
    log(`Wifi measured: down ${bit(ned)} / up ${bit(upp)} Mbit/s, ${latens} ms`);
    save(); render();
    toast(whole ? T('Measurement done') : mobil ? T('Measured on mobile data, not wifi') : T('Measurement incomplete'));
  }catch(e){
    toast(T('Could not measure wifi right now'));
  }
  measuring = false;
}

/* ---------- gallery: photos and video in full resolution ---------- */
// The PDF must fit in an email, so the photos are squeezed hard there - with a hundred photos
// it becomes ten kilobytes each and can't be zoomed in. The gallery instead uploads
// the photos as they are on the phone and puts a link in the report. The video can
// never be played in a PDF at all, so this is the only way for it.
let uploading = false;

const galleryItems = () => {
  const ut = [];

  barare.forEach(b=>{
    (b.photos||[]).forEach((p,i)=>{

    });

const dataUrlToBlob = async d => (await fetch(d)).blob();

// Dropbox filing, one folder per inspection in one of three branches:
//   Longstay PICTURES / MOVE IN    / "MIN - <address> <apt> <date> <id>"
//   Longstay PICTURES / MOVE OUT   / "MOU - <address> <apt> <date> <id>"
//   Longstay PICTURES / NYA OBJEKT / "NYTT - <address> <apt> <date> <id>"
// The date is the day the inspection was created and the id is the inspection's own, so two
// inspections of one apartment never share a folder and a later upload finds the same one. Until
// 2026-10-09 the name was "MIN - <address> <apt> <tenant>": two move-ins of one apartment by one
// tenant, or any inspections photographed before an address was typed, landed in one folder. An
// inspection already filed under such a name keeps it, so its folder and its link stay put.
// Shortstay and the old annual and damage types are not filed. The server owns the
// "Longstay PICTURES" part and accepts only these three branches, so nothing here can write elsewhere.
const DBX_PARENT = {Inflytt:'MOVE IN', Utflytt:'MOVE OUT', [NEW_PROPERTY]:'NYA OBJEKT'};
// The video's id in the gallery: its own per recording since 2026-10-16, 'video' before that.
const videoId = insp => (insp && insp.video && insp.video.id) || 'video';
const DBX_CODE = {Inflytt:'MIN', Utflytt:'MOU', [NEW_PROPERTY]:'NYTT'};
const dayOf = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` };
function dropboxSubfolder(){
  if(!S) return null;
  // Historical folders can contain more than one inspection. Never rename one implicitly,
  // even when the address, counterparty or inspection type has subsequently changed.
  const filed = S.dropbox && S.dropbox.subfolder;
  if(filed && !filed.endsWith(' ' + S.id)) return filed;
  const parent = DBX_PARENT[S.type];
  if(!parent) return null;
  const clean = x => String(x==null?'':x).replace(/[\\/]+/g,'-')
    .replace(/[:?*<>"|\u0000-\u001F]+/g,' ').replace(/\s+/g,' ').trim();
  const suffix = ' ' + dayOf(S.created) + ' ' + S.id;
  // The server caps each path component at 120 characters. Reserve the identity suffix
  // before shortening the address so two long addresses cannot collapse into one folder.
  const label = [DBX_CODE[S.type] + ' -', clean(S.address), clean(S.apt)].filter(Boolean).join(' ');
  return parent + '/' + label.slice(0,120-suffix.length).trimEnd() + suffix;
}

// Which photos already have a copy on the server. The ids are kept on the inspection, so the
// list survives a reload and a phone that was switched off in the middle of a job.
const galleryDone = () => new Set((S && S.gallery && S.gallery.done) || []);
const pendingItems = () => { const d = galleryDone(); return galleryItems().filter(it=>!d.has(it.id)) };

// Photos are copied to the server a few seconds after they are taken, not when the report is
// sent. Waiting for the send is what made a lost or cleared phone take a whole inspection with
// it. It is the same bytes either way, only sent earlier, so it costs no extra data.
let pushTimer = null;
function schedulePush(){
  if(!S) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{
    if(uploading || !S || !pendingItems().length) return;
    if(navigator.onLine === false) return;      // it will be retried at the next photo, or on reconnect
    uploadGallery(true, true);
  }, 4000);
}
window.addEventListener('online', ()=>{ if(S) schedulePush() });

async function ensureGalleryUploaded(){
  if(!S) return;
  if(pendingItems().length) await uploadGallery(true);
  await tidyGallery();
}

// A photo that was taken and then deleted may already have been copied to the server. Before the
// report goes out, tell the server which photos actually remain so a deleted one never reaches
// the recipient. Best effort: it must never stop a report from being sent.
async function tidyGallery(){
  if(!S || !S.gallery || !S.gallery.token) return;
  const insp = S;
  // Retention is based on saved references, never on thumbnail availability or current type.
  // A temporary read failure or switching between checklist and rooms is not a deletion.
  const ids = [...new Set((insp.rooms||[]).concat(insp.checks||[], insp.tech||[])
    .flatMap(item=>(item.photos||[]).map(p=>p.id)))];
  if(insp.video) ids.push(videoId(insp));
  if(!ids.length) return;
  const done = (insp.gallery.done||[]);
  const bortagna = done.some(id=>ids.indexOf(id)<0);
  const sub = dropboxSubfolder();
  const bytt = !!(insp.dropbox && sub && sub !== insp.dropbox.subfolder);
  // The gallery was made while the type had no Dropbox branch (a shortstay changed to a new
  // property, say): ask the server to file it now.
  const saknas = !!(sub && !insp.dropbox);
  if(!bortagna && !bytt && !saknas) return;       // nothing removed, renamed or missing
  try{
    const r = await withTimeout(fetch('/api/media-sync', {
      method:'POST', headers:{'Content-Type':'application/json', ...AUTH},
      body: JSON.stringify({ t: insp.gallery.token, ids, subfolder: sub })
    }), 20000);
    if(!r.ok) return;
    const j = await r.json().catch(()=>null);
    if(!j || !j.ok || S !== insp || !S.gallery) return;
    S.gallery.done = done.filter(id=>ids.indexOf(id)>=0);
    S.gallery.count = S.gallery.done.length;
    // the folder may have been renamed to match a corrected address, which gives a new link
    if(j.dropbox && j.dropbox.url) S.dropbox = {url:j.dropbox.url, path:j.dropbox.path, subfolder:j.dropbox.subfolder};
    if(j.removed) log(`Deleted photos removed from the gallery: ${j.removed}`);
    // A folder made just now is empty: the photos already on the server go up once more, in the
    // background, and on the way through they are copied into it. The report itself is not held up.
    if(j.attached){
      log('Filed in Dropbox: ' + ((j.dropbox && j.dropbox.subfolder) || sub));
      S.gallery.done = [];
      S.gallery.count = 0;
      schedulePush();
    }
    await flushSave();
  }catch(e){}
}
// tyst = running by itself in the background while the inspection is under way: no toasts and
// no log line, because a moment without coverage is normal and will be retried. A failure at
// send time, where it matters, is still both shown and written into the report.
async function uploadGallery(auto, tyst){
  if(uploading){ if(auto) return; return toast(T('An upload is already running')) }
  if(!S) return;
  const items = pendingItems();
  if(!items.length){ if(!auto) toast(T('The photos are uploaded')); return }

  const insp = S;
  const säg = m => { if(!tyst) toast(m) };
  uploading = true;
  const pause = ms => new Promise(res=>setTimeout(res, ms));
  try{
    säg(`${T('Preparing')} ${items.length} ${T('files')}`);
    // The gallery is made once and then kept. Later photos are added to the one that exists,
    // so a report has a single link no matter how the photos were taken.
    let g = (insp.gallery && insp.gallery.token) ? {token:insp.gallery.token, url:insp.gallery.url} : null;
    if(!g){
      // One retry on a dropped connection: mobile networks drop the first request after idle now and then.
      let r;
      for(let attempt=0;;attempt++){
        try{
          r = await withTimeout(fetch('/api/media-init', {
            method:'POST', headers:{'Content-Type':'application/json', ...AUTH},
            body: JSON.stringify({ ref:ref(), type:S.type, address:S.address, apt:aptLabel(S.apt, S.aptName),
              inspector:S.inspector.name, items, subfolder: dropboxSubfolder() })
          }), 30000);
          break;
        }catch(e){ if(attempt) throw new Error('No contact with the server'); await pause(1500) }
      }
      if(r.status===401) throw new Error(loginNeeded(r)? 'Log in and try again' : 'Reload the app and try again');
      // Cloudflare responds with the app's own HTML on unknown /api paths, not with 404.
      // So don't trust the status code alone - try to parse the response and see if it carries a token.
      const svar = (await r.text().catch(()=>'')).trim();
      let j = null;
      try{ j = JSON.parse(svar) }catch(e){}
      if(!j || !j.token){
        const kort = (svar && svar.length<160 && svar.indexOf('<')<0)? svar : '';
        throw new Error(!j? 'The gallery is not running on the server yet'
                      : (kort || 'The server responded ' + r.status));
      }
      g = {token:j.token, url:j.url};
      if(S !== insp){ uploading = false; return }
      insp.gallery = {token:g.token, url:g.url, done:[], count:0, n:0, ts:Date.now()};
      // Where the inspection was filed in Dropbox, when Dropbox is set up on the server.
      if(j.dropbox && j.dropbox.url){
        insp.dropbox = {url:j.dropbox.url, path:j.dropbox.path, subfolder:j.dropbox.subfolder};
        log('Filed in Dropbox: ' + (j.dropbox.subfolder || j.dropbox.path));
      }
      await flushSave();
    }

    let klara = 0, missade = 0, sist = '';
    for(const it of items){
      if(S !== insp){ uploading = false; return säg(T('Upload cancelled, you switched inspection')) }
      let ok = false;
      // Each file gets a second try after a short pause. A gallery made a moment ago can take a few
      // seconds to reach every Cloudflare edge, so the first upload may be answered
      // "Gallery not found" - and mobile connections drop requests now and then.
      for(let attempt=0; attempt<2 && !ok; attempt++){
        if(attempt) await pause(1500);
        try{
          // The full photo is fetched here and released again on the next turn of the loop —
          // photoCache only holds thumbnails, and the gallery must have the real thing.
          const src = it.kind==='video' ? videoURL : await getFull(it.id);
          if(!src) throw new Error('The photo could not be read');
          const blob = await dataUrlToBlob(src);
          // Name and kind travel with the file: a photo sent mid-inspection is not in the
          // manifest yet, so this is what gives it its room name in the gallery.
          const q = `t=${g.token}&id=${encodeURIComponent(it.id)}&name=${encodeURIComponent(it.name||'')}`
                  + `&kind=${it.kind==='video'?'video':'bild'}&ts=${it.ts||0}`;
          const put = await withTimeout(fetch('/api/media-put?'+q, {
            method:'PUT', headers:{'Content-Type': blob.type || 'application/octet-stream', ...AUTH}, body: blob
          }), it.kind==='video' ? 600000 : 120000);
          ok = put.ok;
          if(!ok) sist = (await put.text().catch(()=>'')).trim().slice(0,80) || ('status ' + put.status);
          // The video in Dropbox: the server says whether the copy there worked. A failed copy is
          // tried again on the next upload, up to three times; after that the report links to the
          // app's own gallery, where the video is, instead of a Dropbox folder without it.
          if(ok && it.kind==='video' && insp.video){
            const pj = await put.json().catch(()=>null);
            const d = pj && pj.dropbox;
            if(d === 'ok'){ insp.video.dbx = 'ok'; insp.video.dbxFails = 0 }
            else if(d === 'failed'){
              insp.video.dbxFails = (insp.video.dbxFails || 0) + 1;
              if(insp.video.dbxFails < 3){ ok = false; sist = 'Dropbox' }
              else { insp.video.dbx = 'failed'; if(!tyst) log('Video could not be copied to Dropbox; the report links to the gallery instead') }
            }
          }
        }catch(e){ sist = String(e && e.message || e).slice(0,80) }
      }
      if(ok){
        klara++;
        if(S === insp && insp.gallery){
          insp.gallery.done = (insp.gallery.done||[]).concat(it.id);
          insp.gallery.count = insp.gallery.done.length;
          insp.gallery.ts = Date.now();
        }
      } else missade++;
      if(klara % 5 === 0 || klara + missade === items.length) säg(`${T('Uploading')} ${klara+missade} ${T('of')} ${items.length}`);
    }

    if(!klara) throw new Error('No file could be uploaded' + (sist? ': ' + sist : ''));
    if(S === insp && insp.gallery){
      insp.gallery.n = pendingItems().length? -1 : galleryItems().length;
      if(!tyst) log(`Photos uploaded: ${klara} of ${items.length}${missade? ', '+missade+' failed':''}`);
      await flushSave();
    }
    if(!auto) render();
    säg(missade? `${T('Done, but')} ${missade} ${T('files failed')}` : T('The photos are uploaded'));
  }catch(e){
    const why = String(e && e.message || e).slice(0,120);
    säg(T(why).slice(0,80));   // the log keeps the English; the toast may be Swedish
    // Into the activity log as well, so the reason ends up in the report and not only in a toast
    // that vanished while the inspector was looking at the camera.
    if(S === insp && !tyst) log('Photo upload failed: ' + why);
  }
  uploading = false;
}

/* ---------- remote signing ---------- */
const okMail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((s||'').trim());

function signReqCard(){
  const q = S.signReq;
  // The counterparty already signed (on the pad or via a link) and no link is out ->
  // external signing makes no sense, so don't offer it.
  if(!q && S.sig && S.sig.counter) return '';
  if(!q) return `<div class="card">
    <div class="eyebrow" style="margin-bottom:10px">${T('The counterparty is not present')}</div>
    <button class="btn ghost" onclick="openSignRequest()">${T('The guest cannot sign now')}</button>
    <div class="hint">${T('Emails a link where the counterparty sees the whole report and signs in the browser.')}</div>
  </div>`;

  if(q.status==='signed') return `<div class="card">
    <div class="eyebrow" style="margin-bottom:8px">${T('Remote signing')}</div>
    <span class="locknote">${T('Signed')} ${stamp(new Date(q.signedAt||Date.now()))}</span>
    <div class="hint">${esc(q.signedName||q.name||T('The counterparty'))} ${T('signed via the link that was sent to')}
      ${esc(q.to)}. ${T('The report has been emailed to longstay@beaps.se with a copy to the recipient.')}</div>
  </div>`;

  if(q.status==='cancelled') return `<div class="card">
    <div class="eyebrow" style="margin-bottom:8px">${T('Remote signing')}</div>
    <div style="font-size:14px;color:var(--ink2)">${T('The link to')} ${esc(q.to)} ${T('is revoked.')}</div>
    <button class="btn ghost small" style="margin-top:12px" onclick="openSignRequest()">${T('Send a new link')}</button>
  </div>`;

  const utgangen = linkExpired(q);
  return `<div class="card">
    <div class="eyebrow" style="margin-bottom:8px">${T('Remote signing')}</div>
    <h2 style="margin:0 0 6px">${utgangen? T('The link has expired') : T('Awaiting signature')}</h2>
    <div style="font-size:14px;color:var(--ink2)">
      ${T('Sent to')} ${esc(q.to)}${q.cc? ', '+T('copy')+' '+esc(q.cc):''}<br>${stamp(new Date(q.sentAt))}${q.expires? ' · '+T('valid until')+' '+stamp(new Date(q.expires)):''}
    </div>
    <div class="hint">${T('Emailed to longstay@beaps.se as soon as it is signed.')}</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost small" onclick="checkSignStatus()">${T('Check status')}</button>
      <button class="btn ghost small" onclick="copySignLink()">${T('Copy link')}</button>
      ${utgangen? '<button class="btn ghost small" onclick="openSignRequest()">'+T('Send again')+'</button>'
                : '<button class="btn ghost small" onclick="openRemind()">'+T('Remind about signing')+'</button>'}
      ${utgangen? '' : '<button class="btn ghost small" onclick="cancelSignLink()">'+T('Revoke')+'</button>'}
    </div>
    ${q.remindedAt? `<div class="hint">${T('Reminder sent')} ${stamp(new Date(q.remindedAt))}</div>` : ''}
  </div>`;
}

/* ---------- a reminder about a link that is still waiting ---------- */
// The same link, to the same address, with a short message the inspector can edit before it
// goes. Nothing is made and nothing is revoked: the server refuses a link that is signed,
// revoked or expired, and only notes on the record that a reminder went. An expired link gets
// "Send again" instead, which makes a new one.
const REMIND_TEXT = 'Hi!\n\nHere is a friendly reminder to sign the inspection report for your apartment. You open and sign via the link below. Please get in touch if you have any questions or need help.\n\nThank you!\nTeam Longstay Beautiful Apartments';
// A link that is still waiting: pending on the record and not past its date.
const canRemind = q => linkPending(q);
// Each opening of the sheet is one attempt, named once. A retry after a lost answer sends the
// same name, and the server answers it with what the first one did instead of mailing again.
let rmAttempt = null;
function openRemind(){
  const q = S && S.signReq;
  if(!canRemind(q) || document.getElementById('remind')) return;
  rmAttempt = uid();
  const el = document.createElement('div');
  el.className = 'sheet hasbar'; el.id = 'remind';
  el.innerHTML = topbar(T('Remind about signing'), ref(), null, 'closeRemind()') + `<div class="wrap">
    <div class="card">
      <div style="font-size:14px">${T('To')} <b>${esc(q.to)}</b>${q.cc? ', '+T('copy')+' '+esc(q.cc):''}</div>
      <div class="hint">${T('The same signing link is sent again. Edit the message if you like; the link is added below it.')}</div>
      <textarea id="rm_text" style="margin-top:12px;min-height:280px" maxlength="2000">${esc(REMIND_TEXT)}</textarea>
    </div>
    <div class="hint" id="rm_err" style="color:var(--rec);display:none"></div>
  </div>
  <div class="sheetbar">
    <button class="btn ghost small" onclick="closeRemind()">${T('Cancel')}</button>
    <button class="btn" id="rm_send" onclick="sendReminder()">${T('Send reminder')}</button>
  </div>`;
  document.body.appendChild(el);
}
function closeRemind(){ const el = document.getElementById('remind'); if(el) el.remove() }
async function sendReminder(){
  const q = S && S.signReq;
  if(!canRemind(q)) return closeRemind();
  const insp = S, btn = document.getElementById('rm_send'), err = document.getElementById('rm_err');
  if(!btn || btn.disabled) return;   // a tap that landed twice
  const text = (document.getElementById('rm_text')||{value:''}).value;
  const reset = m => { if(!document.getElementById('remind')) return; btn.disabled=false; btn.textContent=T('Send reminder'); err.textContent=m; err.style.display='block' };
  btn.disabled = true; btn.textContent = T('Sending…'); err.style.display='none';
  let r;
  try{
    r = await withTimeout(fetch('/api/sign-remind', {method:'POST', headers:{'Content-Type':'application/json', ...AUTH},
      body: JSON.stringify({t:q.token, text, attempt:rmAttempt})}), 30000);
  }catch(e){ return reset(T('No contact with the server. Check the connection and try again.')) }
  // The server says the link is not waiting any more: show what it has become instead.
  if(r.status===409){ closeRemind(); toast(T('Already signed')); return checkSignStatus(true) }
  if(r.status===410){ closeRemind(); toast(T('The link is no longer valid')); return checkSignStatus(true) }
  if(!r.ok){
    const txt = (await r.text().catch(()=>'')).trim();
    const kort = (txt && txt.length < 160 && txt.indexOf('<') < 0) ? txt : '';
    // Two kinds of 404: the function saying the record is not there (a short plain text), and a
    // host that has no such function at all (Netlify answers its own page).
    return reset(r.status===429? (/less than a minute/.test(kort)? T('A reminder was sent less than a minute ago.') : T("Today's email limit is reached. Try again later."))
               : r.status===401? (loginNeeded(r)? T('Log in and try again.') : T('The app needs updating — reload the page and try again.'))
               : r.status===404? (kort? T('The link was not found on the server. Check the status, or send a new link.') : T('Reminders are not available on this server yet.'))
               : (kort || T('Could not send') + ' (' + r.status + ').'));
  }
  // Cloudflare answers the app's own HTML with 200 on an unknown /api path - require a real ok.
  let j = null; try{ j = await r.json() }catch(e){}
  if(!j || j.ok !== true) return reset(T('The server responded unexpectedly. Try again.'));
  if(S !== insp || !S.signReq || S.signReq.token !== q.token){ closeRemind(); return toast(T('Reminder sent')) }
  S.signReq.remindedAt = j.remindedAt || Date.now();
  S.signReq.reminders = j.reminders || ((q.reminders||0) + 1);
  if(!j.repeated) log(`Reminder sent to ${q.to}${q.cc? ' (copy '+q.cc+')' : ''}`);   // the first answer was lost; nothing new went out
  await flushSave();
  closeRemind(); toast(T('Reminder sent')); render();
}
