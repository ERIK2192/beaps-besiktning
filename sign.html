<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F1ED">
<title>Signera besiktningsprotokoll</title>
<style>
  :root{
    --paper:#F2F1ED; --card:#FFFFFF; --ink:#16325C; --ink2:#6E7C94;
    --line:#E0DDD7; --brand:#FFC629; --brand-dark:#E9AF12; --rec:#C2352F; --ok:#1F7A4D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
  h1,h2{margin:0;font-weight:650;letter-spacing:-.01em}
  h1{font-size:19px} h2{font-size:15px}
  button{font-family:inherit;font-size:16px;cursor:pointer;border:0;background:none;color:inherit}
  input{font-family:inherit;font-size:16px;width:100%;padding:12px 13px;border:1px solid var(--line);
        border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  label{display:block;margin:0 0 6px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
  .hint{font-size:13px;color:var(--ink2);margin-top:6px}

  .top{background:rgba(242,241,237,.93);border-bottom:1px solid var(--line);
       padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
  .top .row{display:flex;align-items:center;gap:12px;justify-content:space-between;max-width:760px;margin:0 auto}
  .logo{height:26px;width:auto;display:block;flex:none}
  .logo-fallback{font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;flex:none}

  .wrap{padding:16px;max-width:760px;margin:0 auto calc(24px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .field{margin-bottom:12px} .field:last-child{margin-bottom:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:11px;
       font-weight:650;width:100%;background:var(--brand);color:var(--ink);min-height:50px;border:1px solid var(--brand-dark)}
  .btn:active{background:var(--brand-dark)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:9px 13px;min-height:42px;font-size:14px;width:auto}

  .meta{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:14px;margin-top:12px}
  .meta dt{color:var(--ink2);margin:0}
  .meta dd{margin:0;font-weight:600}

  .doc{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;height:62vh;min-height:340px}
  .doc iframe{width:100%;height:100%;border:0;display:block}
  .docfall{padding:26px 18px;text-align:center;color:var(--ink2);font-size:14px}

  .readrow{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid var(--line);
           border-radius:11px;background:#FBFAF8;cursor:pointer}
  .readrow input{width:22px;height:22px;flex:none;margin:1px 0 0;padding:0;accent-color:var(--ink)}
  .readrow span{font-size:14px;line-height:1.4}

  .sigpad{border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;
          width:100%;height:190px;display:block}
  .padrow{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .padrow .btn.small{flex:none;white-space:nowrap}
  .padrow .hint{flex:1 1 160px;min-width:0}
  .locknote{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
            background:var(--brand);border:1px solid var(--brand-dark);border-radius:6px;padding:6px 9px;display:inline-block}
  .locknote.ok{background:#E7F3EC;border-color:#BFE0CD;color:var(--ok)}
  .locknote.bad{background:#FBF2F1;border-color:#E3CDCB;color:var(--rec)}
  .big{text-align:center;padding:34px 18px}
  .big .mark{font-size:34px;line-height:1;margin-bottom:12px;font-weight:650}
  .err{color:var(--rec);font-size:14px;margin-top:10px}
</style>

<div class="top"><div class="row">
  <div><div class="eyebrow">Besiktningsprotokoll</div><h1 id="title">Signering</h1></div>
  <img class="logo" src="logo.png" alt="Beaps" onerror="this.outerHTML='<span class=&quot;logo-fallback&quot;>Beaps</span>'">
</div></div>
<div class="wrap" id="app"><div class="card"><div class="big">Hämtar protokollet…</div></div></div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stamp = ms => new Intl.DateTimeFormat('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit',
  hour:'2-digit',minute:'2-digit'}).format(new Date(ms)).replace(',','');
const token = (new URLSearchParams(location.search).get('t')||'').replace(/[^a-f0-9]/g,'');

let meta = null, pad = null, sending = false;

function card(inner){ return `<div class="card">${inner}</div>` }

function screenMessage(kind, mark, rubrik, text){
  app.innerHTML = card(`<div class="big">
    <div class="mark">${mark}</div>
    <h1 style="margin-bottom:8px">${esc(rubrik)}</h1>
    <div style="font-size:14px;color:var(--ink2)">${text}</div>
    ${kind? `<div style="margin-top:16px"><span class="locknote ${kind}">${kind==='ok'?'Klart':'Länken går inte att signera'}</span></div>`:''}
  </div>`);
}

function objekt(){ return meta.ref || [meta.address, meta.apt].filter(Boolean).join(', ') || 'Besiktning' }

async function load(){
  if(token.length !== 48){
    return screenMessage('bad','!','Länken är ofullständig',
      'Kopiera hela adressen från mejlet, inklusive den långa koden efter <code>t=</code>.');
  }
  let r;
  try{ r = await fetch('/api/sign-load?t='+token) }
  catch(e){ return screenMessage('bad','!','Ingen kontakt','Kontrollera uppkopplingen och ladda om sidan.') }
  if(!r.ok){
    return screenMessage('bad','!','Länken fungerar inte',
      r.status===404? 'Protokollet finns inte längre. Be Beaps skicka en ny länk.'
                    : 'Något gick fel ('+r.status+'). Be Beaps skicka en ny länk.');
  }
  meta = await r.json();
  document.title = 'Signera – ' + objekt();
  $('#title').textContent = objekt();

  if(meta.status === 'signed') return signedScreen();
  if(meta.status === 'cancelled')
    return screenMessage('bad','!','Länken är återkallad',
      'Protokollet har ändrats efter att länken skickades. Beaps skickar en ny länk.');
  if(meta.status === 'expired')
    return screenMessage('bad','!','Länken har gått ut',
      'Länken gällde till '+esc(stamp(meta.expires))+'. Be Beaps skicka en ny.');
  return signForm();
}

function signedScreen(){
  screenMessage('ok','✓','Protokollet är signerat',
    (meta.signedName? esc(meta.signedName)+' signerade ' : 'Signerat ')
    + esc(stamp(meta.signedAt)) + '.<br>En kopia har mejlats till dig och till Beaps.');
}

function signForm(){
  app.innerHTML =
    card(`<div class="eyebrow">Du ombeds signera</div>
      <h1 style="margin:6px 0 0">${esc(objekt())}</h1>
      <dl class="meta">
        ${meta.type? `<dt>Typ</dt><dd>${esc(meta.type)}</dd>`:''}
        <dt>Besiktningsman</dt><dd>${esc(meta.inspector||'-')}</dd>
        <dt>Upprättat</dt><dd>${esc(stamp(meta.created))}</dd>
        <dt>Länken gäller till</dt><dd>${esc(stamp(meta.expires))}</dd>
      </dl>`) +

    card(`<div class="eyebrow" style="margin-bottom:10px">Protokollet</div>
      <div class="doc"><iframe id="doc" src="/api/sign-pdf?t=${token}" title="Besiktningsprotokoll"></iframe></div>
      <div class="padrow" style="margin-top:10px">
        <a class="btn ghost small" style="text-decoration:none" href="/api/sign-pdf?t=${token}" target="_blank" rel="noopener">Öppna i ny flik</a>
        <span class="hint" style="margin:0">Visas dokumentet inte här, öppna det i ny flik.</span>
      </div>`) +

    card(`<label class="readrow" for="read">
        <input type="checkbox" id="read">
        <span>Jag har läst hela protokollet, inklusive bilder och kommentarer, och godkänner innehållet.</span>
      </label>`) +

    card(`<div class="eyebrow" style="margin-bottom:10px">Din signatur</div>
      <div class="field"><label class="eyebrow">Namn</label>
        <input id="name" value="${esc(meta.recipientName||'')}" autocomplete="name" placeholder="För- och efternamn"></div>
      <div class="field"><label class="eyebrow">Företag eller roll</label>
        <input id="role" value="${esc(meta.recipientRole||'')}" autocomplete="organization" placeholder="T.ex. relocation agent"></div>
      <canvas class="sigpad" id="pad"></canvas>
      <div class="padrow">
        <button class="btn ghost small" onclick="clearPad()">Rensa</button>
        <span class="hint" style="margin:0">Rita din namnteckning i rutan.</span>
      </div>
      <button class="btn" id="send" style="margin-top:14px" onclick="submit()" disabled>Signera och skicka</button>
      <div class="hint">När du signerar mejlas det färdiga protokollet till Beaps och en kopia till dig.</div>
      <div class="err" id="err" style="display:none"></div>`);

  initPad();
  $('#read').addEventListener('change', refresh);
  $('#name').addEventListener('input', refresh);
  refresh();
}

function refresh(){
  const ready = $('#read').checked && $('#name').value.trim().length > 1 && pad && !pad.isEmpty();
  $('#send').disabled = !ready || sending;
}

function initPad(){
  const c = $('#pad');
  const dpr = window.devicePixelRatio||1, r = c.getBoundingClientRect();
  c.width = r.width*dpr; c.height = r.height*dpr;
  const x = c.getContext('2d'); x.scale(dpr,dpr);
  x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#16325C';
  let drawing=false, empty=true;
  const pt = e => { const b=c.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top] };
  c.addEventListener('pointerdown', e=>{ drawing=true; empty=false; c.setPointerCapture(e.pointerId);
    const[a,b]=pt(e); x.beginPath(); x.moveTo(a,b); refresh() });
  c.addEventListener('pointermove', e=>{ if(!drawing)return; const[a,b]=pt(e); x.lineTo(a,b); x.stroke() });
  c.addEventListener('pointerup', ()=>{ drawing=false; refresh() });
  c.addEventListener('pointercancel', ()=>{ drawing=false; refresh() });
  pad = { c, isEmpty:()=>empty, reset:()=>{ x.clearRect(0,0,c.width,c.height); empty=true; refresh() } };
}
function clearPad(){ pad && pad.reset() }

async function submit(){
  if(sending) return;
  const err = $('#err'), btn = $('#send');
  err.style.display='none';
  sending = true; btn.disabled = true; btn.textContent = 'Skickar…';

  // vit botten sa signaturen syns aven i PDF-lasare som inte hanterar transparens
  const src = pad.c;
  const flat = document.createElement('canvas');
  flat.width = src.width; flat.height = src.height;
  const fx = flat.getContext('2d');
  fx.fillStyle = '#FFFFFF'; fx.fillRect(0,0,flat.width,flat.height);
  fx.drawImage(src, 0, 0);

  try{
    const r = await fetch('/api/sign-complete', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ t: token, sig: flat.toDataURL('image/png'),
        name: $('#name').value.trim(), role: $('#role').value.trim() })
    });
    if(r.ok){
      const out = await r.json();
      meta.status='signed'; meta.signedAt=out.signedAt; meta.signedName=$('#name').value.trim();
      window.scrollTo(0,0);
      return signedScreen();
    }
    if(r.status===409){ meta.status='signed'; meta.signedAt=Date.now(); return signedScreen() }
    // servern svarar med korta klartextfel; en HTML-sida betyder att funktionen inte
    // är igång, och den ska inte hällas ut över signeringssidan
    const txt = (await r.text().catch(()=>'')).trim();
    const kort = (txt && txt.length < 160 && txt.indexOf('<') < 0) ? txt : '';
    err.textContent = kort || ('Det gick inte att skicka just nu (' + r.status + '). Försök igen, eller hör av dig till Beaps.');
  }catch(e){
    err.textContent = 'Ingen kontakt med servern. Kontrollera uppkopplingen och försök igen.';
  }
  err.style.display='block';
  sending = false; btn.textContent = 'Signera och skicka';
  refresh();
}

load();
</script>
